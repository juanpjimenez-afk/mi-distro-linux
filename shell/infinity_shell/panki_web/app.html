    renderPanel();return;
  }
  hist.push(text);hi=hist.length;
  addMsg('user',esc(text));

  const n=norm(text);
  if(MODE_FAST.test(n)){
    setMode('fast');
    addMsg('ai','<p>⚡ <b>Modelo Rápido activado</b>. A partir de ahora las respuestas son instantáneas, directas y 100% sin internet.</p>');
    renderPanel();syncChatDOM();return;
  }
  if(MODE_DEEP.test(n)){
    setMode('deep');
    addMsg('ai',`<div class="deep-card"><div class="deep-badge">🧠 Modelo Profundo</div><p><b>Modelo Profundo activado</b>. Ahora evaluaré cada consulta con razonamiento deliberativo por fases, mayor análisis y planificación avanzada.${S.web!==false?' Además puedo consultar internet para preguntas cotidianas (clima, divisas, datos…): solo envío el tema de la pregunta y antes te muestro qué envío; tus tareas, notas y perfil nunca salen.':' Internet está desactivado: todo queda en tu navegador.'}</p></div>`);
    renderPanel();syncChatDOM();return;
  }
  if(NOT_DEEP.test(n)){
    setMode('fast');
    addMsg('ai','<p>⚡ Entendido: paso al <b>modo Rápido</b>, instantáneo y sin internet.</p>');
    renderPanel();syncChatDOM();return;
  }
  if(NOT_FAST.test(n)){
    setMode('deep');
    addMsg('ai',`<p>🧠 Entendido: paso al <b>modo Profundo</b>.${S.web!==false?' Puedo consultar internet para preguntas generales, y antes te muestro qué envío.':''}</p>`);
    renderPanel();syncChatDOM();return;
  }
  if(/^(?:desactiva|apaga|deshabilita|quita)\s+(?:el\s+|la\s+)?(?:internet|conexion|busqueda web|consultas web)$|^no\s+uses\s+(?:el\s+)?internet$|^modo\s+(?:sin conexion|offline)$/.test(n)){
    setWeb(false);
    addMsg('ai','<p>🔌 <b>Internet desactivado</b>. El modo Profundo seguirá razonando, pero solo con lo que hay en tu navegador: no se enviará nada fuera.</p>');
    renderPanel();syncChatDOM();return;
  }
  if(/^(?:usa|activa|habilita|enciende)\s+(?:el\s+)?internet$|^modo\s+(?:online|con conexion)$/.test(n)){
    setWeb(true);
    addMsg('ai',S.mode==='fast'?'<p>🌐 <b>Internet activado</b>, pero sigues en modo ⚡ Rápido, que nunca usa internet. Cambia al modo 🧠 Profundo para usarlo.</p><button class="pill" data-say="modo profundo">Cambiar al modo Profundo</button>':'<p>🌐 <b>Internet activado en modo Profundo</b>. Puedo buscar clima, divisas, datos y respuestas a preguntas cotidianas. Solo envío el tema de la pregunta, nunca tus tareas ni notas.</p>');
    renderPanel();syncChatDOM();return;
  }
  if(DIAG.test(n)&&(S.mode==='fast'||S.web===false)){
    addMsg('ai',S.mode==='fast'?'<p>El modo ⚡ Rápido nunca usa internet. Cambia al modo 🧠 Profundo si quieres probar la conexión.</p><button class="pill" data-say="modo profundo">Cambiar al modo Profundo</button>':'<p>Tienes internet desactivado. Dime «activa internet» y lo probamos.</p><button class="pill" data-say="activa internet">Activar internet</button>');
    renderPanel();syncChatDOM();return;
  }

  if(S.mode==='fast'){
    let out;try{out=respond(text)}catch(e){console.error(e);out='<p>Algo salió mal con eso. Intenta decirlo de otra forma.</p>'}
    addMsg('ai',out);renderPanel();syncChatDOM();
  }else{
    await sayDeep(text);
  }
}

async function sayDeep(text){
  isThinking=true;go.disabled=true;input.disabled=true;
  const msgEl=document.createElement('div');
  msgEl.className='m a';
  msgEl.innerHTML=`
    <details class="thought-box" open>
      <summary><span class="spin">⚙️</span> <span class="thought-lbl">Razonando paso a paso…</span></summary>
      <div class="thought-steps"></div>
      <div class="web-cancel-row" hidden><button type="button" class="pill web-cancel">Cancelar consulta</button></div>
    </details>
    <div class="deep-out"></div>
  `;
  chat.appendChild(msgEl);
  scroll.scrollTop=scroll.scrollHeight;

  const stepsBox=msgEl.querySelector('.thought-steps');
  const summaryLbl=msgEl.querySelector('.thought-lbl');
  const summaryIco=msgEl.querySelector('summary span:first-child');
  const deepOut=msgEl.querySelector('.deep-out');
  const cancelRow=msgEl.querySelector('.web-cancel-row');
  msgEl.querySelector('.web-cancel').onclick=()=>webAbortAll();

  const c=prepInput(text);
  /* ¿es una pregunta para internet? Primero lo local: órdenes, notas y datos personales nunca llegan aquí */
  const ask0=webAsk;webAsk=null;
  const confirming=pending&&(AFF.test(c.n)||NEG.test(c.n)); /* una confirmación pendiente tiene prioridad */
  let it=null,nSteps=0;const sent0=webSent;
  try{
    if(webOn()&&!c.empty&&!c.onlyEmoji){
      const fresh=ask0&&Date.now()-ask0.t<18e4;
      if(fresh&&AFF.test(c.n))it=ask0.it;                       /* permiso concedido */
      else if(fresh&&NEG.test(c.n))it={kind:'declined'};          /* permiso denegado */
      else if(!confirming)it=DIAG.test(c.n)?{kind:'diag'}:(webFollowUp(c)||webIntent(c));
    }
  }catch(e){console.error(e)}
  if(it){pending=null;awaitName=false;convReset();last={}}
  const addStepNow=t=>{const d=document.createElement('div');d.className='thought-step';d.textContent=t;stepsBox.appendChild(d);nSteps++;scroll.scrollTop=scroll.scrollHeight};
  const addStep=async t=>{await sleep(550);addStepNow(t)};
  const goWeb=async()=>{
    const net=!it.consent&&!['declined','more','fxask','fxpeso'].includes(it.kind)&&!(it.kind==='weather'&&it.ask);
    if(net){summaryLbl.textContent='Consultando internet…';cancelRow.hidden=false}
    webBudget(net?13000:0);
    try{
      const html=await runWeb(it,addStepNow);
      if(html)return html;
      addStepNow('Sin resultados relevantes en las fuentes consultadas.');
      return webNone(text);
    }catch(e){
      if(!(e instanceof WebErr)){console.error(e);e=new WebErr('bad',e&&e.message)}
      if(e.kind==='cancel'||e.kind==='blocked'){addStepNow(e.kind==='blocked'?'No consulto internet: estás en un modo sin internet.':'Consulta cancelada.');return webNF(e.kind==='blocked'?'No consulté internet porque estás en un modo sin internet.':'Consulta cancelada.')}
      addStepNow('Sin respuesta del servicio: '+({offline:'no hay conexión',timeout:'tiempo agotado',http:'el servicio devolvió un error',bad:'respuesta inesperada'}[e.kind]||'error de red')+'.');
      return webFail(e,text);
    }finally{cancelRow.hidden=true;webBudget(0)}
  };

  try{
    const first=it?webTrace(it,c):generateThoughtTrace(c);
    for(const s of first)await addStep(s);
    await sleep(400);

    let answer;
    if(it)answer=await goWeb();
    else{
      answer=respondDeep(text,{canWeb:webOn()});
      if(answer&&typeof answer==='object'&&answer.web){
        it=answer.web;
        for(const s of webTrace(it,c))await addStep(s);
        answer=await goWeb();
      }else webCtx=null;
    }
    deepOut.innerHTML=answer;

    const used=webSent>sent0;
    summaryIco.className='';
    summaryIco.textContent=used?'🌐':'💡';
    summaryLbl.textContent=`Proceso de razonamiento (${pl(nSteps,'etapa','etapas')}${used?', con internet':''})`;

    const details=msgEl.querySelector('details');
    if(details)details.removeAttribute('open');

    cancelRow.remove(); /* el botón Cancelar es solo para mientras dura la consulta: no se guarda en el historial */
    S.chat.push({r:'ai',h:msgEl.innerHTML});
    save();
  }catch(e){
    console.error(e);
    summaryIco.className='';summaryIco.textContent='⚠️';summaryLbl.textContent='No pude completar la respuesta';
    cancelRow.hidden=true;
    deepOut.innerHTML='<p>Ocurrió un error en el razonamiento profundo. Intenta reformular tu consulta.</p>';
    const dt=msgEl.querySelector('details');if(dt)dt.removeAttribute('open');
    cancelRow.remove();
    S.chat.push({r:'ai',h:msgEl.innerHTML});save();
  }finally{
    isThinking=false;
    input.disabled=false;
    const ae=document.activeElement;if(!ae||ae===document.body||ae===input)input.focus(); /* no le quito el foco al buscador del panel */
    go.disabled=!input.value.trim();
    renderPanel();
    syncChatDOM();
    scroll.scrollTop=scroll.scrollHeight;
  }
}
function act(cmd){
  if(cmd==='guardar-largo'){if(LONGTXT){addNote(LONGTXT.slice(0,20000));LONGTXT='';toast('Guardada en notas');renderPanel()}return}
  let out;try{out=respond(cmd)}catch(e){console.error(e);return}
  const t=document.createElement('div');t.innerHTML=out;
  toast((t.textContent||'Hecho').trim().slice(0,70));renderPanel();syncChatDOM();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-say],[data-cmd],[data-fill],[data-tab],[data-ics]');if(!b)return;
  if(b.dataset.ics){
    const t=S.tasks.find(x=>x.id===+b.dataset.ics);
    if(t)downloadICS([t],`evento-${t.id}.ics`);
  }
  else if(b.dataset.say){say(b.dataset.say)}
  else if(b.dataset.cmd){act(b.dataset.cmd)}
  else if(b.dataset.fill){input.value=b.dataset.fill;input.focus();go.disabled=false}
  else if(b.dataset.tab){tab=b.dataset.tab;renderPanel()}
});
$('#form').addEventListener('submit',e=>{e.preventDefault();const v=input.value;input.value='';go.disabled=true;say(v)});
input.addEventListener('input',()=>go.disabled=!input.value.trim());
input.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'&&hist.length){e.preventDefault();hi=Math.max(0,hi-1);input.value=hist[hi]||'';go.disabled=!input.value}
  else if(e.key==='ArrowDown'&&hist.length){e.preventDefault();hi=Math.min(hist.length,hi+1);input.value=hist[hi]||'';go.disabled=!input.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#panel').classList.remove('open');if(isThinking)webAbortAll()}if(e.key==='/'&&document.activeElement!==input&&document.activeElement!==psearch){e.preventDefault();input.focus()}});
$('#menu').onclick=()=>{$('#panel').classList.toggle('open');renderPanel()};
$('#close').onclick=()=>$('#panel').classList.remove('open');
$('#chips').innerHTML=['Organiza mi día','Mis tareas','Organiza mi semana','Resumen','Ayuda'].map(s=>`<button class="pill" data-say="${s}">${s}</button>`).join('');

let tab='tasks',filterQ='';
psearch.addEventListener('input',()=>{filterQ=norm(psearch.value.trim());renderPanel()});
psearch.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&psearch.value.trim()){
    const v=psearch.value.trim();psearch.value='';filterQ='';
    if(tab==='notes')act('Nota: '+v);else act('Tarea: '+v);
  }
});

function renderPanel(){
  const p=$('#panel');if(!p)return;
  document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#psearchWrap').style.display=tab==='me'?'none':'block';
  psearch.placeholder=tab==='notes'?'Filtrar notas o Enter para crear…':'Filtrar tareas o Enter para crear…';
  const body=$('#pbody');let h='';
  const matchF=x=>!filterQ||norm(x.title).includes(filterQ)||norm(x.cat).includes(filterQ)||String(x.id)===filterQ;

  if(tab==='tasks'){
    const pend=S.tasks.filter(t=>!t.done&&matchF(t)),done=S.tasks.filter(t=>t.done&&matchF(t));
    h=pend.length?renderGroups(groupTasks(pend)):'<div class="empty">Sin tareas pendientes</div>';
    if(done.length)h+=`<h4>Completadas · ${done.length}</h4>`+done.slice(-8).reverse().map(row).join('')+`<div class="btns"><button class="pill" data-cmd="limpia completadas">Limpiar completadas</button></div>`;
  }else if(tab==='agenda'){
    const tk=dkey(new Date());
    const dated=S.tasks.filter(t=>!t.done&&t.due&&matchF(t)).sort(cmp);
    if(!dated.length){
      h='<div class="empty">No tienes reuniones ni tareas con fecha programada.</div>';
    }else{
      const byDay={};
      dated.forEach(t=>{(byDay[t.due]=byDay[t.due]||[]).push(t)});
      Object.keys(byDay).sort().forEach(dk=>{
        const lbl=dk===tk?'Hoy':dk<tk?`Vencido (${dueLabel({due:dk})})`:capFirst(dueLabel({due:dk}));
        h+=`<h4>${esc(lbl)}</h4>`+byDay[dk].map(row).join('');
      });
      h+=`<div class="btns"><button class="pill" id="icsAll">📅 Exportar agenda (.ics)</button></div>`;
    }
  }else if(tab==='notes'){
    const list=S.notes.filter(matchF);
    h=list.length?list.slice().reverse().map(noteRow).join(''):'<div class="empty">Sin notas</div>';
  }else{
    const pr=S.profile,l=[['Nombre',pr.name],['Vives en',pr.city],['Trabajo',pr.work],['Estudias',pr.study]].filter(x=>x[1]);
    h='<h4>Lo que sé de ti</h4>'+(l.length||S.facts.length?l.map(([k,v])=>`<div class="fact"><span><span class="meta">${k}: </span>${esc(v)}</span></div>`).join('')+S.facts.map(f=>`<div class="fact"><span>${esc(f.text)}</span><button class="x" style="opacity:1" data-cmd="olvida ${esc(f.text)}">×</button></div>`).join(''):'<div class="empty">Aún nada. Cuéntame de ti.</div>');
    const ins=insights();if(ins.length)h+='<h4>Lo que observo</h4>'+ins.map(i=>`<div class="fact">${esc(i)}</div>`).join('');
    h+=webPanel();
    h+='<div class="btns"><button class="pill" id="bk">Exportar respaldo</button><button class="pill" id="im">Importar</button><button class="pill" id="rs">Borrar todo</button></div><p class="sub" style="margin-top:14px">Tus datos solo existen en este navegador. El modo Rápido nunca usa internet.</p>';
  }
  body.innerHTML=h;
  const wt=$('#webTog');if(wt)wt.onclick=()=>setWeb(S.web===false);
  const icsB=$('#icsAll');if(icsB)icsB.onclick=()=>downloadICS(S.tasks.filter(t=>!t.done&&t.due));
  const bk=$('#bk');if(bk){bk.onclick=exportData;$('#im').onclick=()=>$('#file').click();$('#rs').onclick=()=>{if(confirm('¿Borrar todos tus datos de infinitOS?')){snap();const keep=S.chat;S=Object.assign(blank(),{chat:keep,asked:true,mode:S.mode,web:S.web});save();updateModeUI();renderPanel();syncChatDOM();toast('Datos borrados')}}}
}
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;snap();const keep={chat:S.chat,mode:S.mode,web:S.web};S=Object.assign(blank(),cleanImport(d),keep);save();updateModeUI();renderPanel();syncChatDOM();toast('Respaldo restaurado')}catch(x){toast('Archivo no válido')}};
  r.readAsText(f);e.target.value='';
};

/* ---------- arranque ---------- */
updateModeUI();
window.addEventListener('storage',e=>{if(e.key===PREFKEY&&e.newValue){applyPrefs(e.newValue);if(S.mode==='fast'||S.web===false)webAbortAll();updateModeUI();renderPanel()}});
$('#btnDeep').onclick=()=>setMode('deep');
$('#btnFast').onclick=()=>setMode('fast');
while(S.chat.length&&S.chat[S.chat.length-1].r==='user')S.chat.pop(); /* una recarga a mitad de respuesta no deja un mensaje sin contestar */
S.chat.slice(-30).forEach(m=>addMsg(m.r,cleanHTML(m.h),false));
syncChatDOM();
if(!S.asked){S.asked=true;awaitName=true;addMsg('ai',briefing());S.lastBrief=Date.now()}
else if(Date.now()-S.lastBrief>3*36e5){addMsg('ai',briefing());S.lastBrief=Date.now()}
save();renderPanel();tick();setInterval(tick,15000);lastGreet=Date.now();
</script>
