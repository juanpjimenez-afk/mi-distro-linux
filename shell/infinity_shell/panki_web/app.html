<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; script-src-attr 'none'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://es.wikipedia.org https://es.wikibooks.org https://geocoding-api.open-meteo.com https://api.open-meteo.com https://open.er-api.com https://api.frankfurter.app https://restcountries.com https://api.mymemory.translated.net https://api.dictionaryapi.dev https://api.coingecko.com; form-action 'none'; base-uri 'none'">
<title>infinitOS</title>
<style>
:root{--bg:#fbfbfa;--fg:#1a1a1a;--mut:#8a8a85;--line:#e7e6e2;--card:#fff;--acc:#2f5bea;--hi:#e5484d;--ok:#2e9d62}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f10;--fg:#ececea;--mut:#8b8b88;--line:#262628;--card:#171719;--acc:#7c9bff}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:none;border-bottom:1px solid transparent}
.logo{font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}.logo b{color:var(--acc);font-weight:600;margin-right:2px}
#timerPill{display:none;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--acc)}
#timerPill.on{display:inline-flex}
#timerPill button{color:var(--mut);font-size:14px;line-height:1;padding:0 2px}
#timerPill button:hover{color:var(--hi)}
#menu{width:34px;height:34px;border-radius:50%;color:var(--mut);display:grid;place-items:center}
#menu:hover{background:var(--line);color:var(--fg)}
#scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.wrap{max-width:680px;margin:0 auto;padding:6px 20px 24px}
.m{margin:16px 0;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.m.u{text-align:right}
.m.u span{display:inline-block;max-width:85%;text-align:left;background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:18px}
.m p{margin:0 0 8px}.m p:last-child{margin:0}
.m h4,#pbody h4{font-size:12px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.sub,.meta{color:var(--mut);font-size:13px}
code{font:inherit;font-size:14px;background:var(--line);padding:1px 7px;border-radius:6px;cursor:pointer}
.row{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.row .id{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none;min-width:20px}
.row .ttl{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .ttl{text-decoration:line-through;color:var(--mut)}
.row.over .meta{color:var(--hi)}
.chk{flex:none;width:18px;height:18px;border:1.5px solid var(--mut);border-radius:50%;position:relative}
.chk:hover{border-color:var(--acc)}
.row.done .chk{background:var(--ok);border-color:var(--ok)}
.row.done .chk::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--hi);flex:none}
.ico{color:var(--mut);opacity:0;font-size:13px;line-height:1;padding:2px 4px;border-radius:4px}
.row:hover .ico,.row:hover .x{opacity:1}
.ico:hover{color:var(--acc);background:var(--line)}
.x{color:var(--mut);opacity:0;font-size:18px;line-height:1;padding:0 4px}
.x:hover{color:var(--hi)}
.note .ttl{white-space:pre-wrap}
.slot{display:flex;gap:12px;align-items:center}.slot>b{flex:none;width:96px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--acc)}.slot .row{flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px;color:var(--mut);margin:6px 6px 0 0;background:var(--card)}
.pill:hover{color:var(--fg);border-color:var(--mut)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc)}
.stat{display:flex;gap:10px;align-items:center;font-size:13px}.stat span:first-child{width:78px;color:var(--mut)}
footer{flex:none;padding:0 20px 18px}
.fw{max-width:680px;margin:0 auto}
#chips{display:flex;flex-wrap:wrap;margin-bottom:8px}
form{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:5px 5px 5px 18px;transition:border-color .15s}
form:focus-within{border-color:var(--mut)}
#in{flex:1;border:0;outline:0;background:none;font:inherit;color:inherit;padding:7px 0;min-width:0}
#in::placeholder{color:var(--mut)}
#go{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
#go:disabled{opacity:.25;cursor:default}
#panel{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100%;background:var(--card);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;z-index:5;display:flex;flex-direction:column}
#panel.open{transform:none;box-shadow:-12px 0 40px rgba(0,0,0,.08)}
#tabs{display:flex;gap:2px;padding:12px 14px 0;border-bottom:1px solid var(--line);align-items:center}
#tabs button{padding:8px 10px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
#tabs button.on{color:var(--fg);border-color:var(--fg)}
#tabs .sp{flex:1}
#psearchWrap{padding:10px 18px 2px}
#psearch{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 11px;font:inherit;font-size:13.5px;outline:0}
#psearch:focus{border-color:var(--mut)}
#pbody{flex:1;overflow:auto;padding:8px 18px 24px}
#pbody .empty{color:var(--mut);padding:24px 0;text-align:center}
.fact{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.hdr-right{display:flex;align-items:center;gap:10px}
.model-switch{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.m-pill{padding:3px 11px;font-size:12px;font-weight:500;border-radius:999px;color:var(--mut);transition:all .18s ease;line-height:1.4}
.m-pill:hover{color:var(--fg)}
.m-pill.on{background:var(--fg);color:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.thought-box{margin:4px 0 10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--mut);transition:border-color .15s}
.thought-box summary{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-weight:500;outline:0;color:var(--mut)}
.thought-box summary:hover{color:var(--fg)}
.thought-box summary::marker,.thought-box summary::-webkit-details-marker{display:none}
.thought-box summary::before{content:"▶";font-size:8px;transition:transform .15s;display:inline-block}
.thought-box[open] summary::before{transform:rotate(90deg)}
.thought-steps{margin-top:6px;padding-left:14px;border-left:1.5px solid var(--line);display:flex;flex-direction:column;gap:4px}
.thought-step{line-height:1.45;color:var(--fg);font-size:12px;opacity:0;animation:fadeIn .25s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateX(-3px)}to{opacity:1;transform:none}}
.spin{display:inline-block;animation:spin 1s linear infinite;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.deep-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:4px 0}
.deep-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
/* fuentes de las respuestas con internet y textos largos que no deben desbordar */
.web-src{margin-top:8px}.web-src a{color:var(--acc);text-decoration:none}.web-src a:hover{text-decoration:underline}
.web-src{color:var(--mut);color:color-mix(in srgb,var(--fg) 62%,var(--bg))}
.thought-step,.deep-card,.m.u span,.thought-lbl{overflow-wrap:anywhere}.web-cancel-row{margin:6px 0 2px}
@media(max-width:480px){.logo span:first-child{font-size:14px}.m-pill{padding:3px 7px;font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="logo">
    <span><b>∞</b>infinitOS</span>
    <span id="timerPill"><span id="timerTxt">00:00</span><button id="timerStop" title="Cancelar temporizador" aria-label="Cancelar temporizador">×</button></span>
  </div>
  <div class="hdr-right">
    <div class="model-switch" id="modelSwitch" role="radiogroup" aria-label="Modo de Inteligencia">
      <button type="button" class="m-pill on" id="btnDeep" role="radio" aria-checked="true" data-mode="deep" title="Modelo Profundo: más lento y deliberativo; puede consultar internet para preguntas cotidianas">🧠 Profundo</button>
      <button type="button" class="m-pill" id="btnFast" role="radio" aria-checked="false" data-mode="fast" title="Modelo Rápido: instantáneo y 100% sin internet">⚡ Rápido</button>
    </div>
    <button id="menu" aria-label="Panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </div>
</header>
<div id="scroll"><div class="wrap" id="chat"></div></div>
<footer><div class="fw">
  <div id="chips"></div>
  <form id="form" autocomplete="off">
    <input id="in" placeholder="Escribe una tarea, reunión o pregunta…" autofocus spellcheck="false">
    <button id="go" type="submit" aria-label="Enviar" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
</div></footer>
<aside id="panel">
  <div id="tabs">
    <button data-tab="tasks" class="on">Tareas</button>
    <button data-tab="agenda">Agenda</button>
    <button data-tab="notes">Notas</button>
    <button data-tab="me">Yo</button>
    <span class="sp"></span>
    <button id="close" aria-label="Cerrar">✕</button>
  </div>
  <div id="psearchWrap"><input id="psearch" placeholder="Filtrar o presiona Enter para crear…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  <div id="pbody"></div>
</aside>
<div id="toast"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
/* ============================================================
   infinitOS — asistente personal.
   Sin librerías ni cuentas. Todo corre en tu navegador y tus datos
   viven solo en localStorage. El modo Rápido es 100% local (nunca usa
   la red); el modo Profundo puede consultar internet para preguntas
   generales, enviando solo el tema de la pregunta.
   ============================================================ */
'use strict';
const KEY='infinitos.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Normaliza garantizando relación estricta 1:1 en longitud de caracteres (para que m.indices nunca se desfase) */
const NORM_MAP={'á':'a','à':'a','ä':'a','â':'a','ã':'a','é':'e','è':'e','ë':'e','ê':'e','í':'i','ì':'i','ï':'i','î':'i','ó':'o','ò':'o','ö':'o','ô':'o','õ':'o','ú':'u','ù':'u','ü':'u','û':'u','ñ':'n'};
const norm=s=>{
  let out='';
  for(let i=0;i<s.length;i++){
    const c=s[i].toLowerCase();
    out+=NORM_MAP[c]||c;
  }
  return out;
};
const capFirst=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const capWords=s=>s.replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
const pl=(n,a,b)=>`${n} ${n===1?a:b}`;
const pad=n=>String(n).padStart(2,'0');

/* ---------- estado y persistencia ---------- */
const blank=()=>({profile:{},facts:[],tasks:[],notes:[],log:[],model:{},next:1,chat:[],lastBrief:0,asked:false,mode:'deep',web:true});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tasks)){const s=Object.assign(blank(),d);if(!s.mode)s.mode='deep';return s}}catch(e){}return blank()}
let S=load();
/* modo y red se guardan aparte: otra pestaña con datos viejos no puede reactivar internet */
const PREFKEY='infinitos.prefs';
function savePrefs(){try{localStorage.setItem(PREFKEY,JSON.stringify({mode:S.mode,web:S.web}))}catch(e){}}
function applyPrefs(raw){try{const pf=JSON.parse(raw);if(pf&&typeof pf==='object'){if(pf.mode==='fast'||pf.mode==='deep')S.mode=pf.mode;if(typeof pf.web==='boolean')S.web=pf.web}}catch(e){}}
try{applyPrefs(localStorage.getItem(PREFKEY))}catch(e){}
function save(){S.chat=S.chat.slice(-40);S.log=S.log.slice(-600);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const UNDO=[];
function snap(){UNDO.push(JSON.stringify({tasks:S.tasks,notes:S.notes,facts:S.facts,profile:S.profile,model:S.model,next:S.next}));if(UNDO.length>30)UNDO.shift()}
function logAct(k,c){S.log.push({t:Date.now(),k,c})}

/* ---------- fechas ---------- */
const DAYS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const DAYS_ES=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtMin=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const dayDiff=k=>Math.round((fromKey(k)-sod(new Date()))/864e5);

/* Extrae fecha/hora/duración de una frase en español natural. Devuelve {date,time,dur,rest} */
function parseWhen(orig){
  let o=orig,n=norm(orig),date=null,time=null,pod=null,rel=null,dur=null,m;
  const now=new Date(),today=sod(now);
  const cut=re=>{const x=re.exec(n);if(!x)return null;const a=x.index,b=a+x[0].length;o=o.slice(0,a)+' '+o.slice(b);n=n.slice(0,a)+' '+n.slice(b);return x};

  /* Duración explícita: "por 45 minutos", "durante 2 horas", "de 1 hora" */
  if(m=cut(/\b(?:durante|por)\s+(\d+(?:[.,]\d+)?|una|un|media)\s*(horas?|hs?|h|minutos?|mins?|min)\b/)){
    const v=m[1]==='media'?.5:/^un/.test(m[1])?1:parseFloat(m[1].replace(',','.'));
    dur=Math.round(v*(/^h/.test(m[2])?60:1));
  }

  if(cut(/\b(?:al|a)\s+mediodia\b/)){time='12:00';pod='m'}
  else if(cut(/\b(?:a\s+)?medianoche\b/)){time='00:00';pod='n'}
  else if(cut(/\b(?:por|en|de) la manana\b/)){time='09:00';pod='m'}
  else if(cut(/\b(?:por|en|de) la tarde\b/)){time='15:00';pod='t'}
  else if(cut(/\b(?:por|en|de|a) la noche\b/)){time='20:00';pod='n'}
  else if(cut(/\besta tarde\b/)){time='16:00';pod='t';date=today}
  else if(cut(/\b(?:por|en|de) la madrugada\b/)){time='05:00';pod='m'}
  else if(cut(/\besta noche\b/)){time='20:00';pod='n';date=today}

  if(cut(/\ben media hora\b/))rel=new Date(now.getTime()+30*6e4);
  else if(m=cut(/\ben (\d+|un|una) (minutos?|mins?|horas?|hs?|dias?|semanas?|meses|mes)\b/)){
    const k=/^un/.test(m[1])?1:+m[1],u=m[2];
    if(/^min/.test(u))rel=new Date(now.getTime()+k*6e4);
    else if(/^h/.test(u))rel=new Date(now.getTime()+k*36e5);
    else if(/^dia/.test(u))date=addDays(today,k);
    else if(/^sem/.test(u))date=addDays(today,7*k);
    else{const d=new Date(today);d.setMonth(d.getMonth()+k);date=d}
  }
  if(rel){date=sod(rel);time=pad(rel.getHours())+':'+pad(rel.getMinutes())}
  if(!date){
    if(cut(/\bpasado manana\b/))date=addDays(today,2);
    else if(cut(/\bmanana\b/))date=addDays(today,1);
    else if(cut(/\bhoy\b/))date=today;
    else if(cut(/\b(?:este\s+|el\s+)?(?:fin de semana|finde)\b/)){
      const diff=(6-today.getDay()+7)%7;date=addDays(today,diff===0?0:diff);
    }
    else if(cut(/\b(?:la semana que viene|proxima semana|la proxima semana)\b/))date=addDays(today,7);
    else if(m=cut(/\b(?:(?:para el proximo|para el|el proximo|el|este|proximo)\s+)?(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/)){
      date=addDays(today,((DAYS.indexOf(m[1])-today.getDay()+7)%7)||7)}
    else if(m=cut(/\b(?:el\s+)?(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?:\s+(?:de\s+)?(\d{4}))?\b/)){
      let y=m[3]?+m[3]:today.getFullYear();let d=new Date(y,MONTHS.indexOf(m[2]),+m[1]);
      if(!m[3]&&d<today)d=new Date(y+1,d.getMonth(),d.getDate());date=d}
    else if(m=cut(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/)){
      let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):today.getFullYear();let d=new Date(y,+m[2]-1,+m[1]);
      if(!m[3]&&d<today)d=new Date(y+1,d.getMonth(),d.getDate());date=d}
    else if(m=cut(/\bel (\d{1,2})\b(?!\s*(?:de |:|h\b|\/|-))/)){
      let d=new Date(today.getFullYear(),today.getMonth(),+m[1]);if(d<today)d=new Date(today.getFullYear(),today.getMonth()+1,+m[1]);date=d}
  }
  if(!rel){
    let h=null,mi=0,suf=null;
    if(m=cut(/\b(?:a las?|a la)\s+(\d{1,2})\s+y\s+(media|cuarto)\s*(am|pm|hs|h)?\b/)){
      h=+m[1];mi=m[2]==='media'?30:15;suf=m[3];
    }else if(m=cut(/\b(?:a las?|a la)\s+(\d{1,2})(?:[:.h](\d{2}))?\s*(am|pm|hs|h)?\b/)||cut(/\b(\d{1,2}):(\d{2})\s*(am|pm|hs)?\b/)||cut(/\b(\d{1,2})\s*(am|pm)\b/)){
      h=+m[1];
      if(m.length>=4){mi=+(m[2]||0);suf=m[3]}else suf=m[2];
      if(/^\d/.test(suf||'')){suf=null}
    }
    if(h!==null){
      if(suf==='pm'&&h<12)h+=12;else if(suf==='am'&&h===12)h=0;
      else if(!suf){
        if((pod==='t'||pod==='n')&&h<12)h+=12;
        else if(!pod&&h>=1&&h<=6)h+=12; /* "a las 4" suele ser 16:00 en horario diurno */
        else if(!pod&&h>=7&&h<=9&&(!date||dkey(date)===dkey(today))){const nmin=now.getHours()*60+now.getMinutes();if(h*60+mi<nmin&&(h+12)*60+mi>=nmin)h+=12} /* 7–9 también si hoy ya pasó la de la mañana */
      }
      if(h<24&&mi<60)time=pad(h)+':'+pad(mi);
    }
  }
  if(time&&!date){const d=today;if(toMin(time)<now.getHours()*60+now.getMinutes()-1)date=addDays(today,1);else date=d}
  return{date:date?dkey(date):null,time,dur,rest:cleanTitle(o)};
}
function cleanTitle(s){
  s=s.replace(/\s+/g,' ').trim();let p;
  do{p=s;s=s.replace(/(?:^|\s)(?:para|el|a|las|la|de|en|por|que|y|al|este|esta|con)\s*$/i,'').replace(/^[\s,.:;\-–]+|[\s,.:;\-–]+$/g,'').trim()}while(s!==p);
  return s;
}
function dueLabel(t){
  if(!t.due)return t.time||'';
  const d=dayDiff(t.due);let s;
  if(d===0)s='hoy';else if(d===1)s='mañana';else if(d===-1)s='ayer';
  else if(d<0)s=`hace ${-d} d`;else if(d<7)s=DAYS_ES[fromKey(t.due).getDay()];
  else{const x=fromKey(t.due);s=x.getDate()+' '+MONTHS[x.getMonth()].slice(0,3)}
  return s+(t.time?' '+t.time:'');
}

const STOP=new Set('el la los las un una unos unas de del al a en y o u que por para con sin mi mis tu tus su sus se lo le les me te es son hay muy mas pero como cuando donde este esta esto ese esa eso ya si no hoy manana ayer tarea nota'.split(' '));
const stem=w=>w.length>5?w.slice(0,5):w;
const toks=s=>(norm(s).match(/[a-z0-9]+/g)||[]).filter(w=>w.length>2&&!STOP.has(w)).map(stem);
const LEX={

  Hogar:'limpiar cocinar lavar ropa casa arreglar basura cocina bano jardin plantas mudanza reparar ordenar',

};
const CATS=Object.keys(LEX);
const SEED={};CATS.forEach(c=>LEX[c].split(' ').forEach(w=>SEED[stem(w)]=c));
const CSYN={chamba:'Trabajo',laburo:'Trabajo',curro:'Trabajo',oficina:'Trabajo',plata:'Finanzas',guita:'Finanzas',medico:'Salud',casa:'Hogar',dinero:'Finanzas',laboral:'Trabajo',estudios:'Estudio',universidad:'Estudio',amigos:'Social',familia:'Social',compra:'Compras',general:'General',personal:'Personal',salud:'Salud'};
function catByName(s){
  s=norm(s).trim();if(!s)return null;
  if(CSYN[s])return CSYN[s];
  return CATS.find(c=>norm(c)===s)||null;
}
function classify(text){
  const ts=toks(text);let best='General',bs=0;
  for(const c of CATS){let s=0;for(const t of ts){if(SEED[t]===c)s+=2;s+=Math.min((S.model[c]&&S.model[c][t])||0,8)*1.5}if(s>bs){bs=s;best=c}}
  return best;
}
function learn(text,cat,w=3){if(!cat||cat==='General')return;S.model[cat]=S.model[cat]||{};toks(text).forEach(t=>S.model[cat][t]=(S.model[cat][t]||0)+w)}
function findRef(ref,pool){
  ref=ref.trim().replace(/^(?:la|el|esa|ese|esta|este)\s+/i,'');let m;
  if(m=ref.match(/^(?:tarea\s+|nota\s+|reunion\s+)?#?(\d+)$/i)){return pool.find(t=>t.id===+m[1])||null}
  if(/^(?:ultima|ultimo)$/.test(norm(ref)))return pool[pool.length-1]||null;
  const nr=norm(ref);
  const sub=pool.find(t=>norm(t.title).includes(nr)&&nr.length>2);if(sub)return sub;
  const rt=toks(ref);if(!rt.length)return null;
  let best=null,bs=0;
  for(const t of pool){const tt=new Set(toks(t.title));const hit=rt.filter(x=>tt.has(x)).length;const sc=hit/rt.length+0.3*hit/(tt.size||1);if(sc>bs){bs=sc;best=t}}
  return bs>=0.55?best:null;
}

function cmp(a,b){
  if(a.done!==b.done)return a.done?1:-1;
  if(a.due!==b.due){if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:1}
  if(a.time!==b.time){if(!a.time)return 1;if(!b.time)return -1;return a.time<b.time?-1:1}
  return b.pri-a.pri||a.id-b.id;
}

function addTask(text,extra={}){

  if(m){const c=catByName(m[1]);if(c){cat=c;title=title.replace(m[0],' ')}}
  if(/(?:^|\s)(?:es\s+)?(?:urgente|importante|prioridad alta|cr[ií]tic[oa]|asap)\b/i.test(title)){pri=3;title=title.replace(/(?:^|\s)(?:es\s+)?(?:prioridad alta|urgente|importante|cr[ií]tic[oa]|asap)\b/gi,' ')}

    .replace(/^(?:nueva\s+)?(?:tarea|pendiente|recordatorio)\s*(?:de|para|que|:|-)\s*/i,'')
    .replace(/^(?:recu[eé]rdame|recordarme|no (?:me )?(?:dejes )?olvid(?:es|e)|tengo que|debo|hay que|me falta|tengo pendiente)\s+(?:de\s+)?(?:que\s+)?/i,'')
    .replace(/^tengo\s+(?:una?\s+)?(?=reuni|cita|turno|examen|entrega|clase|junta|call|llamada|cumple|fiesta|partido|vuelo|viaje|boda|concierto|dentista|medico|doctor|evento|entrevista)/i,'')
    .replace(/^(?:acu[eé]rdate|acu[eé]rdame|acordate)\s+(?:de\s+)?(?:que\s+)?/i,'')

const pick=a=>a[Math.floor(Math.random()*a.length)];
/* qué decir sobre internet según el modo actual */

let last={},lastQ=null,lastGreet=0;
const setLast=(kind,focus)=>{last={kind,focus:focus||null,t:Date.now()}};
const ctxNow=()=>Date.now()-(last.t||0)<6e5?last:{};
const hm=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?' '+(m%60)+' min':''}`;
const EST_KEYS=[[/reuni|junta|call|clase|examen|entrevista/,60],[/estudi|informe|reporte|presentaci|proyecto|ensayo|tesis|program|escribir|redact/,90],[/llamar|llamada|correo|email|mail|pagar|transfer|turno|cita|enviar|mensaje/,15],[/compr|super|mercado|limpi|lavar|cocin|gimnasio|entren|cena|almuerzo/,45]];
function est(t){if(t.est)return t.est;const n=norm(t.title);for(const [re,m] of EST_KEYS)if(re.test(n))return m;return 30}
function urg(t){const d=t.due?dayDiff(t.due):null;return t.pri*10+(d===null?0:d<0?10+Math.min(-d,5):d===0?8:d===1?5:d<=3?3:d<=7?1:0)-t.id*0.001}
function reason(t){const d=t.due?dayDiff(t.due):null;if(d!==null&&d<0)return `vencida hace ${pl(-d,'día','días')}`;if(d===0)return t.time?`hoy a las ${t.time}`:'vence hoy';if(d===1)return 'vence mañana';if(t.pri===3)return 'prioridad alta';if(d!==null&&d<=3)return 'vence pronto';return 'sin fecha límite'}

/* Plan de un día concreto: respeta horas fijas, duraciones estimadas, pausas y almuerzo */
function planDay(dk){
  const now=new Date(),tk=dkey(now),isToday=dk===tk,nm=now.getHours()*60+new Date().getMinutes();
  const pend=S.tasks.filter(t=>!t.done);
  let pool=pend.filter(t=>t.due&&(isToday?t.due<=dk:t.due===dk));
  if(pool.length<3)pool=pool.concat(pend.filter(t=>!t.due).sort((a,b)=>urg(b)-urg(a)).slice(0,3-pool.length));
  const label=isToday?'hoy':dueLabel({due:dk});
  if(!pool.length)return `<p>No tienes nada asignado para ${label}. Buen momento para adelantar algo, anotar pendientes o descansar.</p>`;
  const timed=pool.filter(t=>t.time&&t.due===dk).sort((a,b)=>a.time.localeCompare(b.time));
  const free=pool.filter(t=>!timed.includes(t)).sort((a,b)=>urg(b)-urg(a)).slice(0,7);
  const busy=timed.map(t=>[toMin(t.time),toMin(t.time)+est(t)]).concat([[13*60,14*60]]);
  const END=20*60;let cur=isToday?Math.max(Math.ceil((nm+5)/15)*15,8*60):9*60;
  const slots=timed.map(t=>({s:toMin(t.time),e:toMin(t.time)+est(t),t,fixed:true})),later=[];
  free.forEach(t=>{
    const d=est(t);let moved=true;
    while(moved){moved=false;for(const [a,b] of busy){if(cur<b&&cur+d>a){cur=b;moved=true}}}
    if(cur+d>END)later.push(t);else{slots.push({s:cur,e:cur+d,t});cur+=d+10}
  });
  slots.sort((a,b)=>a.s-b.s);
  const total=slots.reduce((a,x)=>a+(x.e-x.s),0);
  let h=`<p>Plan para ${label} · ${hm(total)} de trabajo, con pausas y sin tocar tu almuerzo (13–14):</p>`+slots.map(x=>`<div class="slot"><b>${fmtMin(x.s)}–${fmtMin(x.e)}</b>${row(x.t)}</div>`).join('');
  if(later.length)h+=`<p class="sub">No caben ${label}: ${later.map(t=>esc(t.title)).join(', ')}. Te sugiero pasarlas al día siguiente.</p>`;
  if(total>360)h+=`<p class="sub">Son más de 6 horas de trabajo: es un día pesado. Considera mover lo menos urgente.</p>`;
  const cs={};free.forEach(t=>cs[t.cat]=(cs[t.cat]||0)+1);
  const top=Object.entries(cs).sort((a,b)=>b[1]-a[1])[0];
  if(top&&free.length>=3&&top[1]/free.length>=0.6&&top[0]!=='General')h+=`<p class="sub">Consejo: agrupa las tareas de ${esc(top[0])} en bloques seguidos para no perder foco.</p>`;
  const ov=pool.filter(t=>t.due&&t.due<tk).length;
  if(ov)h+=`<p class="sub">${pl(ov,'tarea viene','tareas vienen')} atrasada${ov>1?'s':''}: resuélvelas primero o reprográmalas.</p>`;
  const first=slots.find(x=>!x.fixed&&x.s>=(isToday?nm-1:0))||slots[0];
  if(isToday)setLast('plan',first&&first.t);
  return h+(isToday?'<button class="pill" data-say="qué hago ahora">Empezar ahora</button>':'');
}
function plan(txt=''){
  if(/\b(?:semana|proximos dias|siete dias)\b/.test(norm(txt)))return weekPlan();
  const w=parseWhen(txt);return planDay(w.date||dkey(new Date()));
}

/* Reparte la semana equilibrando carga */
function weekData(){
  const today=sod(new Date()),tk=dkey(today);
  const days=[...Array(7)].map((_,i)=>{const d=addDays(today,i);return{k:dkey(d),wd:d.getDay(),i,load:0,fixed:[],sug:[]}});
  const cap=d=>(d.wd===0||d.wd===6)?120:360;
  S.tasks.filter(t=>!t.done&&t.due).forEach(t=>{const d=days.find(x=>x.k===(t.due<tk?tk:t.due));if(d){d.load+=est(t);d.fixed.push(t)}});
  return{days,cap};
}
const dayLabel=d=>d.i===0?'Hoy':d.i===1?'Mañana':capFirst(DAYS_ES[d.wd])+' '+fromKey(d.k).getDate();
function weekPlan(){
  const {days,cap}=weekData(),pend=S.tasks.filter(t=>!t.done);
  if(!pend.length)return '<p>No tienes tareas pendientes esta semana. Anota algo y lo reparto por ti.</p>';
  pend.filter(t=>!t.due).sort((a,b)=>urg(b)-urg(a)).forEach(t=>{
    let best=null,bs=1e9;
    days.forEach(d=>{const pen=(d.wd===0||d.wd===6)?240:0,sc=d.load+pen+d.i*(t.pri===3?60:12);if(d.load+est(t)<=cap(d)&&sc<bs){bs=sc;best=d}});
    if(!best)best=days.reduce((a,b)=>a.load<=b.load?a:b);
    best.load+=est(t);best.sug.push(t);
  });
  let h='<p>Así repartiría tu semana, equilibrando la carga:</p>';
  days.filter(d=>d.fixed.length||d.sug.length).forEach(d=>{
    h+=`<h4>${dayLabel(d)} · ${hm(d.load)}${d.load>cap(d)?' · sobrecargado':''}</h4>`+d.fixed.sort(cmp).map(row).join('')+d.sug.map(t=>row(Object.assign({},t,{due:d.k,cat:t.cat+' · sugerida'}))).join('');
  });
  const over=days.filter(d=>d.load>cap(d));
  if(over.length)h+=`<p class="sub">${over.map(d=>dayLabel(d)+' ('+hm(d.load)+')').join(', ')} ${over.length>1?'quedan':'queda'} muy cargado${over.length>1?'s':''}: conviene mover algo.</p>`;
  const sug=days.reduce((a,d)=>a+d.sug.length,0);
  if(sug){
    h+=`<p>¿Aplico las fechas sugeridas a tus ${pl(sug,'tarea sin fecha','tareas sin fecha')}?</p><button class="pill" data-say="sí">Sí, aplicar</button><button class="pill" data-say="no">No</button>`;

/* Huecos libres de un día */
function freeTime(dk){
  const now=new Date(),isToday=dk===dkey(now),nm=now.getHours()*60+new Date().getMinutes();
  const label=isToday?'hoy':dueLabel({due:dk});
  const timed=S.tasks.filter(t=>!t.done&&t.due===dk&&t.time).sort((a,b)=>a.time.localeCompare(b.time));
  let cur=isToday?Math.max(Math.ceil((nm+5)/15)*15,8*60):8*60;const END=21*60,gaps=[];
  const blocks=timed.map(t=>[toMin(t.time),toMin(t.time)+est(t)]).concat([[13*60,14*60]]).sort((a,b)=>a[0]-b[0]);
  for(const [a,b] of blocks){if(a-cur>=30)gaps.push([cur,Math.min(a,END)]);cur=Math.max(cur,b)}
  if(END-cur>=30)gaps.push([cur,END]);
  const freeMin=gaps.reduce((a,g)=>a+g[1]-g[0],0);
  const untimed=S.tasks.filter(t=>!t.done&&!t.time&&t.due&&(isToday?t.due<=dk:t.due===dk));
  const need=untimed.reduce((a,t)=>a+est(t),0);
  let h=`<p>Para ${label}: `+(gaps.length?`tienes <b>${hm(freeMin)}</b> libres (asumiendo almuerzo 13–14 y hasta las 21:00).</p>`+gaps.map(g=>`<div class="fact"><span>${fmtMin(g[0])}–${fmtMin(g[1])}</span><span class="meta">${hm(g[1]-g[0])}</span></div>`).join(''):'no veo huecos de al menos 30 minutos.</p>');
  if(timed.length)h+=`<p class="sub">Compromisos con hora: ${timed.map(t=>esc(t.title)+' '+t.time).join(' · ')}.</p>`;
  if(untimed.length)h+=`<p class="sub">Además tienes ${pl(untimed.length,'tarea sin hora','tareas sin hora')} (~${hm(need)}). ${need>freeMin?'No te alcanza el tiempo libre: hay que mover algo.':'Te caben en esos huecos.'}</p>`;
  return h;
}

/* "Tengo X tiempo, ¿qué hago?" */

/* ---------- exportación ICS (Calendario estándar) ---------- */
function icsEvent(t){
  const dt=t.due.replace(/-/g,'');
  let start,end;
  if(t.time){
    const sm=toMin(t.time),em=sm+est(t);
    start=`DTSTART:${dt}T${pad(Math.floor(sm/60))}${pad(sm%60)}00`;
    end=`DTEND:${dt}T${pad(Math.floor(em/60)%24)}${pad(em%60)}00`;
  }else{
    start=`DTSTART;VALUE=DATE:${dt}`;
    const nd=dkey(addDays(fromKey(t.due),1)).replace(/-/g,'');
    end=`DTEND;VALUE=DATE:${nd}`;
  }
  const clean=s=>String(s).replace(/[\r\n,;]/g,' ');
  return ['BEGIN:VEVENT',`UID:infinitos-${t.id}-${t.created}@local`,start,end,`SUMMARY:${clean(t.title)}`,`CATEGORIES:${clean(t.cat)}`,'END:VEVENT'].join('\r\n');
}
function downloadICS(list,filename='infinitos-agenda.ics'){
  const valid=list.filter(t=>t.due);
  if(!valid.length){toast('No hay tareas con fecha para exportar');return}
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//infinitOS//ES',...valid.map(icsEvent),'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar;charset=utf-8'}));
  a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Evento .ics descargado');
}

/* ---------- calculadora y conversiones (parser propio, sin eval) ---------- */
function evalMath(src){
  const T=[],re=/\s*(?:(\d+(?:\.\d+)?|\.\d+)|([a-z]+)|(\*\*|[-+*\/^%(),]))/y;let pos=0,m;src=src.toLowerCase();
  while(pos<src.length){re.lastIndex=pos;m=re.exec(src);if(!m){if(/^\s*$/.test(src.slice(pos)))break;throw 0}pos=re.lastIndex;T.push(m[1]!==undefined?{n:+m[1]}:m[2]?{id:m[2]}:{op:m[3]})}
  let i=0;const pk=()=>T[i],nx=()=>T[i++];
  const F={sqrt:Math.sqrt,raiz:Math.sqrt,sin:Math.sin,cos:Math.cos,tan:Math.tan,log:Math.log10,ln:Math.log,abs:Math.abs,round:Math.round};
  const C={pi:Math.PI,e:Math.E};
  const isOp=o=>pk()&&pk().op===o;
  function expr(){let v=term();while(isOp('+')||isOp('-')){const o=nx().op,r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=pow();while(isOp('*')||isOp('/')){const o=nx().op,r=pow();v=o==='*'?v*r:v/r}return v}
  function pow(){const b=unary();if(isOp('^')||isOp('**')){nx();return Math.pow(b,pow())}return b}
  function unary(){if(isOp('-')){nx();return -unary()}if(isOp('+')){nx();return unary()}return post()}
  function post(){let v=atom();while(isOp('%')){nx();v/=100}return v}
  function atom(){
    const t=nx();if(!t)throw 0;
    if(t.n!==undefined)return t.n;
    if(t.op==='('){const v=expr();if(!isOp(')'))throw 0;nx();return v}
    if(t.id){if(t.id in C)return C[t.id];if(t.id in F)return F[t.id](isOp('(')?atom():unary())}
    throw 0;
  }
  const v=expr();if(i<T.length||!isFinite(v))throw 0;return v;
}
const fmtNum=v=>(+v.toPrecision(12)).toLocaleString('es-AR',{maximumFractionDigits:8,useGrouping:Math.abs(v)>=10000});
function tryCalc(s){
  s=norm(s).replace(/^(?:cuanto es|cuanto da|cuanto son|calcula|calcular|resuelve|cual es(?: el resultado de)?)\s+/,'').replace(/^(?:el|la|los|las)\s+(?=\d)/,'');
  s=s.replace(/(\d+(?:[.,]\d+)?)\s*%\s*de\s*(\d+(?:[.,]\d+)?)/g,'($1/100*$2)')
    .replace(/raiz(?: cuadrada)?(?: de)?\s*/g,'sqrt ').replace(/al cuadrado/g,'^2').replace(/al cubo/g,'^3').replace(/elevado a(?: la)?/g,'^')
    .replace(/dividido (?:por|entre)|\bentre\b/g,'/').replace(/\bpor\b/g,'*').replace(/\bmas\b/g,'+').replace(/\bmenos\b/g,'-')
    .replace(/(\d)\s*[x×]\s*(\d)/g,'$1*$2').replace(/÷/g,'/').replace(/(\d),(\d)/g,'$1.$2');
  if(!/\d|pi/.test(s)||!/[-+*\/^%]|sqrt|raiz|sin|cos|tan|log|ln|abs|round/.test(s))return null;
  try{return fmtNum(evalMath(s))}catch(e){return null}
}

  activeTimer={end:Date.now()+sec*1000,label,iv:setInterval(updateTimerUI,500)};
  updateTimerUI();
}
$('#timerStop').onclick=()=>{if(activeTimer){clearInterval(activeTimer.iv);activeTimer=null;updateTimerUI();toast('Temporizador cancelado')}};

R(/^olvida\s+(?:que\s+)?(.+)/,(m,g)=>{

/* tareas: completar, reabrir, borrar, editar, mover */
R(/^(?:limpia|borra|elimina|quita)\s+(?:las\s+)?(?:tareas\s+)?(?:completadas|hechas|terminadas|listas)/,()=>{
  const n=S.tasks.filter(t=>t.done).length;if(!n)return '<p>No hay tareas completadas para limpiar.</p>';
  snap();S.tasks=S.tasks.filter(t=>!t.done);save();renderPanel();syncChatDOM();return `<p>Eliminé ${pl(n,'tarea completada','tareas completadas')}.</p>`;
});
R(/^(?:ya\s+)?(?:complete|completa|completar|termine|termina|terminar|finalice|finaliza|hice|hecho|resuelto|marca(?:r)?(?:\s+como)?\s+(?:hecha|hecho|lista|listo|completada|terminada))\s*[:\-]?\s*(.+)/,(m,g)=>{
  const t=findRef(g(1),S.tasks.filter(x=>!x.done));
  if(!t)return '<p>No encontré esa tarea. Dime su número (#) o parte del nombre.</p>';
  snap();t.done=true;t.doneAt=Date.now();logAct('done',t.cat);save();renderPanel();syncChatDOM();
  const left=S.tasks.filter(x=>!x.done&&x.due&&x.due<=dkey(new Date())).length;
  return `<p>Completada: <b>${esc(t.title)}</b>.</p><p class="sub">${left?`Te ${left===1?'queda':'quedan'} ${pl(left,'tarea','tareas')} para hoy.`:'No te queda nada para hoy.'}</p>`;
});
R(/^(?:reabre|reabrir|reactiva|desmarca)\s+(.+)/,(m,g)=>{
  const t=findRef(g(1),S.tasks.filter(x=>x.done));if(!t)return '<p>No encontré esa tarea completada.</p>';
  snap();t.done=false;delete t.doneAt;save();renderPanel();syncChatDOM();return `<p>Reabierta: <b>${esc(t.title)}</b>.</p>`;
});
R(/^(?:borra|elimina|quita|descarta|cancela)\s+(?:la\s+|el\s+)?(tarea\s+|nota\s+)?(.+)/,(m,g)=>{
  const kind=(g(1)||'').trim().toLowerCase(),ref=g(2);
  let t=null;
  if(kind==='nota')t=findRef(ref,S.notes);
  else if(kind==='tarea')t=findRef(ref,S.tasks);
  else t=findRef(ref,S.tasks)||findRef(ref,S.notes);
  if(!t)return '<p>No encontré eso. Dime su número (#) o parte del nombre.</p>';
  snap();if(t.note)S.notes=S.notes.filter(x=>x!==t);else S.tasks=S.tasks.filter(x=>x!==t);
  save();renderPanel();syncChatDOM();return `<p>Borrada: «${esc(t.title)}».</p><button class="pill" data-cmd="deshacer">Deshacer</button>`;
});
R(/^(?:renombra|edita|cambia el nombre de)\s+(?:la\s+)?(?:tarea\s+)?(#?\d+)\s+(?:a|por)\s+(.+)$/,(m,g)=>{
  const t=findRef(g(1),S.tasks);if(!t)return '<p>No encontré esa tarea.</p>';
  snap();t.title=capFirst(cleanTitle(g(2)));save();renderPanel();syncChatDOM();
  return `<p>Actualizada.</p>${row(t)}`;
});
R(/^(?:posterga|pospon|pospone|aplaza|mueve|cambia|reprograma|pon)\s+(?:la\s+)?(?:tarea\s+|reunion\s+)?(.+?)\s+(?:para|a|al|en)\s+(?:el\s+|la\s+)?(.+)$/,(m,g)=>{
  const t=findRef(g(1),S.tasks);
  const tail=g(2),cat=catByName(tail);
  if(!t){return (cat||parseWhen(tail).date||parseWhen(tail).time)&&/^(?:#?\d+|la \d+)$/.test(norm(g(1)).trim())?'<p>No encontré esa tarea.</p>':null}
  if(cat){snap();t.cat=cat;learn(t.title,cat,3);save();renderPanel();syncChatDOM();return `<p>Listo. Moví «${esc(t.title)}» a <b>${cat}</b> y aprendí de eso.</p>`}
  const w=parseWhen(tail);if(!w.date&&!w.time)return null;
  snap();if(w.date)t.due=w.date;if(w.time)t.time=w.time;if(w.dur)t.est=w.dur;t.notified=false;save();renderPanel();syncChatDOM();
  return `<p>Reprogramada.</p>${row(t)}`;
});
R(/^prioriza\s+(.+)/,(m,g)=>{
  if(/\b(?:dia|hoy|semana|todo|tareas|mi)\b/.test(norm(g(1))))return null;
  const t=findRef(g(1),S.tasks.filter(x=>!x.done));if(!t)return null;
  snap();t.pri=3;save();renderPanel();syncChatDOM();return `<p>Prioridad alta.</p>${row(t)}`;
});
R(/^marca\s+(.+?)\s+como\s+(?:urgente|importante|prioritaria|prioritario)/,(m,g)=>{
  const t=findRef(g(1),S.tasks.filter(x=>!x.done));if(!t)return '<p>No encontré esa tarea.</p>';
  snap();t.pri=3;save();renderPanel();syncChatDOM();return `<p>Prioridad alta.</p>${row(t)}`;
});

R(/^y\s+(.+)$/,(m,g)=>{if(!lastQ||/^y\s/.test(norm(lastQ)))return null;const q=lastQ;lastQ=null;try{return respond(parseWhen(q).rest+' '+g(1))}finally{if(!lastQ)lastQ=q}});
R(LAUGH,()=>`<p>${pick(['Jaja, me alegra sacarte una sonrisa.','Jaja, buen humor. Así da gusto trabajar.','Jaja. ¿Seguimos con lo tuyo?','Me gusta ese ánimo.'])}</p>`);
R(ACK,(m,g,c)=>{
  const w=c.n,L=ctxNow();
  if(/^(?:no|nop|nada)$/.test(w))return `<p>${pick(['Ok, sin problema.','Entendido.','Perfecto, avísame si cambias de idea.'])}</p>`;
  if(/^(?:ni idea|no se)$/.test(w))return `<p>Está bien no tenerlo claro. Si quieres, yo te digo por dónde empezar.</p><button class="pill" data-say="qué hago ahora">¿Qué hago ahora?</button><button class="pill" data-say="Organiza mi día">Organizar mi día</button>`;
  if(/^(?:wow|guau|uf+|ups|oh+|ah+|uh+)$/.test(w))return `<p>${pick(['Sí, a veces es mucho.','Jaja, así es.','Tranquilo, lo vamos ordenando.'])}</p>`;
  if(/^(?:si|sii+|sip)$/.test(w))return '<p>Dime, ¿qué necesitas?</p>';
  if(w==='listo'&&L.kind==='focus'&&L.focus&&!L.focus.done)return `<p>¿Completaste <b>${esc(L.focus.title)}</b>?</p><button class="pill" data-say="completa ${L.focus.id}">Sí, marcar completada</button>`;
  if(L.kind==='plan'&&L.focus){setLast('focus',L.focus);return `<p>Perfecto. Empieza por <b>${esc(L.focus.title)}</b>; cuando termines, dime «listo».</p>`}
  return `<p>${pick(['Perfecto.','Dale.','Aquí estoy para lo que necesites.','Listo. ¿Algo más?'])}</p>`;
});
R(/^(?:no entiendo|no entendi|no te entendi|como asi|que)$/,()=>'<p>Perdona, a veces me cuesta. Dímelo con otras palabras o toca <b>ayuda</b> para ver ejemplos.</p><button class="pill" data-say="ayuda">Ver ejemplos</button>');

/* filtro compartido para listar y contar tareas/reuniones */
function taskFilter(n){
  const tk=dkey(new Date());let list=S.tasks.filter(t=>!t.done),title='Tus tareas',done=false;
  const cat=CATS.find(k=>n.includes(norm(k)))||Object.keys(CSYN).filter(k=>k!=='general'&&new RegExp('\\b'+k+'\\b').test(n)).map(k=>CSYN[k])[0]||null;
  if(/reuniones|citas|eventos/.test(n)){
    list=list.filter(t=>t.time||/reuni|cita|junta|call|llamada|turno/.test(norm(t.title)));
    title='Reuniones y citas';
  }
  if(/complet|hechas|terminad|\bhice\b/.test(n)){
    done=true;list=S.tasks.filter(t=>t.done);title='Completadas';
    if(/semana/.test(n)){list=list.filter(t=>t.doneAt>Date.now()-7*864e5);title+=' esta semana'}
    else if(/\bhoy\b/.test(n)){list=list.filter(t=>t.doneAt&&dkey(new Date(t.doneAt))===tk);title+=' hoy'}
  }
  else if(/vencid|atrasad/.test(n)){list=list.filter(t=>t.due&&t.due<tk);title='Vencidas'}
  else if(/pasado manana/.test(n)){const d=dkey(addDays(new Date(),2));list=list.filter(t=>t.due===d);title='Pasado mañana'}
  else if(/manana/.test(n)){const d=dkey(addDays(new Date(),1));list=list.filter(t=>t.due===d);title='Mañana'}
  else if(/\bhoy\b/.test(n)){list=list.filter(t=>t.due&&t.due<=tk);title='Hoy'}
  else if(/semana/.test(n)){const d=dkey(addDays(new Date(),7));list=list.filter(t=>t.due&&t.due<=d);title='Esta semana'}
  if(cat){list=list.filter(t=>t.cat===cat);title+=` · ${cat}`}
  return{list,title,done};
}

const SMS={k:'que',ola:'hola',stoy:'estoy',toy:'estoy',tngo:'tengo',tgo:'tengo',kiero:'quiero',kieres:'quieres',ps:'pues',bn:'bien',vdd:'verdad',pa:'para',ntp:'no te preocupes',nose:'no sé',mñn:'mañana',mñna:'mañana',hoi:'hoy',gracs:'gracias',grax:'gracias',grasias:'gracias',plis:'por favor',tmbn:'también',ke:'que',qe:'que',kien:'quien',qien:'quien',kual:'cual',kuanto:'cuanto',klima:'clima',kapital:'capital',abitantes:'habitantes',dise:'dice',sinifica:'significa',resepta:'receta'};
/* solo palabras largas y poco ambiguas: una errata a distancia 1 se corrige, un verbo conjugado no se toca */
const VOC=new Map('mañana semana reunión resumen pendiente pendientes recordatorio importante urgente temporizador cumpleaños gimnasio dentista supermercado farmacia vacaciones película música domingo miércoles sábado viernes cansado cansada aburrido estresado abrumado febrero septiembre octubre noviembre diciembre proyecto cliente oficina alquiler cansancio favorito favorita doctor clima pronóstico temperatura llover lloviendo habitantes significa receta bitcoin'.split(' ').map(w=>[norm(w),w]));
/* ¿a y b difieren en una sola letra (de más, de menos, cambiada o dos contiguas intercambiadas)? */
function lev1(a,b){
  /* a = lo escrito, b = palabra conocida: a le falta una letra o tiene dos contiguas intercambiadas */
  if(a===b)return false;
  let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  if(a.length===b.length-1)return a.slice(i)===b.slice(i+1);
  if(a.length===b.length)return a[i]===b[i+1]&&a[i+1]===b[i]&&a.slice(i+2)===b.slice(i+2);
  return false;
}
function fixTypos(s){
  return s.replace(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g,(w,idx)=>{
    const lw=w.toLowerCase(),up=w[0]!==lw[0],k=norm(lw);let r=lw.length===1&&!/\s/.test(s.trim())?undefined:SMS[lw];
    if(!r&&k.length>=5&&!VOC.has(k)&&!(up&&idx>0))for(const [vk,vw] of VOC)if(vk[0]===k[0]&&lev1(k,vk)){r=vw;break}
    return r?(up?capFirst(r):r):w;
  });
}

const MPOS=/\b(?:bien|bn|genial|excelente|fenomenal|de maravilla|super|chido|bacan|chevere|buenisimo|tranqui\w*|content\w*|feliz|perfect\w*|de lujo|todo bien|no me quejo|piola|joya|lindo|barbaro|a full)\b|\bno (?:estoy |me va |ando )?mal\b/;

const MNEG=/\b(?:mal|fatal|horrible|pesimo|cansad\w*|agotad\w*|estresad\w*|triste|no muy bien|no tan bien|no del todo bien|bajon|bajonead\w*|saturad\w*|harto|harta|dormi mal|peor|pesad\w*|complicad\w*|dificil|agotador\w*|largo|intenso|estres\w*)\b/;

  if(/\bno (?:estoy |me va |ando )?mal\b/.test(n)||(MPOS.test(n)&&!MNEG.test(n)&&!MMID.test(n)))
    return talk('animo+',pick(['Me alegra oírlo.','Qué bueno, así da gusto.','Genial, buena base para avanzar.'])+' ¿Aprovechamos para adelantar algo?',{chips:[['¿Qué hago ahora?','qué hago ahora'],['Cuéntame algo','dime algo interesante']]});
  if(MMID.test(n)&&!MNEG.test(n))
    return talk('animo0','Ni bien ni mal, te entiendo: hay días así. ¿Es cansancio, o algo concreto te pesa?',{expect:'vent',chips:[['Hacer el día liviano','Estoy cansado']]});
  if(MNEG.test(n))

  return null;
}

  /* necesidades, estados de ánimo y situaciones cotidianas */

function shouldImplicitAddTask(c){
  const o=c.o,n=c.n,first=n.split(' ')[0],words=n.split(' ').length;
  const isQ=c.q||ISQ.test(n);
  if(isQ)return false;
  for(const [re] of ADV)if(re.test(n))return false;
  if(NARR.test(n)||/^y\s/.test(n)||/^(?:\S+\s+){0,2}(?:que|cuando|donde|como)\b/.test(n)||INFOSTART.test(n)||INFOSTART.test(n.replace(LEADTIME,'')))return false;
  const w=parseWhen(o);
  const isEventNoun=/^(?:reunion|cita|turno|junta|call|llamada|almuerzo|cena|medico|dentista|entrevista|clase|examen|entrega)\b/.test(first);
  return !!(w.date||w.time||isEventNoun||/^ir\s+(?:a|al)\b/.test(n)||(words>=2&&/(?:ar|er|ir)$/.test(first)&&first.length>3));
}
function fallback(c,opts={}){
  const o=c.o,n=c.n,words=n.split(' ').length;
  const isQ=c.q||ISQ.test(n);
  for(const [re,fn] of ADV)if(re.test(n))return fn(c);
  const res=isQ?(PERS.test(n)?searchAll(o):searchAll(o,.6,2)):null; /* sobre MIS cosas: búsqueda amplia; si no, solo si coincide de verdad */
  if(res)return `<p>Esto es lo más relacionado que tengo:</p>${res}`;
  if(!isQ&&WXTOPIC.test(n)&&words<=8)return unknownQ(c); /* «clima mañana» pide información: no es una tarea */
  if(shouldImplicitAddTask(c))return addTask(o);
  if(isQ){if(opts.canWeb){const wr=webResidual(c);if(wr)return{web:wr}}return unknownQ(c)}
  const r2=searchAll(o);
  if(r2&&words>=2)return `<p>No estoy seguro de qué quieres hacer, pero esto está relacionado:</p>${r2}`;
  if(words>=3)return reflect(c);
  return talk('confuso',pick(['No te entendí del todo.','Perdona, esa no la pillé.','Mm, no estoy seguro de qué quieres decir.'])+' Puedo manejar tareas, reuniones, notas, tu agenda, cálculos, o simplemente charlar.',{chips:[['Ver qué puedo hacer','ayuda'],['Guardar como nota','Nota: '+o]]});
}

const AFF=/^(?:si|sii+|sip|dale|ok|okay|okey|claro|confirmo|vale|de una|por favor|yes|obvio|seguro|adelante|hazlo|aplicalo|bueno|va|listo|perfecto|genial|joya|barbaro|por supuesto|sale)(?:[, ]+(?:si|dale|ok|por favor|claro|hazlo|gracias|nomas))*$/;
const NEG=/^(?:no|nop|nel|cancela|nada|mejor no|ahora no|despues|luego|no gracias|no hace falta)$/;
const FILLER=/^(?:ok|okay|okey|vale|dale|bueno|bien|ya|oye|ey|hey|mira|a ver|entonces|pues|porfa|por favor|disculpa|perdon|che|infinitos)[, ]+(?=\S)/i;

/* Pre-procesador unificado para que el rastreo de pensamiento y ambos modelos evalúen el texto limpio */
function prepInput(raw){
  let o=String(raw).slice(0,MAXIN).trim();
  const q=/\?\s*$/.test(o)||/^¿/.test(o);
  o=o.replace(/^[¿¡\s]+|[?!.\s]+$/g,'');
  if(!o)return{empty:true,o:'',n:'',q};
  o=o.replace(/\b(xq|pq|tmb|tb|xfa|pf|dnd|cmo)\b/gi,m=>({xq:'porque',pq:'porque',tmb:'también',tb:'también',xfa:'por favor',pf:'por favor',dnd:'dónde',cmo:'cómo'}[m.toLowerCase()]))
   .replace(/(^|\s)q(?=\s)/gi,'$1que').replace(/([a-záéíóúñ])\1{2,}/gi,'$1');
  o=fixTypos(o);
  const noEm=o.replace(/[\p{Extended_Pictographic}\ufe0f\u200d]/gu,'').replace(/\s+/g,' ').trim();
  if(!noEm)return{onlyEmoji:true,o:'',n:'',q};
  o=noEm;
  let p;do{p=o;o=o.replace(FILLER,'')}while(o!==p);
  o=o.replace(/[, ]+(?:por favor|porfa|gracias)$/i,'');
  o=o.replace(/^(ag[eé]ndame|progr[aá]mame|an[oó]tame|ap[uú]ntame|agr[eé]game|a[ñn][aá]deme|cr[eé]ame)(?=[\s:])/i,(m,v)=>({agendame:'agenda',programame:'programa',anotame:'anota',apuntame:'apunta',agregame:'agrega',anademe:'agrega',creame:'crea'}[norm(v)]||v));
  /* risas al inicio («jaja eres gracioso») y «cuando sean las 6» = «a las 6» */
  o=o.replace(/^(?:(?:[jh][aeiou]){2,}j?|xd+|lol)[, ]+(?=\S)/i,'').replace(/\bcuando\s+(?:sean|den|dan)\s+las\b/gi,'a las');
  return{o,n:norm(o),q};
}

/* la primera respuesta del usuario es su nombre solo si ninguna regla la entendió («Pedro», «soy Ana») */
function nameFromFirst(c){
    const nm=c.o.replace(/^(?:soy|yo soy|es|pues)\s+/i,'');
    if(/^[a-záéíóúñ]+(?: [a-záéíóúñ]+)?$/i.test(nm)&&nm.length<24&&!LAUGH.test(norm(nm))&&!ACK.test(norm(nm))&&!/^(?:hola|ayuda|si|no|ok|gracias|hoy|nada|resumen|buenas|dime|dame|hazme)\b|^[a-z]{6,}(?:ame|eme|ime|ome)$/.test(norm(nm))){
      snap();S.profile.name=capWords(nm);save();renderPanel();
      return `<p>Encantado, ${esc(S.profile.name)}. Ya puedes decirme qué tienes que hacer, o charlar un rato.</p>`;
    }
  return null;
}

function respond(raw){
  const c=prepInput(raw);
  if(c.empty)return '<p>…</p>';
  if(c.onlyEmoji)return `<p>${pick(['Entendido.','Jaja, me gusta tu estilo.','Aquí estoy. ¿Qué necesitas?'])}</p>`;
  if(pending){
    const pd=pending;pending=null;
    if(AFF.test(c.n))return pd.run();
    if(NEG.test(c.n))return '<p>Listo, lo dejo así.</p>';
  }
  const firstMsg=awaitName;awaitName=false;
  {const nn=needsNet(c);if(nn){convReset();return needNetReply(nn,c)}}
  const ch=preChat(c);if(ch!=null)return ch;
  for(const r of RULES){
    const m=r.re.exec(c.n);if(!m)continue;
    const g=i=>m.indices[i]?c.o.slice(m.indices[i][0],m.indices[i][1]):'';
    const c0=conv,out=r.fn(m,g,c);
    if(out!=null){if(conv===c0)convReset();if(r.q)lastQ=c.o;return out}
  }
  /* la primera respuesta es su nombre solo si nada más la entendió («Pedro», «soy Ana») */
  if(firstMsg){const r=nameFromFirst(c);if(r)return r}
  return fallback(c);
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function isWBSGoal(c){
  const m=c.n.match(/^(?:quiero|me gustaria|mi meta es|mi objetivo es|planeo|deseo)\s+(.+)/);
  if(!m)return null;
  const rest=m[1];
  if(/\b(?:dia|hoy|manana|semana|tareas|agenda|tiempo|nota|notas|recordatorio|reunion|cita)\b/.test(rest))return null;
  if(/^(?:ver|saber|hacer|ir|comer|dormir|agregar|anadir|borrar|eliminar|completar|mover|buscar)\b/.test(rest))return null;
  if(!/^(?:aprender|lograr|conseguir|bajar|ahorrar|correr|mejorar|empezar|armar|crear|escribir|preparar|terminar|ordenar|organizar|viajar|estudiar|dejar|leer|construir|lanzar|montar|ser)\b/.test(rest))return null;
  return c.o.replace(/^(?:quiero|me gustar[ií]a|mi meta es|mi objetivo es|planeo|deseo)\s+/i,'');
}

/* Generador contextual de pasos de pensamiento para el Modelo Profundo */
function generateThoughtTrace(c){
  if(c.empty||c.onlyEmoji)return ['Interpretando gesto no verbal del usuario.','Alineando respuesta breve y empática.'];
  const n=c.n,o=c.o;
  const pend=S.tasks.filter(t=>!t.done);
  const tk=dkey(new Date());
  const todayCount=pend.filter(t=>t.due&&t.due<=tk).length;
  const isQ=c.q||/^(?:que|como|cuando|donde|quien|cual|cuanto|por que|porque|cuales|sera|puedes|deberia)\b/.test(n);

  const steps=[];
  if(pending){
    steps.push('Evaluando confirmación sobre la propuesta previa.');
    steps.push('Comprobando parámetros y coherencia con la agenda.');
    steps.push('Ejecutando acción confirmada por el usuario.');
    return steps;
  }
  if(LAUGH.test(n)){
    steps.push('Analizando registro emocional: expresión lúdica/humorística detectada.');
    steps.push(`Evaluando contexto de trabajo: ${pend.length} tareas pendientes (${todayCount} para hoy).`);
    steps.push('Alineando tono empático para mantener buen humor y conectar proactivamente con la agenda.');
  } else if(ACK.test(n)){
    steps.push('Detectada confirmación/asentimiento breve en el flujo conversacional.');
    steps.push(last.focus?`Identificando foco activo previo: «${last.focus.title}».`:'Revisando última interacción y estado general.');
    steps.push('Determinando siguiente paso óptimo para reducir fricción ejecutiva.');
  } else if(/organiz|planific|plan\b|por donde empiezo|que hago/.test(n)){
    steps.push('Solicitud de organización estratégica detectada.');
    steps.push(`Auditando agenda: ${pend.length} pendientes totales, ${pend.filter(t=>t.time).length} con horario estricto.`);
    steps.push('Aplicando principios de Deep Work y curva de energía circadiana para evitar sobrecarga.');
    steps.push('Generando distribución equilibrada con amortiguadores de tiempo y descansos.');
  } else if(/estres|abrumad|agobiad|cansad|no doy abasto|no llego|no tengo ganas|saturad|ansiedad/.test(n)){
    steps.push('Detección de saturación cognitiva o fatiga en el usuario.');
    steps.push('Invocando protocolo de contención: desescalada de presión y triaje de prioridades.');
    steps.push('Reduciendo horizonte temporal al presente inmediato (bloque único de 10-15 min).');
  } else if(/decid|elegir|opciones|pros y contras|no se si|dilema/.test(n)){
    steps.push('Dilema de decisión identificado. Descomponiendo variables en juego.');
    steps.push('Aplicando marco de reversibilidad (decisiones de dos vías) y proyección 10/10/10.');
    steps.push('Diseñando experimento de bajo riesgo y criterios cuantitativos de desempate.');
  } else if(isWBSGoal(c)){
    steps.push(`Meta declarada: «${o}». Desglosando en estructura WBS (Work Breakdown Structure).`);
    steps.push('Mapeando 4 fases críticas: Fundamentos, Construcción, Validación y Consolidación.');
    steps.push('Calculando plazos realistas para asegurar consistencia sin burnout.');
  } else if(tryCalc(o)!=null){
    steps.push('Detección de consulta matemática / aritmética.');
    steps.push('Parseando operadores numéricos y aislando factores.');
    steps.push('Calculando con precisión decimal y formato legible.');
  } else if(isQ){
    steps.push(`Consulta analítica recibida: «${o}». Deconstruyendo en primeros principios.`);
    steps.push('Consultando base conceptual local, perfil del usuario y memoria acumulada.');
    steps.push('Sintetizando explicación estructurada con ejemplos aplicables a la vida cotidiana.');
  } else {
    steps.push(`Analizando entrada: «${o}». Identificando entidades y parámetros.`);
    const w=parseWhen(o);
    if(w.date||w.time)steps.push(`Entidad temporal extraída: ${w.date||'hoy'} ${w.time||''}${w.dur?' ('+w.dur+' min)':''}.`);
    steps.push('Cotejando coherencia con la base de datos local y estado del usuario.');
  }
  return steps;
}

function buildDeepTaskAdvice(t){
  if(!t)return '';
  if(t.time){
    return `<p class="sub" style="margin-top:6px">💡 <i>Consejo del Modelo Profundo:</i> Deja 10 minutos de margen antes de las ${t.time} para revisar notas y evitar llegar con prisa.</p>`;
  }
  if(t.cat==='Estudio'){
    return `<p class="sub" style="margin-top:6px">💡 <i>Técnica recomendada:</i> Aplica recuerdo activo (active recall) cerrando el material e intentando resumirlo de memoria.</p>`;
  }
  if(t.cat==='Finanzas'){
    return `<p class="sub" style="margin-top:6px">💡 <i>Regla de fricción:</i> Trámites de pago suelen postergarse por pereza; resuélvelo en los próximos 10 minutos para despejar tu mente.</p>`;
  }
  if(t.cat==='Salud'){
    return `<p class="sub" style="margin-top:6px">💡 <i>Hábito ancla:</i> Asocia esta actividad de salud a un momento fijo del día para no depender de la fuerza de voluntad.</p>`;
  }
  if(t.cat==='Trabajo'){
    return `<p class="sub" style="margin-top:6px">💡 <i>Enfoque ejecutivo:</i> Define el entregable concreto en una línea antes de empezar para evitar perfeccionismo innecesario.</p>`;
  }
  return '';
}

function respondDeep(raw,opts={}){

  // Manejo de pendientes activos de confirmación previa
  if(pending){

    if(NEG.test(c.n))return '<div class="deep-card"><div class="deep-badge">🧠 Decisión Asimilada</div><p>De acuerdo, descartamos la propuesta y mantenemos tu agenda intacta.</p></div>';
  }
  const firstMsg=awaitName;awaitName=false;
  {const nn=needsNet(c);if(nn){convReset();return deepWrap(needNetReply(nn,c))}}
  const chD=preChat(c);if(chD!=null)return deepWrap(chD);
  /* ¿es una orden explícita (tarea, nota, dato, recordatorio)? Esas van por las reglas, no por las tarjetas de ánimo */
  const explicitCmd=RULES.some(r=>r.fn===addTaskFn&&r.re.test(c.n))||/^(?:nota|idea|tarea|recuerda|recuerdame|anota|apunta|guarda|agrega|crea|ten en cuenta|toma nota)\b/.test(c.n)||(!c.q&&(()=>{const w=parseWhen(c.o);return !!(w.date||w.time)})()&&!/^(?:estoy|ando|me siento|me tiene)\b/.test(c.n)&&!WXTOPIC.test(c.n)&&!INFOSTART.test(c.n.replace(LEADTIME,'')))||shouldImplicitAddTask(c);

  // 1. Manejo de risas o humor con profundidad
  if(LAUGH.test(c.n)){

    const urgL=pend.filter(t=>t.pri===3||(t.due&&t.due<=tk));

    } else if(pend.length){

    } else {
      msg+=`<p class="sub">Tu lista está 100% limpia. Disfruta genuinamente tu tiempo libre sin culpa.</p>`;
    }
    msg+='</div>';
    return msg;
  }

  // 2. Manejo de confirmaciones ("ok", "dale", "listo") con guía estratégica
  if(ACK.test(c.n)){
    const L=ctxNow();
    if(L.kind==='focus'&&L.focus&&!L.focus.done){
      return `<div class="deep-card"><div class="deep-badge">🧠 Enfoque de Ejecución</div><p>¿Conseguiste cerrar <b>«${esc(L.focus.title)}»</b>?</p><div class="btns"><button class="pill" data-cmd="completa ${L.focus.id}">Sí, marcar completada</button><button class="pill" data-say="necesito 15 minutos más">Aún no, dame 15 min más</button></div></div>`;

    const pend=S.tasks.filter(t=>!t.done);

    <p>Cuando sientes saturación, tu cerebro entra en modo de alerta y la corteza prefrontal pierde capacidad ejecutiva. Lo que necesitas ahora <b>no</b> es más disciplina, sino <b>menos fricción</b>.</p>`;
    if(overdue.length){
      rec+=`<p class="sub">Tienes <b>${pl(overdue.length,'tarea retrasada','tareas retrasadas')}</b> pesando en tu cabeza. Gran parte del agobio proviene de ver fechas vencidas.</p>`;
    }
    if(easiest){
      setLast('focus',easiest);
      rec+=`<p><b>Estrategia de Victoria Rápida (Micro-win):</b> Olvídate del resto por ahora. Dedica solo 10 minutos a cerrar la tarea más pequeña: «<b>${esc(easiest.title)}</b>» (~${hm(est(easiest))}). Cerrar una sola tarea reinicia la dopamina.</p>
      <div class="btns"><button class="pill" data-say="temporizador 10 minutos">Iniciar micro-bloque 10 min</button><button class="pill" data-say="qué hago ahora">Elegir otra tarea</button></div>`;
    } else {
      rec+=`<p>No tienes tareas críticas pendientes. Date permiso explícito para desconectar durante 20 minutos sin pantallas.</p>`;
    }
    rec+='</div>';
    return rec;
  }

  // 4. Consultas complejas de toma de decisiones
  if(!explicitCmd&&/\b(?:no se que hacer|no puedo decidir|debo renunciar|cambiar de trabajo|que elijo|que decision|pros y contras|dilema|que me conviene)\b/.test(c.n)){
    return `<div class="deep-card"><div class="deep-badge">🧠 Marco Estratégico de Decisiones</div>
    <p>Para desbloquear una decisión compleja con claridad analítica, aplica estos 3 filtros de primeros principios:</p>
    <p><b>1. Filtro de Reversibilidad (Puertas de Jeff Bezos):</b><br>
    ¿Es una decisión de <i>dos vías</i> (fácilmente reversible si sale mal) o de <i>una vía</i> (consecuencias permanentes)? Si es de dos vías, decide rápido con el 70% de información. Si es de una vía, recopila más datos y consulta expertos.</p>
    <p><b>2. Regla 10/10/10:</b><br>
    ¿Cómo te afectará esta elección dentro de <b>10 minutos</b>? ¿Dentro de <b>10 meses</b>? ¿Dentro de <b>10 años</b>? Casi toda la ansiedad vive en los 10 minutos iniciales.</p>
    <p><b>3. El Experimento de Bajo Costo (MVP):</b><br>
    Antes de dar el salto definitivo, ¿cuál es la prueba más pequeña que puedes hacer esta semana para verificar la hipótesis sin arriesgar tu estabilidad?</p>
    <p class="sub">Si me cuentas las dos opciones principales que barajas, te ayudo a tabularlas en tus notas.</p>
    <button class="pill" data-say="Nota: Decisión clave: ">Anotar opciones en notas</button>
    </div>`;
  }

  // 5. Planificación semanal profunda (evaluar antes que metas para no colisionar con "Quiero organizar mi semana")
  if(/\b(?:organiza(?:me)?|planifica(?:me)?|ordena(?:me)?|distribuye|reparte|arma(?:me)?)\b.*\b(?:semana|proximos dias|siete dias)\b|\bplan (?:de la |de esta )?semana\b/.test(c.n)){
    const baseWeek=weekPlan();
    return `<div class="deep-card"><div class="deep-badge">🧠 Balance Semanal Estratégico</div>
    <p class="sub" style="margin-bottom:10px">Distribución calculada para minimizar cambios de contexto y amortiguar el desgaste entre días pico y días livianos.</p>
    ${baseWeek}
    </div>`;
  }

  // 6. Planificación estratégica de día con soporte para cualquier fecha ("hoy", "mañana", "viernes")
  if(/\b(?:organiza(?:me)?|planifica(?:me)?|ordena(?:me)?|prioriza(?:me)?|arma(?:me)?|haz(?:me)?)\b.*\b(?:dia|hoy|manana|tarde|jornada|plan)\b|\bmi plan\b|\bplan (?:del|de) (?:dia|hoy|manana)\b|\bque hago (?:hoy|manana|este dia)\b/.test(c.n)){
    const targetDk=parseWhen(c.o).date||dkey(new Date());
    const tk=dkey(new Date()),isToday=targetDk===tk;
    const lbl=isToday?'hoy':dueLabel({due:targetDk});
    const basePlan=planDay(targetDk);
    const pend=S.tasks.filter(t=>!t.done);
    const dayTasks=pend.filter(t=>t.due&&(isToday?t.due<=targetDk:t.due===targetDk));
    const totalMin=dayTasks.reduce((a,t)=>a+est(t),0);
    const topUrg=dayTasks.find(t=>t.pri===3)||dayTasks[0];

    return `<div class="deep-card"><div class="deep-badge">🧠 Auditoría y Planificación Diaria Avanzada</div>
    <div style="margin-bottom:12px;font-size:13.5px;line-height:1.6">
      <b>Diagnóstico de Carga Cognitiva (${esc(lbl)}):</b> Tienes <b>${pl(dayTasks.length,'tarea activa','tareas activas')}</b> para ${esc(lbl)}, equivalentes a aprox. <b>${hm(totalMin)}</b> de esfuerzo neto concentrado.
      ${totalMin>300?'<br><span style="color:var(--hi)">⚠️ Carga pesada (>5 horas): existe riesgo alto de fatiga al final de la jornada. Protege tus descansos.</span>':'<br><span style="color:var(--ok)">✓ Carga equilibrada y factible. Con buena cadencia cerrarás la jornada con margen libre.</span>'}

      <b>Regla de Oro (${esc(lbl)}):</b> La tarea bisagra es «<b>${esc(topUrg.title)}</b>». Si solo consigues terminar esta tarea, la jornada habrá valido la pena.
    </div>`:''}
    </div>`;
  }

  // 7. Objetivos y proyectos a mediano plazo (Work Breakdown Structure)
  const rawGoal=isWBSGoal(c);
  if(rawGoal){
    const goalTitle=capFirst(cleanTitle(rawGoal));
    const gCat=classify(goalTitle);
    const p1=`${goalTitle}: Diagnóstico y definición de alcance`;
    const p2=`${goalTitle}: Configuración de recursos e infraestructura mínima`;
    const p3=`${goalTitle}: Primer sprint ejecutable (prueba piloto)`;
    const p4=`${goalTitle}: Revisión de métricas y consolidación de hábito`;
    const d1=dkey(addDays(new Date(),1));
    const d2=dkey(addDays(new Date(),3));
    const d3=dkey(addDays(new Date(),7));
    const d4=dkey(addDays(new Date(),14));

    pending={run:()=>{
      snap();
      const planTasks=[
        {title:p1,due:d1,cat:gCat},
        {title:p2,due:d2,cat:gCat},
        {title:p3,due:d3,cat:gCat},
        {title:p4,due:d4,cat:gCat}
      ];
      planTasks.forEach(pt=>{
        S.tasks.push({id:S.next++,title:pt.title,cat:pt.cat,pri:2,due:pt.due,time:null,est:45,done:false,created:Date.now(),notified:false});
      });
      logAct('task',gCat);save();renderPanel();syncChatDOM();
      return `<p>🚀 <b>Roadmap cargado</b>: integré 4 hitos secuenciales para «${esc(goalTitle)}» en tu agenda de los próximos 14 días.</p>`;
    }};

    return `<div class="deep-card"><div class="deep-badge">🧠 Arquitectura de Metas (WBS)</div>
    <p>Para que «<b>${esc(goalTitle)}</b>» pase de aspiración abstracta a logro inevitable, la descomponemos en 4 hitos estratégicos:</p>
    <div class="slot"><b>Día +1</b><div class="row"><span class="ttl">${esc(p1)}</span><span class="meta">${gCat}</span></div></div>
    <div class="slot"><b>Día +3</b><div class="row"><span class="ttl">${esc(p2)}</span><span class="meta">${gCat}</span></div></div>
    <div class="slot"><b>Día +7</b><div class="row"><span class="ttl">${esc(p3)}</span><span class="meta">${gCat}</span></div></div>
    <div class="slot"><b>Día +14</b><div class="row"><span class="ttl">${esc(p4)}</span><span class="meta">${gCat}</span></div></div>
    <p class="sub">¿Importo estos 4 hitos directamente a tus tareas con sus fechas sugeridas?</p>
    <div class="btns"><button class="pill" data-say="sí">Sí, importar a mis tareas</button><button class="pill" data-say="no">No, solo consultar</button></div>
    </div>`;
  }

  // 9. Reglas conversacionales o utilitarias (con tarjeta mejorada si es cálculo matemático)
  const pl0=S.tasks.length;
  for(const r of RULES){
    const m=r.re.exec(c.n);if(!m)continue;
    const g=i=>m.indices[i]?c.o.slice(m.indices[i][0],m.indices[i][1]):'';
    const c0=conv,out=r.fn(m,g,c);
    if(out!=null){
      if(conv===c0)convReset();
      if(r.q)lastQ=c.o;
      if(r.fn===addTaskFn)return out+buildDeepTaskAdvice(S.tasks.length>pl0?S.tasks[S.tasks.length-1]:null);
      if(/^<p style="font-size:20px"><b>/.test(out)){
        const num=out.replace(/<[^>]+>/g,'');
        return `<div class="deep-card"><div class="deep-badge">🧠 Deducción Matemática y Análisis</div>
        <p style="font-size:22px;font-weight:600;margin:6px 0;color:var(--acc)">${esc(num)}</p>
        <p class="sub">Operación evaluada con precisión sin coma flotante residual. Si corresponde a un presupuesto o cálculo de tiempo para una tarea, puedes asignarlo con <code data-fill="Tarea: ">Tarea: …</code></p>
        </div>`;
      }
      return out;
    }
  }

  // la primera respuesta es su nombre solo si nada más la entendió
  if(firstMsg&&nameFromFirst(c))return `<div class="deep-card"><div class="deep-badge">🧠 Identidad Asimilada</div><p>Encantado de conocerte, <b>${esc(S.profile.name)}</b>. He registrado tu nombre en tu espacio local. ¿Qué plan o tarea priorizamos hoy?</p></div>`;

  // 10. Creación implícita de tareas o reuniones (ej: "Mañana a las 10 reunión con Ana") con consejos del Modelo Profundo
  if(shouldImplicitAddTask(c)){
    convReset();
    const prevLen=S.tasks.length;
    const out=addTask(c.o);
    const created=S.tasks.length>prevLen?S.tasks[S.tasks.length-1]:null;
    return out+buildDeepTaskAdvice(created);
  }

  // 11. Fallback analítico profundo
  const fb=fallback(c,opts);
  if(fb&&typeof fb==='object')return fb; /* {web:…}: pregunta que se resuelve con internet (con permiso) */
  return `<div class="deep-card"><div class="deep-badge">🧠 Análisis Profundo</div>${fb}</div>`;
}

const WEB={

const enc=encodeURIComponent;
/* segmento de ruta seguro: encodeURIComponent no codifica el punto y «.»/«..» cambiarían la ruta */
const seg=s=>enc(s).replace(/\./g,'%2E');
class WebErr extends Error{constructor(kind,msg){super(msg||kind);this.kind=kind}}
/* ¿se permite usar la red ahora mismo? (nunca en modo Rápido ni con internet desactivado) */
const webOn=()=>S.mode!=='fast'&&S.web!==false;
const WEBCTLS=new Set();

/* ÚNICO punto de salida a la red: GET con tiempo límite; devuelve JSON o lanza WebErr(blocked|cancel|offline|timeout|http|network|bad) */
async function getJSON(url,ms=9000){

async function wikiSearch(q,base=WEB.wiki){
  const d=await getJSON(`${base}?action=query&format=json&origin=*&redirects=1&generator=search&gsrsearch=${enc(q)}&gsrlimit=6&gsrnamespace=0&prop=extracts%7Cpageprops%7Cinfo&exintro=1&explaintext=1&exlimit=max&ppprop=disambiguation&inprop=url`);
  const pg=d&&d.query&&d.query.pages;if(!pg||typeof pg!=='object')return [];
  return Object.values(pg).filter(p=>p&&typeof p==='object'&&typeof p.title==='string').sort((a,b)=>(num(a.index)||99)-(num(b.index)||99)).map(p=>({title:p.title,extract:(typeof p.extract==='string'?p.extract:'').trim().slice(0,8000),url:typeof p.fullurl==='string'?p.fullurl:`https://es.wikipedia.org/wiki/${seg(p.title.replace(/ /g,'_'))}`,dis:!!(p.pageprops&&typeof p.pageprops==='object'&&'disambiguation' in p.pageprops)}));
}
async function wikiAnswer(it,onStep){
  const q=it.q,qw=qWords(it.raw||q);
  onStep(`Buscando «${q}» en Wikipedia…`);
  const res=await wikiSearch(q);
  const nq=norm(q).replace(/^(?:el|la|los|las|un|una)\s+/,'');
  const ok=r=>!r.dis&&r.extract&&relevant(qw,r.title+' '+r.extract.slice(0,400));
  const exact=res.find(r=>!r.dis&&r.extract&&norm(r.title)===nq);
  const best=exact||(res[0]&&res[0].dis?null:res.find(ok));
  if(!best){
    const opts=res.filter(r=>!r.dis&&r.title).slice(0,4);
    if(res.some(r=>r.dis)&&opts.length>=2)return webCard('Wikipedia',`<p>«${esc(q)}» puede referirse a varias cosas. ¿Cuál te interesa?</p>`+opts.map(r=>`<button class="pill" data-say="${esc('qué es '+r.title)}">${esc(r.title)}</button>`).join(''),[{name:'Wikipedia',url:res[0].url}]);
    return null;
  }
  onStep(`Leyendo «${best.title}» y extrayendo lo relevante…`);
  const text=best.extract,def=it.mode==='define';
  let lead,rest;
  if(def){lead=trunc(text,720);rest=text.slice(lead.endsWith('…')?lead.length-1:lead.length).trim()}
  else{
    lead=trunc(pickSentences(text,qw,3),720);
    const used=new Set(sentences(pickSentences(text,qw,3)).map(s=>s.trim()));
    rest=sentences(text).map(s=>s.trim()).filter(s=>s&&!used.has(s)).join(' ');
  }
  setWebCtx({kind:'wiki',title:best.title,url:best.url,rest});
  return webCard('Wikipedia',`<p><b>${esc(best.title)}</b></p><p>${esc(lead)}</p>`,[{name:'Wikipedia',url:best.url}]);
}
/* «cuéntame más»: sigue donde se quedó la respuesta anterior, sin saltarse nada */
function webMore(){
  const w=ctxWeb();if(!w||w.kind!=='wiki')return null;
  const chunk=trunc(w.rest||'',720);

  const n=c.n;
  if(it.kind==='fx'||it.kind==='fxask'||it.kind==='fxpeso'||it.kind==='crypto')return PERSFX.test(n)?null:it;
  if(it.kind==='weather'||it.kind==='time'||it.kind==='nosource')return PERS.test(n)?null:it;
  if(it.kind==='translate')return longDigits(it.text)?null:it;
  if(it.explicit)return it;  /* «busca en internet X»: lo pidió el usuario con esas palabras */
  const topic=it.kind==='dict'?it.word:it.kind==='country'?it.country:it.q;
  if(PERS.test(n)||longDigits(topic))return null;
  const ov=dataOverlap(topic);
  if(ov.length&&it.kind==='wiki'&&it.mode==='qa'&&searchAll(c.o,.6,2))return null;   /* la respuesta está en tus propios datos: se contesta aquí */
  if(ov.length)it.consent='data',it.overlap=ov;   /* menciona algo de tus datos: se pregunta antes de enviar */
  else if(CONTACT_RE.test(norm(topic))||(PRIVN.test(norm(topic))&&/[A-ZÁÉÍÓÚÑ]/.test(topic.slice(1)))||(qWords(topic).some(w=>GIVEN.has(w))&&(topic.match(/[A-ZÁÉÍÓÚÑ][\p{L}]+/gu)||[]).length<=1))
    it.consent='person',it.overlap=[];                /* parece alguien o algo de tu entorno: se pregunta */
  return it;
}

/* clasifica la frase (solo texto, nunca toca la red); sin internet sirve para decir «esto necesita internet» en vez de contestar otra cosa */
function webClassify(c0){
  const c=xLead(c0),n=c.n;
  if(n.length<4||n.length>600||tryCalc(c.o)!=null)return null;
  if(isLocalCommand(c0)||isLocalCommand(c)||META_TE.test(c0.o))return null;
  const it=intentWeather(c)||intentTime(c)||intentNoSource(c)||intentCrypto(c)||intentFx(c)||intentTranslate(c)||intentCountry(c)||intentRecipe(c)||intentDict(c)||intentWiki(c);
  return it?guardIt(it,c):null;
}

const RESID_BLOCK=/\b(?:me|te|le|nos|yo|tu|tus|su|sus|estoy|estas|tengo|tienes|siento|quiero|puedo|puedes|debo|deberia|hago|hacemos|dejo|duermo|lloro|voy|sirves|eres|sabes|crees|creo|pasa|comer|cenar|almorzar|desayunar|faltan?|falta|cae|ayer|hoy|manana|estamos|gano|cobro|gasto|ahorro|pienso|opino|necesito)\b/;
function webResidual(c0){
  if(!webOn())return null;
  const c=xLead(c0),n=c.n;
  if(n.length<6||n.length>300||n.split(' ').length<2||!(c.q||WHQ.test(n)))return null;
  if(isLocalCommand(c0)||isLocalCommand(c)||META_TE.test(c0.o)||PERS.test(n)||RESID_BLOCK.test(n)||/^y\b/.test(n)||/%/.test(c.o)||/\d/.test(c.o.replace(/\b(?:1\d{3}|20\d{2})\b/g,'')))return null;

/* ¿es plausible que el usuario esté contestando con un lugar? */
function okReply(c){
  const p=c.o.replace(/^(?:en|de|para)\s+/i,'').trim(),k=norm(p),w=k.split(' ');
  if(!/^[A-Za-zÁÉÍÓÚáéíóúñÑüÜ .,'-]{2,40}$/.test(p)||w.length>3||!okPlace(p))return false;
  if(AFF.test(k)||NEG.test(k)||ACK.test(k)||LAUGH.test(k)||GREET.test(k)||CMDRE.test(k)||COMMANDY.test(k)||NARR.test(k)||SELF.test(k)||PERS.test(k))return false;
  if(/^(?:mejor|olvid|deja|ya no|no\b|nada|gracias|tengo|estoy|quiero|dime|anota|recuerd|y\b)/.test(k)||/^[a-z]{4,}(?:ar|er|ir)\b/.test(w[0]))return false;
  const wh=parseWhen(p);return !(wh.date||wh.time);
}
/* seguimientos de la última respuesta web: «¿y mañana?», «¿y en Lima?», «¿y en euros?», «cuéntame más» */
function webFollowUp(c){
  const w=ctxWeb();if(!w||!webOn())return null;
  const n=c.n,words=n.split(' ').length;let m;
  if(/^(?:cuentame mas|dime mas|mas|sigue|continua|amplia|ampliar|y que mas|algo mas|mas detalles|mas informacion|explicame mas|profundiza|puedes ampliar|cuentame (?:algo )?mas(?: sobre eso)?)$/.test(n))return w.kind==='wiki'?{kind:'more'}:null;
  if(words>5||/^(?:que|como|cuando|por que|quien)\b/.test(n))return null;
  if(w.kind==='weather-ask'){webCtx=null;return okReply(c)?{kind:'weather',day:w.day,place:c.o.replace(/^(?:en|de|para)\s+/i,'').replace(/[¿?¡!.,;:]+$/,'')}:null}
  if(w.kind==='weather'||w.kind==='time'){
    if(m=/^y\s+(hoy|manana|pasado manana|(?:el\s+)?fin de semana|(?:esta\s+)?semana)$/.exec(n)){if(w.kind==='time')return null;return{kind:'weather',place:w.place,day:m[1]==='hoy'?0:m[1]==='manana'?1:m[1]==='pasado manana'?2:'week'}}
    if(m=/^y\s+(?:en|para|alla en|ahi en)\s+(?:la\s+|el\s+)?(.+)$/.exec(n)){
      const p=c.o.slice(c.o.length-m[1].length).replace(/[¿?¡!.,;:]+$/,'');
      if(!okReply({o:p,n:norm(p)}))return null;
      return w.kind==='time'?{kind:'time',place:p}:{kind:'weather',place:p,day:w.day};
    }
  }
  if(w.kind==='fx'){
    if(m=/^y\s+(?:en\s+)?(.+)$/.exec(n)){const f=fxMentions(m[1]);if(f.length&&f[0].cur!=='PESO?')return{kind:'fx',from:f[0].amt!=null?f[0].cur:w.from,to:f[0].amt!=null?w.to:f[0].cur,amt:f[0].amt||w.amt}}
  }
  if(w.kind==='country'){
    if(m=/^y\s+(?:su\s+|el\s+|la\s+)?(capital|poblacion|habitantes|idioma|idiomas|moneda|superficie|continente|prefijo)$/.exec(n))return{kind:'country',fact:{habitantes:'poblacion',idiomas:'idioma'}[m[1]]||m[1],country:w.country,raw:c.o};
    if(m=/^y\s+(?:de|del|en)\s+(?:la\s+|el\s+)?(.+)$/.exec(n)){const p=c.o.slice(c.o.length-m[1].length).replace(/[¿?¡!.,;:]+$/,'');if(okPlace(p)&&!PERS.test(norm(p)))return{kind:'country',fact:w.fact,country:p,raw:c.o}}
  }
  return null;
}

async function runWeb(it,onStep){

const chat=$('#chat'),scroll=$('#scroll'),input=$('#in'),go=$('#go'),psearch=$('#psearch');
/* HTML del historial guardado: solo etiquetas y atributos conocidos */
const OKTAGS=new Set('p b i u em strong span div br button details summary a h4 code small ul ol li'.split(' '));
const OKATTR=new Set(['class','data-say','data-cmd','data-fill','data-tab','data-ics','data-tid','data-nid','title','aria-label','open','hidden','type','style','href','target','rel']);
function cleanHTML(h){
  const doc=new DOMParser().parseFromString('<body>'+String(h)+'</body>','text/html');
  const walk=el=>{
    for(const ch of [...el.children]){
      if(!OKTAGS.has(ch.tagName.toLowerCase())){ch.remove();continue}
      for(const a of [...ch.attributes]){
        const k=a.name.toLowerCase(),v=a.value;
        if(!OKATTR.has(k)){ch.removeAttribute(a.name);continue}
        if(k==='style'&&(!/^[\w\s:;.%#(),'-]*$/.test(v)||/url\s*\(|expression|@import|javascript:/i.test(v)))ch.removeAttribute(a.name);
        else if(k==='href'&&!/^https:\/\//i.test(v))ch.removeAttribute(a.name);
        else if(k==='target'&&v!=='_blank')ch.removeAttribute(a.name);
      }
      if(ch.tagName==='A'){ch.setAttribute('rel','noopener noreferrer');if(!ch.getAttribute('href'))ch.removeAttribute('target')}
      walk(ch);
    }
  };
  walk(doc.body);return doc.body.innerHTML;
}
/* un respaldo solo aporta datos: tipos comprobados, ids numéricos y sin historial, modo ni red */
function cleanImport(d){

    tasks:arr(d.tasks).map((t,i)=>({...fix(t,i),pri:[1,2,3].includes(+t.pri)?+t.pri:2,due:dateOk(t.due),time:timeOk(t.time),done:!!t.done,notified:!!t.notified,created:Number.isFinite(+t.created)?+t.created:0,doneAt:Number.isFinite(+t.doneAt)?+t.doneAt:undefined,est:Number.isFinite(+t.est)?+t.est:undefined})),

const hist=[];let hi=0;

  if(text.length>MAXIN){
