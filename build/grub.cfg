# Menú de arranque de @OS_NAME@ @VERSION@
set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png
loadfont unicode
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm
background_image /boot/grub/background.png

set menu_color_normal=white/black
set menu_color_highlight=black/white
set color_normal=white/black

menuentry "@OS_NAME@" {
    linux /casper/vmlinuz boot=casper quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip ---
    initrd /casper/initrd
}

# Si la pantalla sale negra o el escritorio no arranca (típico en máquinas virtuales
# sin aceleración 3D): renderizado por software y sin efectos pesados.
menuentry "@OS_NAME@ — gráficos seguros" {
    linux /casper/vmlinuz boot=casper quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip infinity.safe=1 ---
    initrd /casper/initrd
}

# Último recurso si lo anterior tampoco funciona.
menuentry "@OS_NAME@ — gráficos seguros (sin aceleración de vídeo: nomodeset)" {
    linux /casper/vmlinuz boot=casper quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip infinity.safe=1 nomodeset ---
    initrd /casper/initrd
}

menuentry "@OS_NAME@ — diagnóstico (muestra los mensajes de arranque)" {
    linux /casper/vmlinuz boot=casper loglevel=7 ---
    initrd /casper/initrd
}
