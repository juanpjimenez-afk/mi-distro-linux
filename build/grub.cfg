# Menú de arranque de @OS_NAME@ @VERSION@
set default=0
set timeout=5

insmod all_video
insmod gfxterm
insmod png
loadfont unicode
# Resolución fija y modesta: con "auto" GRUB elige la más alta (4K...) y el menú tarda en dibujarse.
set gfxmode=1024x768,800x600,auto
set gfxpayload=keep
terminal_output gfxterm
background_image /boot/grub/background.png

set menu_color_normal=white/black
set menu_color_highlight=black/white
set color_normal=white/black

# Guardado de cambios: con «persistent», casper usa (o crea la primera vez, si el USB tiene al menos 100 MiB
# libres tras la ISO) una partición ext4 «writable» como capa de escritura. Así el HOME, los ajustes, pAnkI,
# el calendario, las redes wifi y lo que instales sobreviven al apagado. Si no hay dónde guardar (CD, ISO en
# una máquina virtual sin segundo disco), arranca igual, en modo en vivo.
menuentry "@OS_NAME@" {
    linux /casper/vmlinuz boot=casper persistent noprompt quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip ---
    initrd /casper/initrd
}

# Sesión limpia: nada se guarda ni se lee de la partición de guardado (útil si un cambio guardado estropeó algo).
menuentry "@OS_NAME@ — sesión limpia (no guarda cambios)" {
    linux /casper/vmlinuz boot=casper nopersistent noprompt quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip ---
    initrd /casper/initrd
}

# Si la pantalla sale negra o el escritorio no arranca (típico en máquinas virtuales
# sin aceleración 3D): renderizado por software y sin efectos pesados.
menuentry "@OS_NAME@ — gráficos seguros" {
    linux /casper/vmlinuz boot=casper persistent noprompt quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip infinity.safe=1 ---
    initrd /casper/initrd
}

# Último recurso si lo anterior tampoco funciona.
menuentry "@OS_NAME@ — gráficos seguros (sin aceleración de vídeo: nomodeset)" {
    linux /casper/vmlinuz boot=casper persistent noprompt quiet loglevel=3 systemd.show_status=0 nowatchdog fsck.mode=skip infinity.safe=1 nomodeset ---
    initrd /casper/initrd
}

menuentry "@OS_NAME@ — diagnóstico (muestra los mensajes de arranque)" {
    linux /casper/vmlinuz boot=casper noprompt loglevel=7 ---
    initrd /casper/initrd
}
