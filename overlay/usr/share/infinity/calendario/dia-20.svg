    <path transform="translate(116 149)" d="M17,62 C17,32 38,15 65,15 C92,15 113,32 113,60 C113,104 17,130 17,198 H113"/>
    <path transform="translate(266 149)" d="M59,15 H71 A44,44 0 0 1 115,59 V154 A44,44 0 0 1 71,198 H59 A44,44 0 0 1 15,154 V59 A44,44 0 0 1 59,15 Z"/>
