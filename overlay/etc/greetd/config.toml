# greetd: gestor de inicio de sesión mínimo.
[terminal]
vt = 7

# Al arrancar la ISO en vivo se entra directo al escritorio (solo la primera vez), y empieza con la
# pantalla de bloqueo: la variable avisa a hyprland.conf (exec-once: infinity-lock --arranque).
# Si cierras sesión, aparece el login de texto (tuigreet), y al entrar con él no se bloquea.
[initial_session]
command = "env INFINITY_BLOQUEO_ARRANQUE=1 infinity-session"
user = "@LIVE_USER@"

[default_session]
command = "tuigreet --time --asterisks --remember --cmd infinity-session"
user = "_greetd"
