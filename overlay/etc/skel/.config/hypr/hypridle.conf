# Generado por Ajustes de Infinity OS (los tiempos son segundos). Cámbialos desde la app de Ajustes.
general {
    lock_cmd         = infinity-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# Tras 10 min sin actividad: bloquear
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# Tras 11 min: apagar la pantalla
listener {
    timeout    = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
