# Generado por Ajustes de Infinity OS: no lo edites a mano, usa la app de Ajustes.
# Se lee al final de hyprland.conf: lo que hay aquí tiene prioridad sobre lo de allí.

monitor = , preferred, auto, 1

input {
    kb_layout    = latam
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

general {
    gaps_in  = 6
    gaps_out = 34, 14, 14, 14
}

decoration {
    rounding = 22
    shadow {
        enabled = true
    }
    blur {
        enabled = true
        passes  = 3
    }
}

animations {
    enabled = true
}

misc {
    background_color = rgb(15193a)
}
