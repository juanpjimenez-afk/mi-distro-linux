# ╔══════════════════════════════════════════════════════════════════╗
# ║  Infinity OS — configuración de Hyprland                         ║
# ║  Tu copia vive en ~/.config/hypr/hyprland.conf (edítala a gusto) ║
# ╚══════════════════════════════════════════════════════════════════╝

monitor = , preferred, auto, 1

$mod      = SUPER
$terminal = foot
$files    = thunar
$browser  = epiphany

# ───────────────────────────── Arranque ─────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Primer inicio tras encender (greetd lo marca): el escritorio empieza bloqueado. Al volver a entrar
# con tuigreet no bloquea.
exec-once = infinity-lock --arranque
exec-once = infinity-wallpaper           # el fondo: la cascada, o color sólido si lo eliges (ver el script)
exec-once = infinity-shell
exec-once = hypridle

# ───────────────────────────── Teclado y ratón ──────────────────────
input {
    kb_layout    = @KB_LAYOUT@
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# ───────────────────────────── Aspecto "liquid glass" ───────────────
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 1
    # Borde de luz: brillante arriba-izquierda, casi invisible abajo-derecha
    col.active_border   = rgba(ffffff77) rgba(ffffff14) 45deg
    col.inactive_border = rgba(ffffff22)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 22
    rounding_power = 3.0          # esquinas "squircle", más suaves que un círculo

    shadow {
        enabled      = true
        range        = 36
        render_power = 3
        color        = rgba(00000070)
    }

    # El desenfoque es el alma del efecto cristal.
    blur {
        enabled           = true
        size              = 10
        passes            = 3
        vibrancy          = 0.45   # satura los colores que hay detrás del cristal
        vibrancy_darkness = 0.0
        noise             = 0.012
        contrast          = 0.95
        brightness        = 1.05
        popups            = true
        popups_ignorealpha = 0.2
        new_optimizations = true
    }
}

# La ventana de Juegos flota y sale centrada: es una herramienta, no una ventana de trabajo.
# Tk escribe la clase con la inicial en mayúscula ("Infinity-juegos", comprobado con Xvfb): por eso
# la expresión acepta las dos formas.
windowrule = float on, match:class ^[Ii]nfinity-juegos$
windowrule = center on, match:class ^[Ii]nfinity-juegos$

# Desenfoque para las piezas del shell (orbe, dock, estado, buscador).
# ignore_alpha: no desenfoca las zonas transparentes (esquinas redondeadas).
layerrule = blur on, match:namespace ^infinity-.*$
layerrule = ignore_alpha 0.3, match:namespace ^infinity-.*$
# Orbe, dock y estado solo tienen el fondo detrás: con "xray" su desenfoque se calcula una vez
# y se reutiliza en vez de recalcularse en cada fotograma (se ve igual y trabaja menos).
layerrule = xray on, match:namespace ^infinity-(dock|orb|status)$

animations {
    enabled = true
    bezier  = glass, 0.22, 1.0, 0.36, 1.0
    animation = windows,     1, 4, glass, popin 92%
    animation = windowsOut,  1, 3, glass, popin 92%
    animation = fade,        1, 4, glass
    animation = layers,      1, 4, glass, fade
    animation = workspaces,  1, 5, glass, slide
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

# ───────────────────────────── Rendimiento ──────────────────────────
misc {
    vfr = true                       # solo redibuja cuando hay cambios: menos CPU/GPU y batería
    disable_hyprland_logo      = true
    disable_splash_rendering   = true
    force_default_wallpaper    = 0
    middle_click_paste         = false
    allow_session_lock_restore = true   # si el bloqueo falla, se puede relanzar en vez de quedar en negro
    disable_hyprland_guiutils_check = true   # Ubuntu no trae hyprland-guiutils: sin este aviso molesto
    background_color = rgb(15193a)           # fondo sólido: lo que se ve con el fondo de color y sin imagen
}
ecosystem {
    no_update_news   = true
    no_donation_nag  = true
}

cursor {
    no_hardware_cursors = 2          # auto: evita cursores invisibles en máquinas virtuales
}

# ───────────────────────────── Atajos ───────────────────────────────
bind = $mod, SPACE,  exec, gapplication action org.infinity.Shell toggle-launcher || infinity-shell --toggle-launcher   # buscador / apagar
bind = $mod, RETURN, exec, $terminal
bind = $mod, E,      exec, $files
bind = $mod, B,      exec, $browser
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
# bindl (y no bind): también funciona con la pantalla bloqueada, así Super + L vuelve a bloquear si el bloqueo se cayó.
bindl = $mod, L,      exec, infinity-lock
bind = $mod, COMMA,  exec, infinity-ajustes   # ajustes del sistema

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Capturas: Impr = región al portapapeles · Shift+Impr = pantalla completa a ~/Imágenes
bind = , Print,       exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print,  exec, grim ~/Imágenes/captura-$(date +%F-%H%M%S).png

# Volumen y brillo (teclas multimedia)
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && gapplication action org.infinity.Shell refresh
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%- && gapplication action org.infinity.Shell refresh
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && gapplication action org.infinity.Shell refresh
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Ratón: Super + arrastrar mueve · Super + clic derecho redimensiona
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ───────────────────────────── Ajustes ──────────────────────────────
# Lo generado por la app de Ajustes (escala, cristal, bloqueo de pantalla...). Va al final para
# que sus valores manden sobre los de arriba. Cámbialos desde Ajustes (Super + ,), no a mano.
source = ~/.config/hypr/infinity-ajustes.conf
