# Terminal con efecto cristal: el fondo es translúcido y Hyprland lo desenfoca.
[main]
font=JetBrains Mono:size=11
pad=18x14
term=xterm-256color

[colors]
alpha=0.55
background=0b0f1e
foreground=e6e9ff
regular0=1b2036
regular1=ff6b8b
regular2=5fe3b0
regular3=ffd479
regular4=7aa2ff
regular5=c79bff
regular6=5ad8ff
regular7=d8dcf5
bright0=4a5275
bright1=ff8fa6
bright2=86f0c6
bright3=ffe3a1
bright4=9db9ff
bright5=dcbcff
bright6=8be6ff
bright7=ffffff

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes
