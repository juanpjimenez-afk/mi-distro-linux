[main]
# Pantalla de bloqueo de Infinity OS. El aspecto está en /usr/share/infinity/lock/
background=/usr/share/infinity/wallpaper-lock.jpg
style=/usr/share/infinity/lock/style.css
layout=/usr/share/infinity/lock/layout.xml
# Formato de la hora: %H:%M = 13:45 · con segundos: %H:%M:%S
time-format=%H\n%M
date-format=%A, %-d de %B
# Al bloquear solo se ve la hora; la contraseña aparece al tocar una tecla o el ratón
# y se vuelve a esconder tras unos segundos sin actividad.
start-hidden=true
idle-hide=true
idle-timeout=10
