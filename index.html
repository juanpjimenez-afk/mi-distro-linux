=== buena-pregunta | Cómo pedir ayuda de programación (y cómo usar Stack Overflow) | cómo hacer una buena pregunta; pedir ayuda programación; stack overflow; mcve; ejemplo mínimo reproducible; cómo preguntar en foros; pedir ayuda a una ia; prompt para programar; cómo buscar errores en google; documentación; leer la documentación | general
Una buena pregunta se resuelve más rápido (con personas, foros o una IA):
1. **Contexto**: qué querés lograr (el objetivo, no solo el síntoma), lenguaje y versión, sistema operativo, librerías.
2. **Ejemplo mínimo reproducible**: el código más corto que muestre el problema (sin tu proyecto entero). Al reducirlo muchas veces descubrís el error.
3. **Qué esperabas** vs **qué pasó**: resultado esperado y real.
4. **El mensaje de error completo** (texto, no captura), con el *traceback*.
5. **Qué ya probaste**.
6. Formato: código en bloques, título concreto ("TypeError al sumar fechas en pandas" > "ayuda no funciona").

**Cómo buscar**: copiá el mensaje de error entre comillas, sacá lo propio de tu proyecto (rutas, nombres) y agregá el lenguaje/librería. Priorizá la **documentación oficial**, issues de GitHub y respuestas con votos recientes; verificá la fecha (versiones viejas).

**Con una IA**: pegá el código y el error completo, explicá el objetivo, indicá versiones y pedí que explique la causa y no solo el arreglo. **Verificá siempre** lo que sugiere (puede inventar funciones o parámetros) y probalo.
--- más
Aprender a leer documentación es una habilidad clave: buscá "Getting started", la referencia de la función y los ejemplos. Desconfiá de copiar y pegar código que no entendés, sobre todo comandos con `sudo` o `rm`.

**Rutas comunes**
- **Frontend**: HTML, CSS, JavaScript/TypeScript, React/Vue, accesibilidad, rendimiento.
- **Backend**: un lenguaje (Python, JavaScript/Node, Java, C#, Go), HTTP/APIs REST, bases de datos SQL, autenticación, testing, Docker.
- **Full stack**: ambos.
- **Datos / IA**: Python, SQL, estadística, pandas, scikit-learn, visualización.
- **DevOps / Cloud**: Linux, redes, Docker, CI/CD, Terraform, AWS/Azure/GCP.
- **Móvil**: Kotlin (Android), Swift (iOS) o Flutter / React Native.
- **Videojuegos**: C#/Unity, C++/Unreal, Godot.

**Plan práctico**
1. Fundamentos (variables, estructuras, funciones, POO) en **un** lenguaje + **Git**, terminal y **SQL**.
2. **3–4 proyectos propios** que resuelvan algo real (no solo tutoriales): una API con base de datos, una app web desplegada, un script que automatice algo.
3. **Portfolio**: perfil de GitHub ordenado, README claros (qué hace, capturas, cómo correrlo) y proyectos online.
4. Practicá **algoritmos y estructuras de datos** de forma moderada (LeetCode, HackerRank) para entrevistas.
5. Currículum de una página: tecnologías, proyectos con enlaces y logros concretos; perfil de LinkedIn.
6. Postulá seguido, pedí feedback, participá en comunidades, hacé *open source* (empezá con issues "good first issue").

**Entrevista técnica**: explicá tu razonamiento en voz alta, hacé preguntas, empezá con una solución simple y mejorala, mencioná complejidad y casos borde. Prepará también preguntas de comportamiento (trabajo en equipo, errores, conflictos).
--- más
Mantenete actualizado con constancia, no con maratones: leé código ajeno, documentación y *post-mortems*. Las habilidades blandas (comunicación, ownership, curiosidad) pesan tanto como las técnicas.

  let url, w;
  // se envuelve en una función async para admitir `await` de nivel superior; worker clásico porque los de módulo no cargan desde file://
  const src = pre + '(async () => {\n' + codeText + '\n})().then(() => postMessage({ k: "__fin" }), e => { console.error(e); postMessage({ k: "__fin" }); });';
  try { url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' })); w = new Worker(url); }
  catch { add('Tu navegador no permite crear el entorno aislado.', 1); return; }
  let n = 0, idle = null, done = false;
  const end = why => { if (done) return; done = true; clearTimeout(idle); clearTimeout(cap); w.terminate(); URL.revokeObjectURL(url); if (why) add(why, 1); else if (!n) add('(sin salida: usá console.log para ver resultados)'); };
  const cap = setTimeout(() => end('Detenido a los 6 segundos (¿bucle infinito?).'), 6000);
  w.onmessage = e => {
    const d = e.data;
    if (d.k === '__fin') { idle = setTimeout(() => end(), 900); return; }
    n++; add(d.t, d.k === 'error'); if (idle) { clearTimeout(idle); idle = setTimeout(() => end(), 900); }
  };
  w.onerror = e => { e.preventDefault(); const ln = e.lineno ? e.lineno - preLines : 0; n++; add((e.message || 'Error').replace(/^Uncaught /, '') + (ln > 0 ? ` (línea ${ln})` : ''), 1); end(); };
}

/* ---------- lógica de conversación (modo local) ---------- */
const GREET = /^(?:hola+|holis|holi|buenas|buen dia|buenos dias|buenas tardes|buenas noches|hey+|ey|che|que tal|como andas|como estas|como va|que onda|saludos|hello|hi)\b/;
const THANKS = /^(?:muchas |mil )?(?:gracias|gracias!|graciass+|genial|excelente|perfecto|buenisimo|barbaro|joya|copado|ok gracias|dale gracias|thx|thanks|listo gracias)\b/;
const BYE = /^(?:chau+|adios|nos vemos|hasta luego|hasta pronto|me voy|bye)\b/;
const WHO = /^(?:y\s+)?(?:quien (?:eres|sos)|como te llamas|cual es tu nombre|que (?:eres|sos)\b|presentate|presentarte)/;
const WHAT = /^(?:ayuda|help|\?|comandos|que (?:podes|puedes|sabes|haces) hacer|que sabes(?: hacer)?|en que me (?:podes|puedes) ayudar|que funciones tenes|como funciona(?:s)?|como te uso|como se usa)\b/;
const CLEAR = /^(?:borra\w*|limpia\w*|elimina\w*|nueva|nuevo|reinicia\w*|empeza\w*|empieza\w*)\s+(?:de nuevo\s+)?(?:el\s+|la\s+|una\s+|un\s+)?(?:chat|conversacion|historial|todo)/;
const JOKE = /\b(?:chiste|chistes|algo gracioso|haceme reir|hazme reir|contame algo divertido)\b/;
const JOKES = ['¿Por qué los programadores confunden Halloween con Navidad? Porque 31 OCT = 25 DEC.', 'Hay 10 tipos de personas: las que entienden binario y las que no.', 'Un programador va al supermercado. Su pareja le dice: «Comprá una botella de leche y, si hay huevos, traé 6». Vuelve con 6 botellas de leche: «¡Había huevos!».', '—¿Por qué se ahogó el programador en la pileta? —Porque seguía en el bucle: «if (agua) hundirse(); while (agua) hundirse();».', 'Un SQL entra a un bar, se acerca a dos mesas y pregunta: «¿Puedo unirme?».', '«Funciona en mi máquina» — certificado oficial de todo desarrollador.', 'Un bug no es un error: es una característica no documentada.', 'Hay solo dos cosas difíciles en computación: invalidar cachés, ponerle nombre a las cosas y los errores de uno-menos-uno (off-by-one).'];
const REALTIME = /(?:precio|cotizacion|valor|cuanto (?:esta|sale|vale|cuesta))\s+(?:de[l]?\s+|la\s+|el\s+)?(?:dolar|euro|bitcoin|btc|ethereum|oro|petroleo|nafta|acciones?|plata)\b|(?:clima|pronostico|temperatura)\s+(?:en|de|para|hoy|manana)\b|\bva a llover\b|(?:esta|estaba)\s+lloviendo|como esta el (?:clima|tiempo)|\bnoticias?\b|resultados?\s+(?:de|del)\s+(?:ayer|hoy|partido|futbol)|a que hora (?:juega|empieza|es el partido)|presidente actual|quien es el presidente|ultimas? noticias|que paso (?:hoy|ayer)/;
const MORE = /^(?:y\s+|ahora\s+|a ver\s+)?(?:(?:podes|puedes|podrias|me)\s+)?(?:(?:dame|dime|decime|quiero|necesito|mostra\w*|dame)\s+)?(?:mas(?: detalle| detalles| info| informacion| profundidad| explicacion)?|algo mas|segui|sigue|continua|continuar|ampliar?|ampliame|amplia|profundiza\w*|detalla\w*|explica\w* (?:mejor|mas|de nuevo|otra vez)|no (?:entendi|entiendo|lo entiendo|me quedo claro)|no me quedo claro|mas despacio)[\s?!.]*$/;
const EXAMPLE = /^(?:y\s+|ahora\s+)?(?:(?:dame|dime|decime|quiero|necesito|mostra\w*|pasame|a ver)\s+)?(?:un\s+|otro\s+|algun\s+)?ejemplos?(?:\s+(?:de codigo|practico|simple|sencillo|mas))?[\s?!.]*$/;
const OTHER = /^(?:otra|otro|otra opcion|otra cosa|siguiente|alternativa|algo distinto|otra respuesta|no era eso|no es eso|no era lo que buscaba|no me sirve|eso no)[\s?!.]*$/;
const LANGSW = /^(?:y\s+|pero\s+|ahora\s+|entonces\s+|dale\s+)?(?:como\s+(?:seria|queda|se hace|se escribe|se haria)\s+)?(?:en|con|usando|para)\s+([a-z0-9+#.]+)[\s?!.]*$/;

function related(res, skip, n = 2) {
  const top = res.length ? res[0].s : 0;
  return res.filter(r => r.e.id !== skip && r.s >= Math.max(LOW, 0.5 * top)).slice(0, n).map(r => ({ l: r.e.title, o: r.e.id }));
}
function setCtx(e, lang, q, res) { st.ctx = { id: e.id, lang, q, others: res.filter(r => r.e.id !== e.id).slice(0, 5).map(r => r.e.id), i: 0, more: false }; }
function showEntry(e, lang, q, res, prefix, explicit) {
  const a = entryAnswer(e, lang, explicit);
  setCtx(e, lang, q, res || []);
  const rel = related(res || [], e.id);
  return { md: (prefix ? prefix + '\n\n' : '') + a.md, chips: a.chips.concat(rel).slice(0, 6) };
}

      '- **Errores**: pegá el mensaje (o el traceback) y te explico la causa más común y cómo arreglarlo.\n' +
      '- **Código**: pegalo y reviso paréntesis, comillas e indentación. El JavaScript lo podés correr con **▶ Ejecutar**.\n' +
      '- **Utilidades**: calculadora, bases numéricas, Base64, SHA-256, UUID, contraseñas, JSON, regex (`/\\d+/ en abc123`), colores y fechas.\n' +

    chips: STARTERS.map(s => ({ l: s, q: s }))
  };
}

function meta(text, qn) {
  let m;
  if ((m = text.trim().match(/^(?:llamate|llamarte|te vas a llamar|te llamas|te llamás|tu nombre es|cambiate el nombre a|cambia tu nombre a|ponete)\s+(?:como\s+)?(.+)$/i))) {
    const nn = m[1].trim().replace(/[.!?¡¿"']+$/g, '').slice(0, 24);
    if (nn.length >= 1) { st.name = nn; saveState(); refreshHeader(); return { md: `Listo, desde ahora me llamo **${nn}**.` }; }
  }
  if (CLEAR.test(qn)) { newChat(); return { silent: true }; }
  const nw = qn.split(' ').length;
  if (GREET.test(qn) && nw <= 5) return { md: pick([`¡Hola! Soy **${st.name}**. Preguntame de programación o cultura general, o pegá código para revisarlo.`, `¡Buenas! Soy **${st.name}**. ¿Qué estás programando hoy?`, `Hola 👋 Soy **${st.name}**. Decime qué necesitás: un concepto, un error, un ejemplo de código…`]), chips: STARTERS.map(s => ({ l: s, q: s })) };
  if (THANKS.test(qn) && nw <= 6) return { md: pick(['¡De nada! Si necesitás algo más, acá estoy.', '¡A vos! Cualquier otra duda, me avisás.', 'Un gusto. ¿Seguimos con algo más?']) };
  if (BYE.test(qn) && nw <= 4) return { md: pick(['¡Chau! Cuando quieras volvemos a programar.', '¡Hasta luego!']) };
  if (WHO.test(qn) && nw <= 7) return { md: `Soy **${st.name}**, un asistente de programación y cultura general. Corre entero en tu navegador: mi base de conocimiento está dentro de este mismo archivo y no necesita conexión. Escribí «ayuda» para ver lo que sé hacer.` };
  if (WHAT.test(qn) && nw <= 8) return helpAnswer();
  if (JOKE.test(qn) && nw <= 6) return { md: pick(JOKES) };
  if (REALTIME.test(qn)) return { md: 'No tengo acceso a internet ni a datos en tiempo real (clima, cotizaciones, noticias, resultados deportivos), así que no puedo darte eso al día. Para eso usá un sitio o app específicos. Lo que sí puedo explicarte es **cómo obtener esos datos desde código** con una API.', chips: [{ l: 'Peticiones HTTP desde código', o: 'http-requests' }, { l: 'Qué es una API REST', o: 'api-rest' }] };
  return null;
}
function newChat() { st.hist = []; st.ctx = null; saveState(); renderEmpty(); input.focus(); }

function looksLikeError(t) {
  return /\b[A-Za-z]*(?:Error|Exception)\b\s*[:(]|Traceback \(most recent call last\)|^\s*at .+:\d+:\d+|segmentation fault|core dumped|\bfatal:|npm ERR|Uncaught|panic:|\bcannot\b.*\b(?:find|read|resolve|import)\b|\b(?:ECONNREFUSED|EADDRINUSE|ENOENT|EACCES)\b|command not found|permission denied|is not defined|is not a function|undefined reference|cannot find symbol/i.test(t);
}
const isTrace = t => /Traceback \(most recent call last\)|^\s+at .+:\d+:\d+|^\s+at .+\(.+\)|^\w*(?:Error|Exception)\b.*:|^Exception in thread|^npm ERR!|^fatal:|segmentation fault|^\s*File ".+", line \d+/im.test(t);
function traceInfo(t) {
  const out = [];
  let m = [...t.matchAll(/File "([^"]+)", line (\d+)(?:, in (\w+))?/g)];
  if (m.length) { const l = m[m.length - 1]; out.push(`Python dice que falló en \`${l[1].split(/[\\/]/).pop()}\`, **línea ${l[2]}**${l[3] ? ` (en \`${l[3]}\`)` : ''}.`); }
  m = [...t.matchAll(/\(?((?:[\w./\\-]+)\.(?:js|ts|jsx|tsx|mjs)):(\d+):(\d+)\)?/g)];
  if (m.length) { const l = m[0]; out.push(`Apunta a \`${l[1].split(/[\\/]/).pop()}\`, **línea ${l[2]}**, columna ${l[3]}.`); }
  m = t.match(/([\w./-]+\.(?:java|kt)):(\d+)/); if (m) out.push(`Apunta a \`${m[1].split('/').pop()}\`, **línea ${m[2]}**.`);
  m = t.match(/([\w./-]+\.(?:c|cpp|h|go|rs|rb|php|cs)):(\d+)/); if (m) out.push(`Apunta a \`${m[1].split('/').pop()}\`, **línea ${m[2]}**.`);
  return out.length ? out.join('\n') + '\n\n' : '';
}

function followUp(text, qn) {
  const c = st.ctx, e = c && KBID.get(c.id);
  if (MORE.test(qn)) {
    if (!e) return { md: '¿Más sobre qué? Hacéme primero una pregunta y después te amplío.' };
    if (!e.more || c.more) return { md: 'Sobre este tema no tengo más detalle guardado. Probá con una pregunta más específica (un caso concreto, un error, otro lenguaje), o poné una clave de API en ⚙ para que un modelo lo amplíe.', chips: related(c.others.map(id => ({ e: KBID.get(id), s: 99 })), e.id, 3) };
    c.more = true; return entryMore(e, c.lang);
  }
  if (EXAMPLE.test(qn)) {
    if (!e) return { md: '¿Un ejemplo de qué? Decime el tema, por ejemplo «ejemplo de recursión en Python».' };
    const x = entryExamples(e, c.lang); return x ? { md: x } : { md: 'Esa respuesta no tiene código. Pedime un ejemplo concreto: «ejemplo de ' + e.title.toLowerCase() + '».' };
  }
  if (OTHER.test(qn)) {
    if (!c) return { md: 'Todavía no te mostré nada para comparar. Hacéme una pregunta.' };
    const id = c.others[c.i++]; if (!id) return { md: 'No tengo más opciones cercanas. Probá reformular la pregunta con otras palabras.' };
    const n = KBID.get(id); setCtx(n, c.lang, c.q, c.others.map(i => ({ e: KBID.get(i), s: 1 }))); return entryAnswer(n, c.lang);
  }
  let m;
  if ((m = qn.match(LANGSW))) {
    const w = words(m[1])[0], L = LANGW[w] || (LANGCTX[w] ? LANGCTX[w] : null);
    if (L) {
      st.lang = L; saveState();
      if (!e) return { md: `Perfecto, uso **${LABEL[L]}** para los próximos ejemplos. ¿Qué querés ver?` };
      if (e.tags.has(L)) return showEntry(e, L, c.q, c.others.map(i => ({ e: KBID.get(i), s: 1 })), '', true);
      const r = search(c.q + ' ' + w, { ctxLang: L });
      if (r.res.length && r.res[0].s >= LOW) return showEntry(r.res[0].e, L, c.q, r.res, '', true);
      return { md: `No tengo este tema en ${LABEL[L]}. Probá preguntarlo de otra forma.` };
    }
  }
  return null;
}

function kbAnswer(text) {
  const err = looksLikeError(text);
  let r = search(text, { onlyErr: err, ctxLang: st.lang });
  if (err && (!r.res.length || r.res[0].s < LOW)) r = search(text, { ctxLang: st.lang });
  const { q, res } = r;
  if (q.lang && q.lang !== st.lang) { st.lang = q.lang; saveState(); }
  const top = res[0];
  const conf = confidence(top, q);
  if (conf === 'no') return notFound(res);
  const lang = q.lang || st.lang;
  const prefix = (err ? traceInfo(text) : '') + (conf === 'maybe' ? '_Creo que esto es lo que buscás:_' : '');
  return showEntry(top.e, lang, text, res, prefix.trim(), !!q.lang);
}
function notFound(res) {
  const chips = res.slice(0, 3).filter(r => r.s > 8).map(r => ({ l: r.e.title, o: r.e.id }));
  return {
    md: pick(['No tengo una respuesta confiable para eso en mi base local.', 'Eso no lo tengo en mi base de conocimiento.', 'Ahí no llego con lo que tengo guardado.']) +
      (chips.length ? ' Lo más cercano que encontré:' : '') + '\n\nProbá reformulando con otras palabras (nombrando el lenguaje o la herramienta ayuda mucho)' + (st.key ? '.' : ', o poné una clave de API en ⚙ Ajustes para que un modelo de Claude conteste preguntas abiertas.'),
    chips: chips.length ? chips : STARTERS.map(s => ({ l: s, q: s }))
  };
}

async function respondLocal(text, qn) {
  let r = meta(text, qn); if (r) return r;
  for (const t of TOOLS) { r = await t(text, qn); if (r) return r; }
  r = followUp(text, qn); if (r) return r;
  const cx = extractCode(text);
  if (cx && (cx.fenced || !isTrace(text))) return analyzeCode(cx);
  return kbAnswer(text);
}

/* ---------- flujo principal ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function commit(userText, ans) {
  st.hist.push({ r: 'u', t: userText });
  if (ans && ans.md) st.hist.push({ r: 'a', t: ans.md, chips: ans.chips && ans.chips.length ? ans.chips : undefined });
  saveState();
}
async function handle(text, forced) {
  text = (text || '').trim();
  if (!text || st.busy) return;
  const empty = chat.querySelector('.empty'); if (empty) chat.textContent = '';
  addUserNode(text);
  st.busy = true; st.ctrl = null; updateSend();
  const qn = norm(text).replace(/\s+/g, ' ').trim();
  const typing = typingNode();
  let ans;
  try {
    const t0 = Date.now();
    const local = forced ? await forced() : null;
    // con clave: tareas determinísticas primero (calculadora, utilidades), el resto va al modelo
    if (local) ans = local;
    else if (st.key) {
      let r = meta(text, qn); if (!r) for (const t of TOOLS) { r = await t(text, qn); if (r) break; }
      ans = r || { model: true };
    } else ans = await respondLocal(text, qn);
    if (!ans.model) { const wait = 220 - (Date.now() - t0); if (wait > 0) await sleep(wait); }
  } catch (e) { ans = { md: 'Algo falló al procesar eso (' + (e && e.message || e) + '). Probá de nuevo.' }; }
  typing.remove();
  if (ans.silent) { st.busy = false; updateSend(); return; }
  if (ans.model) await modelTurn(text);
  else { addAINode(ans.md, ans.chips); commit(text, ans); }
  st.busy = false; st.ctrl = null; updateSend(); input.focus();
}

function chipAction(c) {
  if (st.busy) return;
  if (c.q) return handle(c.q);
  if (c.m) return handle('Más detalle', async () => {
    const e = st.ctx && KBID.get(st.ctx.id); if (!e || !e.more) return { md: 'No tengo más detalle sobre este tema.' };
    st.ctx.more = true; return entryMore(e, st.ctx.lang);
  });
  if (c.o) return handle(c.g ? c.l : c.l, async () => {
    const e = KBID.get(c.o); if (!e) return { md: 'No encuentro esa entrada.' };
    const lang = c.g || (st.ctx && st.ctx.lang) || st.lang;
    return showEntry(e, lang, (st.ctx && st.ctx.q) || e.title, st.ctx ? st.ctx.others.map(i => ({ e: KBID.get(i), s: 1 })) : [], '', !!c.g);
  });
}

/* ---------- modelo remoto (opcional) ---------- */
function systemPrompt() {
  return 'Sos ' + st.name + ', un asistente de programación y cultura general que vive en una página web local. ' +
    'Respondé en español, claro y directo; empezá por la respuesta y sumá detalle solo si hace falta. ' +
    'Para código usá bloques con el lenguaje (por ejemplo ```python), explicá lo importante y avisá de los errores típicos. ' +
    'Si no estás seguro de algo, decilo; no inventes funciones ni librerías. Hoy es ' + fechaL(new Date()) + '.';
}
function apiMessages() {
  const out = [];
  for (const m of st.hist.slice(-24)) {
    if (m.err) continue;
    const role = m.r === 'u' ? 'user' : 'assistant';
    if (out.length && out[out.length - 1].role === role) out[out.length - 1].content += '\n\n' + m.t; else out.push({ role, content: m.t });
  }
  while (out.length && out[0].role !== 'user') out.shift();
  return out;
}
function apiError(status, msg) {
  if (status === 401) return 'La clave de API no es válida. Revisala en ⚙ Ajustes.';
  if (status === 403) return 'La clave no tiene permiso para usar ese modelo o esa función.';
  if (status === 404) return `El modelo «${st.model}» no existe o tu cuenta no tiene acceso. Cambialo en ⚙ Ajustes.`;
  if (status === 429) return 'Se alcanzó el límite de uso de la API. Probá de nuevo en un rato.';
  if (status >= 500 || status === 529) return 'El servicio de Claude está saturado o con problemas. Probá de nuevo en un momento.';
  return 'La API rechazó la consulta' + (msg ? ': ' + msg : '.');
}
async function modelTurn(userText) {
  st.hist.push({ r: 'u', t: userText });
  const { m, b } = addAINode('', null);
  b.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
  st.ctrl = new AbortController(); updateSend();
  let text = '', stop = null, failed = null;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: st.ctrl.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': st.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: st.model, max_tokens: 16000, stream: true, system: systemPrompt(), messages: apiMessages() })
    });
    if (!res.ok) { let msg = ''; try { msg = (await res.json()).error.message; } catch { /* sin cuerpo */ } throw Object.assign(new Error(apiError(res.status, msg)), { api: true }); }
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const ev = buf.slice(0, i); buf = buf.slice(i + 2);
        const data = ev.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('');
        if (!data) continue;
        let j; try { j = JSON.parse(data); } catch { continue; }
        if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') {
          const follow = nearBottom(); text += j.delta.text; b.innerHTML = md(text); if (follow) toBottom();
        } else if (j.type === 'message_delta' && j.delta) stop = j.delta.stop_reason || stop;
        else if (j.type === 'error') throw Object.assign(new Error(apiError(0, j.error && j.error.message)), { api: true });
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') failed = text ? null : 'Detenido.';
    else failed = e.api ? e.message : 'No pude conectar con api.anthropic.com. Revisá tu conexión (una red corporativa o un bloqueador pueden impedirlo).';
  }
  if (stop === 'refusal') text += (text ? '\n\n' : '') + '_El modelo declinó responder a esto._';
  else if (stop === 'max_tokens') text += '\n\n_(La respuesta se cortó por longitud.)_';
  if (!text && failed) {
    // si el modelo falla, se responde con la base local para no dejar al usuario sin nada
    const local = failed === 'Detenido.' ? null : kbAnswer(userText);
    const md0 = '⚠️ ' + failed + (local && local.md ? '\n\n---\n\n_Respuesta de la base local:_\n\n' + local.md : '');
    b.innerHTML = md(md0); addChips(m, local && local.chips);
    st.hist.push({ r: 'a', t: md0, chips: local && local.chips && local.chips.length ? local.chips : undefined, err: true }); saveState(); return;
  }
  b.innerHTML = md(text || '_(sin respuesta)_');
  st.hist.push({ r: 'a', t: text || '(sin respuesta)' }); saveState();
}

/* ---------- eventos ---------- */
form.addEventListener('submit', e => {
  e.preventDefault();
  if (st.busy) { if (st.ctrl) st.ctrl.abort(); return; }
  const t = input.value; if (!t.trim()) return;
  input.value = ''; autosize(); handle(t);
});
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; updateSend(); }
input.addEventListener('input', autosize);
$('#nuevo').onclick = () => { if (st.ctrl) st.ctrl.abort(); newChat(); };

const dlg = $('#ajustes');
$('#ajustesBtn').onclick = () => { $('#aNombre').value = st.name; $('#aClave').value = st.key; $('#aModelo').value = st.model; dlg.showModal(); };
$('#aCerrar').onclick = () => dlg.close();
$('#aBorrar').onclick = () => { dlg.close(); newChat(); };
$('#ajustesForm').addEventListener('submit', () => {
  st.name = $('#aNombre').value.trim().slice(0, 24) || 'pAnkI';
  st.key = $('#aClave').value.trim();
  st.model = $('#aModelo').value.trim() || DEFAULT_MODEL;
  saveState(); refreshHeader();
});

/* ---------- arranque ---------- */
function restoreChat() {
  chat.textContent = '';
  if (!st.hist.length) { renderEmpty(); return; }
  st.hist.forEach((m, i) => {
    if (m.r === 'u') addUserNode(m.t);
    else { const last = i === st.hist.length - 1; const n = addAINode(m.t, last ? m.chips : null); }
  });
  toBottom();
}
function init() {
  parseKB($('#kb').textContent);
  buildIndex(); initDatos();
  loadState(); refreshHeader(); restoreChat(); updateSend();
  input.focus();
  // para pruebas y para quien quiera inspeccionar la base desde la consola
  window.__panki = { KB, search, analyze, respondLocal, st, IDF, KBID, confidence, entries: () => KB.length };
}
init();
})();
