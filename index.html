<style>
:root{
  --bg:#fbfbfa;--fg:#1d1d1f;--mut:#6e6e73;--line:#e6e6e3;--soft:#f1f1ee;--acc:#3b5bdb;--acc-fg:#fff;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;

button,input,textarea{font:inherit;color:inherit}

.col{width:100%;max-width:720px;margin:0 auto;padding:0 16px}

/* cabecera */
header{flex:none;border-bottom:1px solid var(--line)}
header .col{display:flex;align-items:center;gap:8px;height:52px}
.brand{font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand small{font-weight:400;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ib{width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--mut);display:grid;place-items:center}
.ib:hover{background:var(--soft);color:var(--fg)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* conversación */
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
#chat{padding-top:20px;padding-bottom:24px}
.msg{margin:0 0 22px;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--soft);padding:8px 14px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .body{overflow-wrap:anywhere}

.msg.user .bubble.md .cw{background:var(--bg);margin:.3em 0}

.body>:first-child{margin-top:0}.body>:last-child{margin-bottom:0}

.body li{margin:.2em 0}

.body .cw{margin:.7em 0;border:1px solid var(--line);border-radius:10px;background:var(--code);overflow:hidden}

.cw .ch button:hover{background:var(--soft);color:var(--fg)}
.cw pre{margin:0;padding:12px 14px;overflow-x:auto}
.cw pre code{background:none;padding:0;font-size:13px;line-height:1.55;white-space:pre}
.cw .out{margin:0;padding:10px 14px;border-top:1px dashed var(--line);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;color:var(--fg);max-height:240px;overflow:auto}

.t-k{color:var(--k)}.t-s{color:var(--s)}.t-c{color:var(--c);font-style:italic}.t-n{color:var(--n)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

dialog input:focus{outline:0;border-color:var(--acc)}
dialog .note{font-size:12.5px;color:var(--mut);margin:0}
dialog .row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:4px}
.btn{border:1px solid var(--line);background:none;border-radius:9px;padding:7px 14px;font-size:14px}

=== hola-mundo | Hola mundo | hola mundo; hello world; primer programa; mi primer programa; programa basico; imprimir en pantalla; mostrar texto en pantalla; print; console log; println; printf; echo | general
El primer programa clásico: mostrar un texto en pantalla.

```python

```
```js
console.log("Hola, mundo");
```
```java

        System.out.println("Hola, mundo");
    }
}
```

#include <stdio.h>

    printf("Hola, mundo\n");
    return 0;
}
```

#include <iostream>

    std::cout << "Hola, mundo" << std::endl;
}
```

```
```go
package main

```

fn main() { println!("Hola, mundo"); }
```
```php
<?php echo "Hola, mundo\n";
```

```
--- más
- Python y JavaScript son interpretados: guardás el archivo y lo ejecutás (`python3 hola.py`, `node hola.js`).
- Java, C, C++, Go y Rust se **compilan** antes (`javac`, `gcc`, `g++`, `go build`, `rustc`/`cargo run`).
- En el navegador, `console.log` escribe en la consola de las herramientas de desarrollo (F12).

=== variables | Variables y constantes | variable; variables; constante; constantes; declarar variable; asignar valor; let; const; var; cómo declarar una variable; definir variable | general
Una **variable** es un nombre que apunta a un valor guardado en memoria. Una **constante** es una variable que no debería cambiar.

```python
edad = 30            # sin declarar tipo
PI = 3.14159         # por convención, MAYÚSCULAS = constante
nombre, ciudad = "Ana", "Salta"
```
```js
let edad = 30;       // reasignable, alcance de bloque
const PI = 3.14159;  // no se puede reasignar
var viejo = 1;       // evitalo: alcance de función y hoisting raro
```
```java
int edad = 30;
final double PI = 3.14159;   // final = constante
var nombre = "Ana";          // inferencia de tipo (Java 10+)
```
```c
int edad = 30;
const double PI = 3.14159;
```
```go
var edad int = 30
nombre := "Ana"        // := declara e infiere el tipo (solo dentro de funciones)
const PI = 3.14159
```
```rust
let edad = 30;          // inmutable por defecto
let mut contador = 0;   // mutable
const MAX: u32 = 100;
```
```cs
int edad = 30;
const double PI = 3.14159;
var nombre = "Ana";
```
--- más
- Los nombres distinguen mayúsculas de minúsculas (`edad` ≠ `Edad`).
- Convenciones: `snake_case` en Python/Rust/C, `camelCase` en JS/Java/C#/Go (privado), `PascalCase` para clases y tipos.
- Una variable usada sin haber sido definida produce `NameError` (Python) o `ReferenceError` (JS).
- Elegí nombres que expliquen el contenido: `precioFinal` mejor que `x`.

=== tipos-datos | Tipos de datos | tipo de dato; tipos de datos; tipos primitivos; int; float; string; boolean; entero; decimal; carácter; tipos básicos; typeof; type | general
Los tipos de datos definen qué valores puede guardar una variable y qué operaciones admite.

| Tipo | Ejemplo | Para qué |
|---|---|---|
| Entero | `42` | contar, índices |
| Decimal (float) | `3.14` | medidas, promedios |
| Texto (string) | `"hola"` | nombres, mensajes |
| Booleano | `true` / `false` | decisiones |
| Nulo | `null` / `None` | "sin valor" |
| Lista / array | `[1, 2, 3]` | secuencia ordenada |
| Diccionario / objeto | `{"a": 1}` | pares clave-valor |

```python
type(42)        # <class 'int'>
type(3.14)      # <class 'float'>
type("hola")    # <class 'str'>
int("42"), float("3.5"), str(10), bool(0)   # conversiones
```
```js
typeof 42;        // "number"
typeof "hola";    // "string"
typeof null;      // "object" (bug histórico del lenguaje)
Number("42"); String(10); Boolean(0);
```
--- más
- **Tipado dinámico** (Python, JS, Ruby, PHP): el tipo vive en el valor y la variable puede cambiarlo. **Tipado estático** (Java, C, Go, Rust, C#, TypeScript): el tipo se fija al declarar y el compilador lo verifica.
- Los enteros de C/Java tienen límite (p. ej. `int` de 32 bits llega a 2 147 483 647); Python tiene enteros de tamaño ilimitado.
- Los decimales binarios no son exactos: `0.1 + 0.2` da `0.30000000000000004`. Para dinero usá enteros (centavos) o tipos decimales (`Decimal` en Python, `BigDecimal` en Java).

=== cadenas | Cadenas de texto (strings) | string; strings; cadena; cadenas; texto; concatenar; unir strings; longitud de un string; mayúsculas; minúsculas; dividir cadena; split; reemplazar texto; replace; contiene; substring; subcadena; trim; formatear texto; interpolación; template string; f-string | general
Las cadenas representan texto. Operaciones comunes:

```python
s = "  Hola Mundo  "
len(s)                    # longitud
s.strip()                 # quita espacios de los bordes
s.lower(); s.upper()      # minúsculas / mayúsculas
s.replace("Mundo", "Py")  # reemplazar
"a,b,c".split(",")        # ['a', 'b', 'c']
",".join(["a", "b"])      # 'a,b'
"Hola" in s               # contiene
nombre = "Ana"
f"Hola {nombre}, tenés {2+3} años"   # f-string
s[2:6]                    # subcadena (rebanado)
```
```js
const s = "  Hola Mundo  ";
s.length;
s.trim();
s.toLowerCase(); s.toUpperCase();
s.replace("Mundo", "JS");        // solo la primera; replaceAll para todas
"a,b,c".split(",");
["a", "b"].join(",");
s.includes("Hola");
const nombre = "Ana";
`Hola ${nombre}, tenés ${2 + 3} años`;   // template string
s.slice(2, 6);
```
```java
String s = "  Hola Mundo  ";
s.length();
s.trim();                 // o strip()
s.toLowerCase();
s.replace("Mundo", "Java");
"a,b,c".split(",");
String.join(",", "a", "b");
s.contains("Hola");
String.format("Hola %s, tenés %d años", "Ana", 5);
s.substring(2, 6);
```
```go
s := "  Hola Mundo  "
len(s)
strings.TrimSpace(s)
strings.ToLower(s)
strings.ReplaceAll(s, "Mundo", "Go")
strings.Split("a,b,c", ",")
strings.Join([]string{"a", "b"}, ",")
strings.Contains(s, "Hola")
fmt.Sprintf("Hola %s, tenés %d años", "Ana", 5)
```
--- más
- En la mayoría de los lenguajes las cadenas son **inmutables**: los métodos devuelven una cadena nueva, no modifican la original.
- Para comparar texto ignorando mayúsculas: `a.lower() == b.lower()` (Python), `a.toLowerCase() === b.toLowerCase()` (JS).
- Concatenar muchas cadenas dentro de un bucle es lento en algunos lenguajes: usá `join` (Python/JS), `StringBuilder` (Java/C#).
- Unicode: una "letra" puede ocupar varios bytes; en C `strlen` cuenta bytes, no caracteres.

=== condicionales | Condicionales (if / else) | if; else; elif; else if; condicional; condicionales; decisión; si entonces; ifelse; switch; match; operador ternario; ternario; bifurcación | general
Ejecutan código solo si se cumple una condición.

```python
nota = 7
if nota >= 9:
    print("Sobresaliente")
elif nota >= 6:
    print("Aprobado")
else:
    print("Reprobado")

estado = "ok" if nota >= 6 else "mal"      # ternario
```
```js
const nota = 7;
if (nota >= 9) {
  console.log("Sobresaliente");
} else if (nota >= 6) {
  console.log("Aprobado");
} else {
  console.log("Reprobado");
}
const estado = nota >= 6 ? "ok" : "mal";   // ternario

switch (nota) {
  case 10: console.log("Perfecto"); break;
  default: console.log("Otra");
}
```
```java
int nota = 7;
if (nota >= 9) {
    System.out.println("Sobresaliente");
} else if (nota >= 6) {
    System.out.println("Aprobado");
} else {
    System.out.println("Reprobado");
}
String estado = nota >= 6 ? "ok" : "mal";
```
```c
int nota = 7;
if (nota >= 9) printf("Sobresaliente\n");
else if (nota >= 6) printf("Aprobado\n");
else printf("Reprobado\n");
```
```go
nota := 7
if nota >= 9 {
    fmt.Println("Sobresaliente")

    fmt.Println("Aprobado")
} else {
    fmt.Println("Reprobado")

```

--- más
- Operadores de comparación: `==`, `!=`, `<`, `>`, `<=`, `>=`. Lógicos: `and/or/not` (Python), `&& || !` (el resto).
- Error clásico: usar `=` (asignación) en lugar de `==` (comparación) dentro de un `if`.
- En JS preferí `===` (compara valor **y** tipo) sobre `==`.
- Valores "falsy": en Python `0, "", [], {}, None`; en JS `0, "", null, undefined, NaN, false`.

=== bucle-for | Bucle for | for; bucle for; ciclo for; for loop; recorrer; recorrer lista; iterar; foreach; repetir n veces; for in range; range; for i; contador; iterar sobre una lista | general
El `for` repite un bloque un número conocido de veces o recorre los elementos de una colección.

```python
for i in range(5):            # 0,1,2,3,4
    print(i)

frutas = ["manzana", "pera"]
for fruta in frutas:          # recorrer elementos
    print(fruta)

for i, fruta in enumerate(frutas):   # índice + elemento
    print(i, fruta)
```
```js
for (let i = 0; i < 5; i++) {
  console.log(i);
}
const frutas = ["manzana", "pera"];
for (const fruta of frutas) console.log(fruta);   // elementos
frutas.forEach((fruta, i) => console.log(i, fruta));
for (const clave in { a: 1, b: 2 }) console.log(clave);   // claves de un objeto
```
```java
for (int i = 0; i < 5; i++) {
    System.out.println(i);

Los cuatro pilares de la POO:
1. **Encapsulamiento**: ocultar los datos internos y exponer solo lo necesario (atributos privados + métodos).
2. **Herencia**: una clase hereda atributos y métodos de otra.
3. **Polimorfismo**: objetos distintos responden al mismo mensaje a su manera.
4. **Abstracción**: mostrar solo lo esencial y esconder los detalles.

Consejos: preferí **composición sobre herencia** (un objeto *tiene* otro en vez de *ser* otro) cuando la herencia no sea claramente "es un".

=== herencia | Herencia y polimorfismo | herencia; heredar; extends; superclase; subclase; clase hija; clase padre; super; polimorfismo; sobrescribir; override; clase abstracta; interfaz; interface; abstract | general
La **herencia** permite que una clase hija reutilice y especialice a una clase padre. El **polimorfismo** deja usar objetos distintos a través de la misma interfaz.

```python
class Animal:
    def __init__(self, nombre):
        self.nombre = nombre
    def hablar(self):
        raise NotImplementedError

class Perro(Animal):                 # hereda de Animal
    def hablar(self):                # sobrescribe
        return f"{self.nombre}: guau"

class Gato(Animal):
    def hablar(self):
        return f"{self.nombre}: miau"

for a in [Perro("Rex"), Gato("Tom")]:
    print(a.hablar())                # polimorfismo
```

}

raise ValueError("dato inválido")  # lanzar una excepción propia
```

=== recursion | Recursión | recursión; recursividad; función recursiva; caso base; factorial; fibonacci; llamarse a sí misma; stack overflow recursion; recursivo | general
Una función es **recursiva** si se llama a sí misma. Necesita un **caso base** (cuándo parar) y un **paso recursivo** que se acerque al caso base.

```python
def factorial(n):
    if n <= 1:                 # caso base
        return 1
    return n * factorial(n - 1)   # paso recursivo

def fib(n, memo={}):           # Fibonacci con memoización
    if n < 2:
        return n
    if n not in memo:

```python
def contar(hasta):
    n = 0
    while n < hasta:
        yield n          # pausa y entrega un valor
        n += 1

for x in contar(3):

g = contar(2)
next(g)    # 0
next(g)    # 1   (el siguiente lanzaría StopIteration)

  setTimeout(() => Math.random() > 0.5 ? resolve("ok") : reject(new Error("falló")), 500);

 .catch((err) => console.error(err.message))

=== concurrencia | Concurrencia, hilos y paralelismo | concurrencia; paralelismo; hilo; hilos; thread; threads; proceso; procesos; multithreading; race condition; condición de carrera; deadlock; mutex; lock; semáforo; gil; thread safe; sincronización | general
- **Concurrencia**: varias tareas *progresan* a la vez (aunque sea alternándose en un núcleo).
- **Paralelismo**: varias tareas *se ejecutan* literalmente a la vez (varios núcleos).
- **Hilo (thread)**: línea de ejecución dentro de un proceso, comparte memoria con los demás. **Proceso**: programa con memoria propia.

```python
from concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor
import threading

with ThreadPoolExecutor(max_workers=4) as pool:      # ideal para tareas de E/S (red, disco)
    resultados = list(pool.map(descargar, urls))

lock = threading.Lock()
with lock:                  # sección crítica protegida
    contador += 1
```

// Goroutines y canales

ch := make(chan int)
go func() { ch <- 42 }()
fmt.Println(<-ch)
```
```java
ExecutorService pool = Executors.newFixedThreadPool(4);
Future<Integer> f = pool.submit(() -> 21 * 2);
System.out.println(f.get());
pool.shutdown();
```
--- más
Problemas típicos:
- **Condición de carrera**: dos hilos modifican el mismo dato a la vez y el resultado depende del orden. Se evita con *locks*, variables atómicas o no compartiendo estado.
- **Deadlock**: dos hilos esperan para siempre el recurso del otro. Se evita tomando los locks siempre en el mismo orden.
- **Python y el GIL**: en CPython solo un hilo ejecuta bytecode a la vez, así que los hilos no aceleran cálculo pesado; para eso usá `multiprocessing`/`ProcessPoolExecutor`. Sí sirven para tareas de E/S.
- **Node.js**: un hilo + event loop; para CPU pesada, `worker_threads`.

=== memoria | Memoria: stack, heap y recolector de basura | malloc y free; reservar memoria dinámica; memoria dinámica; memoria; stack; pila; heap; montículo; garbage collector; recolector de basura; gc; memory leak; fuga de memoria; malloc; free; liberar memoria; asignación de memoria; stack overflow | general
- **Stack (pila)**: memoria rápida y automática para variables locales y llamadas a funciones. Tamaño limitado.
- **Heap (montículo)**: memoria grande y flexible para datos que viven más tiempo (objetos, listas). Hay que liberarla.

Cómo se libera, según el lenguaje:
- **C**: a mano (`malloc` / `free`). Olvidar `free` = *memory leak*; usar memoria liberada = *use-after-free*.
- **C++**: RAII y *smart pointers* (`unique_ptr`, `shared_ptr`).
- **Java, C#, Python, JS, Go**: **garbage collector** que libera lo que ya nadie usa.
- **Rust**: *ownership*; el compilador decide cuándo liberar, sin GC.

```c
int *p = malloc(10 * sizeof(int));
if (p == NULL) return 1;
p[0] = 5;
free(p);
p = NULL;           // evita usar un puntero colgante
```
--- más
- Fuga de memoria en lenguajes con GC: referencias que nunca se sueltan (cachés que crecen, *listeners* sin quitar, variables globales).
- *Stack overflow* (el error) = agotar el stack, normalmente por recursión infinita.
- Herramientas: `valgrind` y `-fsanitize=address` (C/C++), pestaña *Memory* de Chrome DevTools (JS), `tracemalloc` (Python).

Un **puntero** guarda la *dirección de memoria* de otro dato. Una **referencia** es un alias seguro del mismo dato.

```c
int x = 10;
int *p = &x;        // p guarda la dirección de x
*p = 20;            // *p accede al valor: ahora x vale 20
printf("%d %p\n", x, (void*)p);

void duplicar(int *n) { *n *= 2; }   // modifica el original
duplicar(&x);
```
```cpp
int x = 10;
int& r = x;         // r es otro nombre para x
r = 20;             // x vale 20
```
```python
a = [1, 2]
b = a               # b y a apuntan a la MISMA lista
b.append(3)
print(a)            # [1, 2, 3]
c = a.copy()        # copia independiente
```
--- más
- **Por valor**: la función recibe una copia (cambios no afectan al original). **Por referencia**: recibe el original.
- Python y JS pasan "referencias a objetos": si la función **modifica** una lista, el cambio se ve afuera; si **reasigna** la variable, no.
- Los tipos simples (números, booleanos) en Python/JS se comportan como valores.
- En C: `*` dos usos (declarar puntero / desreferenciar) y `&` (obtener dirección). Un puntero sin inicializar o nulo desreferenciado causa *Segmentation fault*.

=== mutabilidad | Mutabilidad e inmutabilidad | mutable; inmutable; mutabilidad; inmutabilidad; immutable; tupla; tuple; frozen; object.freeze; const no es inmutable; copia superficial; copia profunda; shallow copy; deep copy; deepcopy; structuredClone | general
Un objeto **mutable** puede cambiar después de creado; uno **inmutable** no (para "cambiarlo" se crea otro).

| Lenguaje | Inmutables | Mutables |
|---|---|---|
| Python | `int, float, str, tuple, frozenset, bool` | `list, dict, set` |
| JS | primitivos (`number`, `string`, …) | objetos, arrays |
| Java | `String`, wrappers | `ArrayList`, `StringBuilder` |

```python
import copy
a = [[1, 2], [3]]
b = a.copy()            # copia superficial: las listas internas se comparten
c = copy.deepcopy(a)    # copia profunda: todo independiente
b[0].append(99)         # también cambia a[0]
```
```js
const original = { a: 1, anidado: { b: 2 } };
const superficial = { ...original };        // copia superficial
const profunda = structuredClone(original); // copia profunda
Object.freeze(original);                    // no deja modificar (superficial)
```
--- más
- `const` en JS impide **reasignar** la variable, no modificar el objeto al que apunta.
- Ventajas de lo inmutable: menos bugs, seguro entre hilos, claves de diccionario válidas.

=== tipado | Tipado estático vs dinámico | tipado estático; tipado dinámico; tipado fuerte; tipado débil; typing; tipos; inferencia de tipos; type hints; duck typing; typescript tipos; tipado gradual | general
- **Estático**: los tipos se verifican *antes* de ejecutar (Java, C, C++, C#, Go, Rust, TypeScript). Detecta errores pronto y ayuda al autocompletado.
- **Dinámico**: los tipos se comprueban al ejecutar (Python, JavaScript, Ruby, PHP). Más flexible, errores en tiempo de ejecución.
- **Fuerte**: no mezcla tipos sin conversión explícita (Python: `"1" + 1` es error). **Débil**: convierte solo (JS: `"1" + 1` es `"11"`).

```python

    return ("Hola " + nombre + ". ") * veces
```
```ts
// TypeScript: JavaScript + tipos que se comprueban al compilar
function saludar(nombre: string, veces: number = 1): string {
  return `Hola ${nombre}. `.repeat(veces);
}
```
--- más
- *Duck typing*: "si camina como un pato y hace cuac, es un pato": en Python importa qué métodos tiene el objeto, no su clase.

=== compilado-interpretado | Lenguajes compilados vs interpretados | compilado; interpretado; compilador; intérprete; interprete; compilar; bytecode; máquina virtual; jvm; jit; transpilar; transpilador; compiled; interpreted; ensamblador; código máquina | general
- **Compilador**: traduce todo el programa a código máquina *antes* de ejecutarlo (C, C++, Rust, Go). Resultado: ejecutable rápido.
- **Intérprete**: lee y ejecuta el código línea a línea (Python, Ruby, PHP, JS clásico). Más fácil de probar, más lento.
- **Híbridos**: compilan a **bytecode** que corre en una máquina virtual (Java → JVM, C# → .NET, Python → `.pyc`); muchos usan **JIT** (compilación en tiempo de ejecución) para acelerar (V8 de Chrome).
- **Transpilador**: convierte un lenguaje en otro de nivel parecido (TypeScript → JavaScript).

```bash
gcc programa.c -o programa && ./programa     # C
javac Main.java && java Main                 # Java
python3 script.py                            # Python
node app.js                                  # JavaScript
cargo run                                    # Rust
```
--- más
- Que un lenguaje sea compilado o interpretado es propiedad de la **implementación**, no del lenguaje: existe un intérprete de C y compiladores de Python (Cython, Nuitka).

=== mate-porcentajes | Porcentajes, fracciones y regla de tres | porcentaje; porcentajes; calcular porcentaje; regla de tres; regla de tres simple; fracción; fracciones; sumar fracciones; descuento; aumento porcentual; iva; variación porcentual; proporción; proporcionalidad; qué porcentaje es; cómo sacar el porcentaje | general
**Porcentaje**: una parte de cada 100.
- `x % de N` = `N × x / 100` → el 15 % de 200 = 200 × 15 / 100 = **30**.
- Qué porcentaje es A de B: `A / B × 100` → 30 de 200 = **15 %**.
- **Descuento**: precio × (1 − d/100). Un 20 % de descuento sobre 500 → 500 × 0,80 = **400**.
- **Aumento**: precio × (1 + a/100). IVA 21 %: 100 × 1,21 = **121**; para quitarlo: 121 / 1,21 = 100.
- **Variación porcentual** = (nuevo − viejo) / viejo × 100. De 80 a 100: (100−80)/80 = **+25 %**.
- Ojo: subir 50 % y luego bajar 50 % **no** vuelve al valor original (100 → 150 → 75).

**Regla de tres simple** (magnitudes directamente proporcionales): si 3 kg cuestan $900, ¿cuánto cuestan 5 kg? → 5 × 900 / 3 = **$1500**. Si es *inversa* (más obreros, menos días): se multiplica directamente y se divide por el otro dato.

**Fracciones**
- Sumar: igualar denominadores. 1/2 + 1/3 = 3/6 + 2/6 = **5/6**.
- Multiplicar: numeradores × numeradores, denominadores × denominadores. 2/3 × 3/4 = 6/12 = **1/2**.
- Dividir: multiplicar por la inversa. 1/2 ÷ 3/4 = 1/2 × 4/3 = **2/3**.
- Simplificar: dividir arriba y abajo por el MCD. A decimal: numerador ÷ denominador.
--- más
Podés pedirme cálculos directos: «15% de 200», «raíz de 144», «2^10», «factorial de 6».

**Ecuación de 1.er grado**: `ax + b = 0` → `x = −b / a`. Ej.: 3x − 6 = 0 → x = 2. Se despeja haciendo la misma operación a ambos lados.

**Ecuación de 2.º grado** `ax² + bx + c = 0` — fórmula resolvente (Bhaskara):

`x = (−b ± √(b² − 4ac)) / (2a)`

El **discriminante** Δ = b² − 4ac: si Δ > 0, dos soluciones reales; Δ = 0, una doble; Δ < 0, ninguna real.
Ej.: x² − 5x + 6 = 0 → Δ = 25 − 24 = 1 → x = (5 ± 1)/2 → **x = 3** o **x = 2**.

**Productos notables**
- (a + b)² = a² + 2ab + b²   · (a − b)² = a² − 2ab + b²
- (a + b)(a − b) = a² − b² (diferencia de cuadrados)
- (a + b)³ = a³ + 3a²b + 3ab² + b³

**Sistema 2×2**: x + y = 5 y x − y = 1 → sumando: 2x = 6 → x = 3, y = 2. Métodos: sustitución, igualación, reducción (suma/resta), gráfico.

=== mate-estadistica | Estadística: media, mediana, moda y desviación estándar | estadística; media; promedio; mediana; moda; desviación estándar; varianza; rango; percentil; cuartil; distribución normal; campana de gauss; correlación; muestra y población; cómo calcular el promedio; media aritmética; dispersión | general
Dado el conjunto `[2, 3, 3, 5, 7]`:
- **Media (promedio)** = suma / cantidad = 20 / 5 = **4**. Sensible a valores extremos.
- **Mediana** = valor central ordenado = **3** (si hay cantidad par, el promedio de los dos centrales). Resistente a extremos: por eso se usa para ingresos.
- **Moda** = el valor que más se repite = **3**.
- **Rango** = máximo − mínimo = 5.
- **Varianza** = promedio de (valor − media)²; **desviación estándar** σ = √varianza: mide qué tan dispersos están los datos. En muestras se divide por *n − 1*.

**Distribución normal** (campana): ~68 % de los datos a ±1σ de la media, ~95 % a ±2σ, ~99,7 % a ±3σ.
**Correlación** (r entre −1 y 1): mide relación lineal; **correlación no implica causalidad**.

**Probabilidad** (regla de Laplace, casos igualmente probables): P(A) = casos favorables / casos posibles. Dado: P(sacar par) = 3/6 = **0,5**.
- Evento contrario: P(no A) = 1 − P(A).
- **Independientes**: P(A y B) = P(A)·P(B). Dos caras seguidas con moneda: 1/2 · 1/2 = **1/4**.
- **O** (excluyentes): P(A o B) = P(A) + P(B); en general suma − P(A y B).
- **Condicional**: P(A|B) = P(A y B) / P(B). **Bayes**: P(A|B) = P(B|A)·P(A) / P(B).
- La "falacia del apostador": los lanzamientos de moneda no tienen memoria.

**Combinatoria**
- **Factorial**: n! = n·(n−1)·…·1; 5! = 120; 0! = 1.
- **Permutaciones** (importa el orden, usando todos): n! → ordenar 4 personas en fila: 24.
- **Variaciones** (importa el orden, elegís k de n): n!/(n−k)! → podio de 3 entre 10: 720.
- **Combinaciones** (no importa el orden): C(n,k) = n! / (k!(n−k)!) → elegir 3 de 10: **120**. Lotería de 6 de 45: C(45,6) = 8 145 060.

```python
import math
math.factorial(5), math.comb(10, 3), math.perm(10, 3)    # 120, 120, 720
```

| 5 | termina en 0 o 5 |

1. **Ley de inercia**: un cuerpo permanece en reposo o en movimiento rectilíneo uniforme mientras la fuerza neta sobre él sea cero.
2. **Ley fundamental**: **F = m · a**. La aceleración es proporcional a la fuerza neta e inversa a la masa. Unidad de fuerza: newton (1 N = 1 kg·m/s²).
3. **Acción y reacción**: si A ejerce una fuerza sobre B, B ejerce sobre A otra igual y de sentido contrario (actúan sobre cuerpos **distintos**).

- **Peso** = m · g (fuerza). En la Tierra g ≈ 9,8 m/s²; una masa de 10 kg pesa ≈ 98 N. **Masa** es cantidad de materia (kg) y no cambia; el peso sí (en la Luna g ≈ 1,6 m/s²).
- **Rozamiento**: f = μ · N (μ = coeficiente, N = fuerza normal).
- **Gravitación universal**: F = G · m₁ · m₂ / r², con G ≈ 6,674 × 10⁻¹¹ N·m²/kg².
Ej.: un objeto de 2 kg con una fuerza neta de 10 N → a = 10/2 = **5 m/s²**.

- **MRU** (velocidad constante): `x = x₀ + v·t`. A 60 km/h, en 2,5 h recorrés 150 km.
- **MRUA** (aceleración constante):
  - `v = v₀ + a·t`
  - `x = x₀ + v₀·t + ½·a·t²`
  - `v² = v₀² + 2·a·Δx`
- **Caída libre**: MRUA con a = g ≈ 9,8 m/s² hacia abajo. Dejado caer desde reposo: `t = √(2h/g)`, `v = g·t`. Desde 20 m tarda ≈ 2,0 s y llega a ≈ 20 m/s (sin aire).
- **Tiro oblicuo**: horizontal con MRU (`x = v₀ cosθ · t`) y vertical con MRUA (`y = v₀ senθ · t − ½gt²`). El alcance máximo es con 45° (sin rozamiento): `R = v₀² sen(2θ)/g`.
- **Velocidad media** = desplazamiento / tiempo. Rapidez = distancia / tiempo.
- **Movimiento circular uniforme**: `v = ω·r`, aceleración centrípeta `a = v²/r`.

- **Conservación**: la energía no se crea ni se destruye, solo se transforma. Sin rozamiento, Ec + Ep = constante. Un objeto de 1 kg que cae 5 m llega con v = √(2·g·h) ≈ 9,9 m/s.
- **Energía eléctrica**: `E = P · t`. 1 kWh = una potencia de 1000 W durante 1 hora = 3,6 MJ. Un aparato de 100 W encendido 10 h consume 1 kWh.
- **Rendimiento** = energía útil / energía total (siempre < 100 %).

- **Paralelo**: el voltaje es el mismo; `1/R_total = 1/R₁ + 1/R₂ + …`; las corrientes se suman. Dos de 10 Ω en paralelo → 5 Ω.
- **Corriente continua (CC/DC)**: pilas y baterías, sentido fijo. **Alterna (CA/AC)**: la de la red (en Argentina 220 V / 50 Hz; en EE. UU. 120 V / 60 Hz).

- **Espectro electromagnético** (de menor a mayor frecuencia): ondas de radio → microondas → infrarrojo → **luz visible** → ultravioleta → rayos X → rayos gamma. La luz visible va de ~380 nm (violeta) a ~750 nm (rojo).
- **Colores del arcoíris**: rojo, naranja, amarillo, verde, azul, índigo (añil) y violeta, por la dispersión de la luz en gotas de agua.
- **Reflexión** (rebota; ángulo de incidencia = ángulo de reflexión), **refracción** (cambia de dirección al pasar de un medio a otro; lentes, lupa, cuchara "quebrada" en el agua).
- **Sonido**: onda mecánica; necesita un medio (no se propaga en el vacío). ≈ **343 m/s** en aire a 20 °C (≈ 1235 km/h); más rápido en agua (~1500 m/s) y acero. Audible: ~20 Hz a 20 kHz. **Eco**: reflexión del sonido (mínimo ~17 m de distancia para percibirlo). **Decibeles**: escala logarítmica; +10 dB ≈ 10 veces la intensidad.
- **Efecto Doppler**: el tono sube cuando la fuente se acerca y baja cuando se aleja (sirena de ambulancia).

Se ve un rayo antes de oírse el trueno porque la luz es mucho más rápida: cada 3 s de diferencia ≈ 1 km de distancia.

- **Temperatura**: medida de la energía cinética media de las partículas. **Calor**: energía que se transfiere entre cuerpos por una diferencia de temperatura.
- Escalas: **Celsius** (agua se congela a 0 °C, hierve a 100 °C a nivel del mar), **Kelvin** (K = °C + 273,15; el **cero absoluto** es 0 K = −273,15 °C), **Fahrenheit** (°F = °C·9/5 + 32; 32 °F congela, 212 °F hierve).
- **Transferencia de calor**: conducción (por contacto, metales), convección (movimiento de fluidos) y radiación (ondas, como el Sol).
- **Calor sensible**: `Q = m · c · ΔT`; el calor específico del agua es c = 4,18 J/(g·°C).
- **Leyes de la termodinámica**: 
  - *Cero*: si A y B están en equilibrio térmico con C, lo están entre sí.
  - *Primera*: la energía se conserva (ΔU = Q − W).
  - *Segunda*: el calor fluye espontáneamente de lo caliente a lo frío; la **entropía** (desorden) de un sistema aislado nunca disminuye. No existe una máquina 100 % eficiente.
  - *Tercera*: no se puede alcanzar el cero absoluto.
- Cambios de estado: fusión, solidificación, vaporización/ebullición, condensación, sublimación.

Por qué el agua hierve a menor temperatura en la montaña: la presión atmosférica es menor.

**Relatividad (Einstein)**
- **Especial (1905)**: las leyes de la física son iguales en todos los sistemas inerciales y la velocidad de la luz *c* es la misma para todos los observadores. Consecuencias: dilatación del tiempo, contracción de longitudes y **E = mc²** (masa y energía son equivalentes).
- **General (1915)**: la gravedad es la curvatura del espacio-tiempo causada por la masa y la energía. Predice la desviación de la luz, las ondas gravitacionales (detectadas en 2015) y los **agujeros negros** (regiones de las que ni la luz escapa más allá del horizonte de sucesos). Corrige el reloj de los satélites GPS.

**Mecánica cuántica** (escala atómica)
- La energía está **cuantizada** (Planck): la luz viene en paquetes, los **fotones**, de energía E = h·f.
- **Dualidad onda-partícula**: luz y materia se comportan como ondas o partículas según cómo se las observe.
- **Principio de incertidumbre (Heisenberg)**: no se puede conocer a la vez con precisión arbitraria posición y momento de una partícula.
- Los sistemas se describen con una **función de onda** que da probabilidades; el **entrelazamiento** correlaciona partículas a distancia (sin permitir enviar información más rápido que la luz).
- Base de transistores, láseres, resonancia magnética y computadoras cuánticas.
- **Modelo Estándar**: describe las partículas fundamentales (quarks, leptones, bosones; el **bosón de Higgs** se confirmó en 2012). No incluye la gravedad: unir relatividad general y cuántica sigue sin resolverse.
--- más
Gato de Schrödinger: experimento mental para ilustrar la superposición; no es un animal real en dos estados, sino una crítica a la interpretación.

- **Ley de conservación de la masa (Lavoisier)**: en una reacción, la masa total no cambia → las ecuaciones deben estar **balanceadas** (mismo número de átomos de cada elemento a ambos lados).
  - 2 H₂ + O₂ → 2 H₂O  ·  CH₄ + 2 O₂ → CO₂ + 2 H₂O  ·  N₂ + 3 H₂ → 2 NH₃
- **Mol**: cantidad de sustancia con **6,022 × 10²³** entidades (número de Avogadro). **Masa molar**: masa de 1 mol en gramos (H₂O = 2·1 + 16 = 18 g/mol). Moles = masa / masa molar.
- A condiciones normales (CNPT), 1 mol de gas ideal ocupa ≈ 22,4 L. Gas ideal: `PV = nRT`.
- **Tipos**: síntesis (A+B→AB), descomposición, desplazamiento, doble desplazamiento, **combustión** (con O₂, libera energía), **redox** (transferencia de electrones: el que *pierde* electrones se oxida, el que gana se reduce).
- **Exotérmica** libera calor (combustión); **endotérmica** lo absorbe (fotosíntesis).
- **Catalizador**: acelera la reacción sin consumirse (enzimas en el cuerpo).
- **Reactivo limitante**: el que se agota primero y determina cuánto producto se obtiene.
Ej.: ¿Cuántos gramos de agua se forman con 4 g de H₂? 2 H₂ + O₂ → 2 H₂O: 4 g = 2 mol de H₂ → 2 mol de H₂O = **36 g**.

=== bio-evolucion | Evolución y selección natural | evolución; selección natural; darwin; charles darwin; origen de las especies; adaptación; especiación; fósiles; ancestro común; lamarck; evolución humana; homo sapiens; neandertal; extinción; deriva genética; árbol de la vida; evidencias de la evolución | general
La **evolución** es el cambio de las características hereditarias de las poblaciones a lo largo de generaciones. **Charles Darwin** y Alfred Russel Wallace propusieron la **selección natural** (*El origen de las especies*, 1859):
1. Hay **variación** entre los individuos.
2. Parte de esa variación es **hereditaria**.
3. Nacen más individuos de los que pueden sobrevivir (competencia por recursos).
4. Los que tienen rasgos más ventajosos en su ambiente dejan **más descendientes** → esos rasgos se vuelven más comunes.
- No es un proceso dirigido a un fin ni de "mejora" absoluta: es adaptación al ambiente actual. Otros mecanismos: **deriva genética**, flujo génico, mutación.
- **Evidencias**: registro fósil, anatomía comparada (estructuras homólogas, ej. el brazo humano y el ala del murciélago), embriología, genética molecular y observación directa (resistencia de bacterias a antibióticos).
- **Especiación**: cuando poblaciones aisladas divergen hasta no poder reproducirse entre sí.
- **Humanos**: el género *Homo* surgió en África; *Homo sapiens* apareció hace unos 300 000 años. Neandertales y humanos modernos convivieron y se cruzaron. Compartimos un ancestro común con los chimpancés de hace ~6–7 millones de años (no "venimos del mono").
--- más
"Teoría" en ciencia significa explicación bien sustentada con evidencia, no una "suposición". Lamarck proponía que los caracteres adquiridos se heredan; esa idea fue refutada.

**Fotosíntesis** (plantas, algas, algunas bacterias; en los cloroplastos, con **clorofila**):

`6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ (glucosa) + 6 O₂`

Convierte energía luminosa en energía química y libera el oxígeno que respiramos. Fase luminosa (tilacoides: produce ATP y NADPH, libera O₂ del agua) y fase oscura/ciclo de Calvin (estroma: fija CO₂ y fabrica glucosa).

**Respiración celular** (en las mitocondrias): `C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energía (ATP)`. Es lo inverso, y la hacen casi todos los seres vivos. Sin oxígeno, algunos organismos hacen **fermentación** (láctica en músculos; alcohólica en levaduras: pan, cerveza, vino).

- **Autótrofos** (productores) fabrican su alimento; **heterótrofos** (consumidores) se alimentan de otros; **descomponedores** (hongos, bacterias) reciclan materia.
- Cadena trófica: productor → consumidor primario (herbívoro) → secundario (carnívoro) → … → descomponedores. Solo ≈ 10 % de la energía pasa de un nivel al siguiente.

Las plantas también respiran (de día y de noche), pero de día producen más oxígeno por fotosíntesis del que consumen. El fitoplancton marino aporta cerca de la mitad del oxígeno del planeta.

- **Bacterias**: seres vivos unicelulares procariotas. Muchas son útiles (flora intestinal, yogur) y algunas causan enfermedades (tuberculosis, cólera). Se tratan con **antibióticos**.
- **Virus**: partículas mucho más pequeñas, formadas por material genético (ADN o ARN) dentro de una cápside; **necesitan una célula huésped para replicarse**. Los antibióticos **no funcionan** contra virus (gripe, resfrío, COVID-19, sarampión); se previenen con vacunas y algunos se tratan con antivirales.
- **Hongos** y **parásitos** (protozoos, gusanos) son otros agentes infecciosos.
- **Sistema inmune**: barreras (piel, mucosas), células (glóbulos blancos, linfocitos B que fabrican **anticuerpos**, linfocitos T) y memoria inmunológica.
- **Vacunas**: entrenan al sistema inmune con una versión inofensiva del patógeno, una parte de él o instrucciones (vacunas de **ARNm**) para que reconozca y combata la enfermedad real. Con alta cobertura se logra la **inmunidad de rebaño**, que protege también a quienes no pueden vacunarse. Erradicaron la viruela y casi la polio.
- **Resistencia a antibióticos**: el uso indebido (no completar el tratamiento, automedicarse) selecciona bacterias resistentes; es una amenaza sanitaria global.
- Prevención básica: lavado de manos con agua y jabón (20 segundos), vacunación al día, alimentos bien cocidos, ventilación.

- **Dominios**: Bacteria, Archaea y Eukarya. **Reinos** eucariotas: Animalia, Plantae, Fungi y Protista.
- **Vertebrados** (con columna vertebral): peces, anfibios, reptiles, aves y mamíferos. **Invertebrados**: insectos, arácnidos, moluscos, gusanos, crustáceos, etc. (la gran mayoría de las especies animales).

| # | Planeta | Tipo | Dato clave |
|---|---|---|---|
| 1 | **Mercurio** | rocoso | el más cercano al Sol y el más pequeño; año de 88 días |
| 2 | **Venus** | rocoso | el más caliente (~465 °C, efecto invernadero); gira al revés |
| 3 | **Tierra** | rocoso | único conocido con vida; 71 % cubierto de agua; 1 luna |
| 4 | **Marte** | rocoso | "planeta rojo" (óxido de hierro); Olympus Mons, el volcán más alto; 2 lunas |

| 7 | **Urano** | gigante helado | gira "acostado" (inclinación ~98°) |

- **Planetas enanos**: Plutón (reclasificado en 2006), Ceres, Eris, Haumea, Makemake.

Los planetas rocosos (interiores): Mercurio, Venus, Tierra y Marte. Los gigantes (exteriores): Júpiter, Saturno, Urano y Neptuno. La cantidad de lunas confirmadas cambia con nuevos descubrimientos (Saturno y Júpiter tienen cientos).

=== esp-universo | Estrellas, galaxias, Big Bang y agujeros negros | big bang; universo; edad del universo; galaxia; vía láctea; estrella; vida de una estrella; supernova; enana blanca; estrella de neutrones; agujero negro; año luz; nebulosa; expansión del universo; materia oscura; energía oscura; exoplanetas; sol; fusión nuclear; constelaciones; telescopio james webb | general
- **Big Bang**: el universo comenzó hace ≈ **13 800 millones de años** a partir de un estado extremadamente caliente y denso, y **se sigue expandiendo** (Hubble, 1929: las galaxias se alejan, más rápido cuanto más lejos). Evidencias: expansión, abundancia de H y He y la **radiación cósmica de fondo**.
- **Año luz**: distancia que recorre la luz en un año ≈ 9,46 billones de km. La estrella más cercana al Sol, Próxima Centauri, está a ≈ 4,24 años luz.
- **Galaxia**: conjunto de miles de millones de estrellas. Nuestra **Vía Láctea** es espiral, con unos 100–400 mil millones de estrellas y ≈ 100 000 años luz de diámetro; la vecina más grande es Andrómeda. Hay cientos de miles de millones de galaxias.
- **Estrellas**: esferas de gas que brillan por **fusión nuclear** (H → He). El Sol es una enana amarilla con ≈ 4600 millones de años y vida de ≈ 10 000 millones. Estrellas masivas terminan en **supernova** y dejan una **estrella de neutrones** o un **agujero negro**; las de masa media como el Sol, en **gigante roja** y luego **enana blanca**.
- **Agujero negro**: región donde la gravedad es tan intensa que ni la luz escapa más allá del *horizonte de sucesos*. Primera imagen en 2019 (M87*).
- **Materia y energía oscuras**: componen ≈ 95 % del universo (≈ 27 % y ≈ 68 %); no las vemos directamente, solo sus efectos gravitatorios y la aceleración de la expansión.
- Se conocen miles de **exoplanetas** (planetas fuera del Sistema Solar). El telescopio espacial **James Webb** (lanzado en 2021) observa en infrarrojo.
--- más
Mirar lejos es mirar al pasado: la luz de una estrella a 100 años luz tardó 100 años en llegar.

=== tierra-estructura | La Tierra: capas, placas tectónicas, volcanes y terremotos | capas de la tierra; núcleo; manto; corteza; placas tectónicas; tectónica de placas; terremoto; sismo; volcán; escala de richter; deriva continental; pangea; wegener; tsunami; cordillera de los andes; falla de san andrés; anillo de fuego; magnitud; epicentro | general
- **Capas**: **corteza** (5–70 km, sólida) → **manto** (~2900 km, roca caliente y viscosa) → **núcleo externo** (líquido, hierro y níquel) → **núcleo interno** (sólido, ~5400 °C). El radio terrestre es ≈ 6371 km. El campo magnético lo genera el movimiento del núcleo externo.
- **Tectónica de placas**: la litosfera está dividida en placas (Pacífica, Sudamericana, Norteamericana, Africana, Euroasiática, Antártica, Indoaustraliana…) que se mueven unos centímetros por año sobre el manto. En los bordes se producen terremotos, volcanes y montañas.
  - *Convergentes* (chocan): cordilleras (**Andes**, Himalaya) y fosas.
  - *Divergentes* (se separan): dorsales oceánicas, rift africano.
  - *Transformantes* (deslizan): falla de San Andrés.
- **Deriva continental** (Wegener, 1912): hace ~300 millones de años los continentes formaban un supercontinente, **Pangea**.
- **Terremoto/sismo**: liberación brusca de energía en una falla; el punto interior es el *hipocentro* y su proyección en superficie el *epicentro*. La **magnitud** (escala de momento, antes Richter) es logarítmica: +1 de magnitud ≈ 32 veces más energía. Un **tsunami** es una ola gigante causada por un sismo, deslizamiento o erupción submarinos.
- **Volcanes**: por donde sale magma. El **Cinturón de Fuego del Pacífico** concentra ~75 % de los volcanes y gran parte de los sismos.
--- más
Si hay un temblor: protegete bajo una mesa firme o junto a un muro interior, lejos de ventanas; no uses el ascensor. Conocé la ruta de evacuación de tu zona.

=== tierra-clima | Clima, tiempo atmosférico y cambio climático | clima; tiempo atmosférico; diferencia entre clima y tiempo; cambio climático; calentamiento global; efecto invernadero; gases de efecto invernadero; capa de ozono; estaciones del año; por qué hay estaciones; el niño; la niña; huracán; ciclón; tornado; lluvia; nubes; frente frío; presión atmosférica; humedad; sequía | general
- **Tiempo atmosférico**: estado de la atmósfera en un lugar y momento (lluvia hoy). **Clima**: patrón promedio durante décadas (≥ 30 años).
- **Estaciones**: se deben a la **inclinación del eje terrestre (~23,4°)**, no a la distancia al Sol. Cuando el hemisferio sur se inclina hacia el Sol es verano allá (diciembre) e invierno en el norte. Solsticios (~21 jun y ~21 dic) y equinoccios (~21 mar y ~23 sep).
- **Efecto invernadero**: gases como vapor de agua, **CO₂, metano y N₂O** retienen parte del calor de la superficie; sin él la Tierra sería ≈ 33 °C más fría. **Cambio climático actual**: la quema de combustibles fósiles, la deforestación y la ganadería aumentaron esos gases; la temperatura media global subió ≈ 1,1–1,2 °C desde la era preindustrial, con más olas de calor, sequías, lluvias extremas, deshielo y suba del nivel del mar. El consenso científico es amplio (IPCC).
- **Capa de ozono**: filtra la radiación UV; los CFC la dañaron y el Protocolo de Montreal (1987) logró que se esté recuperando.
- **Fenómenos**: **huracán/tifón/ciclón** (tormenta tropical con vientos > 119 km/h), **tornado** (embudo de viento sobre tierra), **El Niño / La Niña** (calentamiento / enfriamiento del Pacífico ecuatorial que altera lluvias y temperaturas, p. ej. en Sudamérica).
- **Nubes y lluvia**: el vapor de agua asciende, se enfría, condensa en nubes y precipita. Frente frío: aire frío avanza empujando al cálido (tormentas, bajan temperaturas).

Qué podés hacer: ahorrar energía, preferir transporte público/bici, reducir desperdicio de alimentos, reciclar y consumir de forma responsable.

=== tierra-agua-ciclo | El agua, los océanos y los continentes | ciclo del agua; continentes; océanos; mares; cuántos continentes hay; océano más grande; río más largo; montaña más alta; lago más profundo; desierto más grande; el agua en la tierra; agua dulce; evaporación; precipitación; napas; acuífero; punto más profundo; fosa de las marianas; everest; aconcagua; amazonas; nilo; superficie de la tierra | general
- **Ciclo del agua**: evaporación (Sol) → condensación (nubes) → precipitación (lluvia, nieve) → escurrimiento/infiltración (ríos, napas) → océanos. Solo ≈ 2,5 % del agua del planeta es dulce, y la mayor parte está en glaciares y hielo.
- **Océanos** (5): Pacífico (el mayor, ~46 % de la superficie oceánica), Atlántico, Índico, Antártico (Austral) y Ártico. Los océanos cubren ≈ 71 % de la Tierra. Punto más profundo: **Fosa de las Marianas** (~11 km, Challenger Deep).
- **Continentes** (7 en el modelo más usado): Asia (el mayor), África, América del Norte, América del Sur, Antártida, Europa y Oceanía. (Otros modelos unen América o Eurasia.)
- **Montañas**: la más alta sobre el nivel del mar es el **Everest** (8848,86 m, Himalaya). El **Aconcagua** (6960,8 m, Mendoza, Argentina) es la más alta de América y fuera de Asia. Cordillera más larga: los Andes (~7000 km).
- **Ríos**: el **Nilo** (~6650 km) y el **Amazonas** (~6400 km; el de mayor caudal del mundo) disputan el más largo según cómo se mida. En Sudamérica también: Paraná, Orinoco, Uruguay, Río de la Plata (el más ancho).
- **Desiertos**: el más grande es la Antártida (desierto polar); el mayor desierto cálido, el Sahara. Lago más profundo: Baikal (Rusia). Mayor lago por superficie: mar Caspio.
- Cascadas: Salto Ángel (Venezuela, la más alta); **Cataratas del Iguazú** (Argentina/Brasil).

=== hist-antiguedad | Historia antigua: Egipto, Grecia y Roma | historia antigua; egipto antiguo; faraones; pirámides; cleopatra; jeroglíficos; piedra de rosetta; tutankamón; antigua grecia; atenas; esparta; democracia; sócrates; platón; aristóteles; alejandro magno; juegos olímpicos; roma antigua; imperio romano; república romana; julio césar; augusto; caída del imperio romano; coliseo; mesopotamia; escritura cuneiforme; babilonia | general
**Mesopotamia** (entre los ríos Tigris y Éufrates, actual Irak): primeras ciudades y la **escritura cuneiforme** (~3300 a. C.), el Código de Hammurabi (~1750 a. C.), la rueda.

**Egipto antiguo** (~3100 a. C. – 30 a. C.): civilización del Nilo, gobernada por **faraones**. Pirámides de Giza (la de Keops, ~2560 a. C., es la única de las Siete Maravillas antiguas que sigue en pie), momificación, escritura jeroglífica (descifrada por Champollion en 1822 gracias a la **Piedra de Rosetta**, hallada en 1799), tumba de Tutankamón (descubierta por Howard Carter en 1922). **Cleopatra VII** fue la última reina del Egipto ptolemaico.

**Grecia antigua**: ciudades-estado (*polis*) como **Atenas** (democracia, filosofía, arte) y **Esparta** (militarista). Democracia ateniense (s. V a. C., Pericles). Filósofos **Sócrates, Platón y Aristóteles**; historiador Heródoto; poetas Homero (*Ilíada* y *Odisea*); matemáticos Euclides, Arquímedes, Pitágoras. Primeros **Juegos Olímpicos** en 776 a. C. **Alejandro Magno** (356–323 a. C.) conquistó Persia y Egipto y llegó hasta la India.

**Roma**: fundación legendaria en 753 a. C. → **República** (509 a. C.) → **Imperio** (27 a. C., con Augusto). **Julio César** fue asesinado en el 44 a. C. El Imperio Romano de Occidente cayó en el **476 d. C.**; el de Oriente (Bizantino) duró hasta la toma de Constantinopla por los otomanos en **1453**. Legado: derecho romano, latín (origen del español, italiano, francés, portugués y rumano), ingeniería (acueductos, caminos), el Coliseo.

Cronología útil: Prehistoria → (escritura, ~3300 a. C.) → Edad Antigua → (caída de Roma, 476) → Edad Media → (toma de Constantinopla 1453, o descubrimiento de América 1492) → Edad Moderna → (Revolución Francesa, 1789) → Edad Contemporánea.

=== hist-medieval-moderna | Edad Media, Renacimiento y descubrimiento de América | edad media; feudalismo; cruzadas; peste negra; carlomagno; islam; al-ándalus; renacimiento; humanismo; leonardo da vinci; miguel ángel; imprenta; gutenberg; reforma protestante; lutero; descubrimiento de américa; cristóbal colón; 1492; conquista de américa; magallanes; vasco da gama; hernán cortés; pizarro; azteca; inca; maya; revolución científica; copérnico; galileo | general
**Edad Media (476–1453)**: *feudalismo* (señores, vasallos, siervos), poder de la Iglesia, castillos. Expansión del **islam** (desde el s. VII; **Al-Ándalus** en la península ibérica 711–1492). **Cruzadas** (1096–1291). **Peste Negra** (1347–1351) mató a cerca de un tercio de Europa. **Carlomagno** fue coronado emperador en el año 800.

**Renacimiento (s. XIV–XVI)**: nace en Italia; **humanismo**, regreso a la cultura clásica, arte realista. Leonardo da Vinci (*La Gioconda*, *La Última Cena*), Miguel Ángel (el *David*, la Capilla Sixtina), Rafael, Botticelli, Maquiavelo. La **imprenta de Gutenberg** (~1450) difundió el conocimiento. La **Reforma protestante** (Lutero, 1517) dividió el cristianismo occidental. **Revolución científica**: Copérnico (heliocentrismo), Galileo, Kepler, Newton.

**Era de los descubrimientos**: Vasco da Gama llega a la India (1498); **Cristóbal Colón** llega a América el **12 de octubre de 1492** (con la Corona de Castilla); expedición **Magallanes–Elcano**: primera vuelta al mundo (1519–1522). Conquista: Hernán Cortés derrota a los **aztecas** (Tenochtitlan, 1521); Francisco Pizarro captura al **inca** Atahualpa (1532). Antes de la llegada europea florecían los **mayas** (Mesoamérica), **aztecas** (México), **incas** (Andes, capital Cusco) y muchos pueblos originarios.
--- más
El 12 de octubre se conmemoró históricamente como "Día de la Raza"; en Argentina hoy es el "Día del Respeto a la Diversidad Cultural".

=== hist-revoluciones | Revolución Industrial, Revolución Francesa y Napoleón | revolución industrial; máquina de vapor; james watt; revolución francesa; 1789; bastilla; declaración de los derechos del hombre; napoleón bonaparte; waterloo; independencia de estados unidos; 1776; ilustración; voltaire; rousseau; montesquieu; ferrocarril; capitalismo; karl marx; derechos humanos; guillotina | general
- **Ilustración (s. XVIII)**: la razón y la ciencia como guía; Voltaire, Rousseau (contrato social), Montesquieu (división de poderes), Kant. Inspiró las revoluciones liberales.
- **Independencia de EE. UU.**: declarada el **4 de julio de 1776**.
- **Revolución Francesa (1789–1799)**: toma de la **Bastilla** (14 de julio de 1789), **Declaración de los Derechos del Hombre y del Ciudadano**, lema "Libertad, Igualdad, Fraternidad", fin de la monarquía absoluta, el Terror (guillotina). Terminó con el ascenso de **Napoleón Bonaparte**, emperador en 1804 y derrotado en **Waterloo** (1815).
- **Revolución Industrial (≈ 1760–1840, Gran Bretaña)**: paso del trabajo artesanal y agrícola a la producción en fábricas. Máquina de vapor (James Watt), telar mecánico, ferrocarril, urbanización masiva, nacimiento de la clase obrera y del capitalismo industrial; después, movimientos obreros y las ideas de Marx. La **segunda** (≈ 1870–1914) sumó electricidad, acero, petróleo y el motor de combustión.
- Hoy se habla de una **cuarta revolución industrial**: automatización, datos e inteligencia artificial.

Las independencias hispanoamericanas (1810–1825) se dieron en este contexto: crisis de la monarquía española tras la invasión napoleónica (1808) e ideas ilustradas.

=== hist-independencia-america | Independencia de América: San Martín, Bolívar y Belgrano | independencia de américa; san martín; simón bolívar; manuel belgrano; cruce de los andes; ejército de los andes; chacabuco; maipú; guayaquil; ayacucho; sucre; artigas; hidalgo; miranda; libertador; guerra de independencia; güemes; bernardo o'higgins; independencia de chile; independencia del perú; gran colombia | general
Entre 1810 y 1825 casi toda América española se independizó.
- **José de San Martín** (1778–1850): organizó el **Ejército de los Andes** en Mendoza y realizó el **Cruce de los Andes** (1817); victorias en **Chacabuco** (1817) y **Maipú** (1818) liberaron Chile (con Bernardo O'Higgins); por mar llegó al Perú, que proclamó su independencia en Lima en **1821**. En **Guayaquil** (1822) se reunió con Bolívar y se retiró. Murió en Boulogne-sur-Mer, Francia, el 17 de agosto de 1850 (feriado "Paso a la Inmortalidad", 3.er lunes de agosto).

- **Manuel Belgrano** (1770–1820): abogado y general; creó la **bandera argentina** (27 de febrero de 1812, Rosario), venció en Tucumán (1812) y Salta (1813). Murió el 20 de junio de 1820 (Día de la Bandera).

- **Primera Guerra Mundial (1914–1918)**: detonada por el asesinato del archiduque Francisco Fernando en Sarajevo (28 de junio de 1914). Aliados (Francia, Reino Unido, Rusia, Italia, EE. UU. desde 1917) vs. Imperios Centrales (Alemania, Austria-Hungría, Otomano). ≈ 10 millones de militares muertos. Tratado de Versalles (1919).
- **Revolución rusa (1917)**: Lenin y los bolcheviques; nace la **URSS** (1922).
- **Crisis de 1929** y Gran Depresión; ascenso de fascismos en Italia (Mussolini) y Alemania (**Hitler**, 1933).
- **Segunda Guerra Mundial (1939–1945)**: comenzó con la invasión alemana a Polonia (1 de septiembre de 1939); ataque japonés a **Pearl Harbor** (7 de diciembre de 1941). Aliados (EE. UU., URSS, Reino Unido, Francia…) vs. Eje (Alemania, Italia, Japón). **Holocausto**: el exterminio de unos 6 millones de judíos y de millones de otras víctimas. Terminó con las bombas atómicas sobre **Hiroshima (6 de agosto)** y **Nagasaki (9 de agosto de 1945)**. Entre 70 y 85 millones de muertos. Se creó la **ONU** (1945).
- **Guerra Fría (≈ 1947–1991)**: rivalidad EE. UU. (capitalismo, OTAN) vs. URSS (comunismo, Pacto de Varsovia) sin enfrentamiento directo: carrera armamentista, espacial, Corea, Vietnam, crisis de los misiles en Cuba (1962). **Muro de Berlín**: construido en 1961, cayó el **9 de noviembre de 1989**; la URSS se disolvió en **diciembre de 1991**.
- **Carrera espacial**: Sputnik (1957), Gagarin primer humano en el espacio (1961), **Apolo 11** llegó a la Luna el **20 de julio de 1969** (Neil Armstrong y Buzz Aldrin).
- **Descolonización** de África y Asia (1945–1975). Fin del **apartheid** en Sudáfrica (Nelson Mandela liberado en 1990, presidente en 1994).

=== lengua-ortografia | Ortografía: tildes, b/v, h, porque, sino, haber/a ver | ortografía; tildes; acentuación; reglas de acentuación; palabras agudas llanas esdrújulas; porque; por qué; porqué; por que; sino; si no; haber; a ver; echo; hecho; hay; ay; ahí; ay; vaya; valla; tilde diacrítica; mayúsculas; uso de la b y la v; uso de la h; uso de la g y la j; uso de la c s z; signos de puntuación; coma; punto y coma; dos puntos; diferencia entre tu y tú; mas y más; si y sí; el y él; aun y aún | general
**Acentuación**
- **Agudas** (acento en la última sílaba): llevan tilde si terminan en *n*, *s* o vocal → canción, café, sofá.
- **Llanas/graves** (penúltima sílaba): llevan tilde si **no** terminan en n, s o vocal → árbol, lápiz, fácil.
- **Esdrújulas** (antepenúltima) y sobresdrújulas: **siempre** llevan tilde → México, teléfono, rápidamente.
- **Tilde diacrítica** (distingue palabras iguales): tú (pronombre) / tu (posesivo) · él / el · mí / mi · sí (afirmación) / si (condicional) · más / mas · té / te · dé (verbo dar) / de · sé / se · aún (todavía) / aun (incluso).
- Interrogativos y exclamativos llevan tilde: **qué, cómo, cuándo, dónde, quién, cuál, cuánto**.

**Pares que se confunden**
| | Uso |
|---|---|
| **por qué** | pregunta: ¿Por qué llegaste tarde? |
| **porque** | respuesta/causa: Llegué tarde porque llovía. |
| **porqué** | sustantivo ("el motivo"): No entiendo el porqué. |
| **por que** | "por el cual": La razón por que luché. |
| **sino** | contrapone: No es azul, sino verde. |
| **si no** | condición negativa: Si no llegás, avisame. |
| **a ver** | mirar/preguntar: A ver qué pasa. |
| **haber** | verbo: Debe haber algo; había mucha gente. |
| **hecho / echo** | de *hacer* (lo hecho) / de *echar* (yo echo) |
| **hay / ahí / ay** | verbo haber / lugar / interjección |
| **vaya / valla** | verbo ir o interjección / cerco o publicidad |
| **tuvo / tubo** | de *tener* / cilindro hueco |
| **haya / halla / aya** | haber / hallar / niñera |

**Puntuación**: la **coma** separa elementos de una enumeración y vocativos (Juan, vení); **nunca** entre sujeto y verbo ("Los chicos, juegan" ✗). **Punto y coma** une ideas relacionadas; **dos puntos** introducen una enumeración o cita. Los signos de interrogación y exclamación se abren (¿ ¡) y se cierran.
--- más
Mayúscula inicial: al empezar un escrito, tras punto, en nombres propios. Los días, meses y gentilicios van en **minúscula** (lunes, enero, argentino) y los idiomas también (español, inglés). Voseo: «vos tenés», «vos sabés», «decime», «vení» (la tilde del voseo la lleva el imperativo agudo solo cuando corresponde).

**Clases de palabras**: sustantivo (casa), adjetivo (grande), verbo (correr), adverbio (rápidamente), pronombre (ellos), artículo (el, una), preposición (de, en, con), conjunción (y, pero), interjección (¡ay!).

**Modos y tiempos** (ejemplo con *cantar*):
| Modo | Tiempo | Ejemplo |
|---|---|---|
| Indicativo | presente | canto |
| | pretérito perfecto simple | canté |
| | pretérito imperfecto | cantaba |
| | futuro simple | cantaré |
| | condicional | cantaría |
| Subjuntivo | presente | cante |
| | imperfecto | cantara / cantase |
| Imperativo | | canta (tú) · cantá (vos) · cante (usted) |

Formas no personales: infinitivo (cantar), gerundio (cantando) y participio (cantado).
- **Oración**: sujeto (quién hace) + predicado (lo que se dice del sujeto), con un **verbo** como núcleo. Tipos según la actitud: enunciativa, interrogativa, exclamativa, exhortativa, desiderativa y dubitativa.
- **Voz activa** (El perro mordió al cartero) / **pasiva** (El cartero fue mordido por el perro).
- **Figuras retóricas**: metáfora ("tus ojos son estrellas"), comparación ("rápido como el rayo"), personificación, hipérbole, ironía, onomatopeya.
- **Voseo**: uso de *vos* con formas verbales propias (vos tenés, vos sos, vos querés); típico del Río de la Plata y partes de Centroamérica.
--- más
Los verbos irregulares cambian la raíz (poder → puedo, ir → voy, ser → soy). Consejo: una buena manera de mejorar la redacción es leer mucho y releer en voz alta lo que escribís.

La filosofía busca comprender, con razonamiento, preguntas sobre el ser, el conocimiento, la verdad, la ética y la política. Ramas: **metafísica** (qué es lo real), **epistemología** (cómo conocemos), **ética** (qué está bien), **lógica**, **estética**, **política**.

| Pensador | Idea central |
|---|---|
| **Sócrates** | "Solo sé que no sé nada"; método del diálogo (mayéutica) |
| **Platón** | mundo de las Ideas; **mito de la caverna** |
| **Aristóteles** | lógica, ética de la virtud ("término medio"), el hombre es un animal político |
| **Descartes** | racionalismo; duda metódica; **"Pienso, luego existo"** |
| **Locke / Hume** | empirismo: el conocimiento viene de la experiencia |
| **Kant** | los límites de la razón; **imperativo categórico** (actuá solo según una norma que quisieras universal) |
| **Hobbes / Locke / Rousseau** | contrato social y origen del Estado |
| **Stuart Mill** | utilitarismo: lo correcto maximiza la felicidad general |
| **Marx** | materialismo histórico; lucha de clases |
| **Nietzsche** | crítica de la moral tradicional; "Dios ha muerto"; voluntad de poder |
| **Sartre / Camus** | existencialismo: la existencia precede a la esencia; absurdo y libertad |

Escuelas helenísticas: **estoicismo** (aceptar lo que no depende de uno, virtud como único bien) y epicureísmo (placer moderado y ausencia de dolor).
--- más
Dilemas éticos clásicos: el dilema del tranvía (¿sacrificar a uno para salvar a cinco?) enfrenta a utilitaristas y deontólogos (Kant).

=== tec-hardware | Hardware: CPU, RAM, disco, GPU y cómo funciona una computadora | hardware; cpu; procesador; ram; memoria ram; disco duro; ssd; hdd; gpu; placa de video; placa madre; motherboard; fuente de poder; cómo funciona una computadora; núcleos; ghz; caché; arquitectura de von neumann; bios; uefi; boot; arrancar; sistema operativo; kernel; firmware; qué es un sistema operativo | general
Una computadora recibe datos (entrada), los procesa, los guarda y devuelve resultados (salida).
- **CPU (procesador)**: ejecuta las instrucciones. Se describe por **núcleos** (cores: tareas en paralelo), **hilos** y **frecuencia** (GHz: ciclos por segundo). Tiene memoria interna ultrarrápida llamada **caché** (L1, L2, L3).
- **RAM**: memoria de trabajo, rápida pero **volátil** (se borra al apagar). Guarda los programas y datos que se están usando. Más RAM = más cosas abiertas sin trabarse.
- **Almacenamiento**: guarda de forma permanente. **HDD** (disco mecánico: barato, lento), **SSD** (flash: muy rápido, sin partes móviles; los **NVMe** son los más veloces).
- **GPU**: procesador especializado en cálculos en paralelo (gráficos, juegos, vídeo y entrenamiento de IA).
- **Placa madre**: conecta todo. **Fuente de poder**: convierte la corriente de la red en tensiones para los componentes.
- **Arquitectura de von Neumann**: programa y datos comparten la misma memoria; la CPU repite el ciclo *buscar–decodificar–ejecutar*.
- **Arranque**: al encender, el firmware (**BIOS/UEFI**) comprueba el hardware y carga el **sistema operativo** desde el disco.
- **Sistema operativo (SO)**: software que administra los recursos (CPU, memoria, archivos, dispositivos) y da la base a las aplicaciones: Windows, macOS, **Linux**, Android, iOS. El **kernel** es su núcleo. Linux es el kernel (Linus Torvalds, 1991); las **distribuciones** (Ubuntu, Debian, Fedora, Arch) lo empaquetan con programas.
--- más
Jerarquía de memoria (de más rápida y chica a más lenta y grande): registros de CPU → caché → RAM → SSD → HDD → nube.

=== tec-bits-bytes | Bits, bytes y unidades de almacenamiento | bit; byte; kilobyte; megabyte; gigabyte; terabyte; cuántos bytes tiene un gigabyte; mb vs mbps; megabit; velocidad de internet; ascii; unicode; utf-8; codificación de caracteres; emoji; tamaño de archivo; kib; mib; gib; 1024 vs 1000 | general
- **Bit**: la unidad mínima, 0 o 1. **Byte** = 8 bits (puede representar 256 valores, 0–255; un carácter ASCII).
- Múltiplos: **1 KB = 1000 B** (decimal, SI) o **1 KiB = 1024 B** (binario). Igual para MB/MiB, GB/GiB, TB/TiB. Los fabricantes de discos usan base 10 (por eso un disco de "1 TB" muestra ≈ 931 GiB en el sistema).
  - 1 MB ≈ 1 millón de bytes · 1 GB ≈ mil millones · 1 TB ≈ un billón.
- **Mb vs MB**: la velocidad de red se mide en **bits** por segundo (Mbps); los archivos en **bytes**. 100 Mbps ≈ 12,5 MB/s de descarga máxima ideal. Un archivo de 1 GB tarda ≈ 80 s a 100 Mbps.
- **ASCII**: 7 bits, 128 caracteres (letras sin acentos, números, símbolos): 'A' = 65, 'a' = 97, '0' = 48. **Unicode** asigna un número (*code point*) a más de 150 000 caracteres de todos los idiomas y emoji. **UTF-8** es la codificación más usada: 1 a 4 bytes por carácter (ASCII ocupa 1 byte; "ñ" y tildes, 2; la mayoría de los emoji, 4).
- Un color RGB usa 3 bytes (24 bits → 16,7 millones de colores). Una foto de 12 megapíxeles sin comprimir ≈ 36 MB.
- Con *n* bits se representan 2ⁿ valores: 8 bits → 256, 16 → 65 536, 32 → ≈ 4300 millones.
--- más
Probá mi conversor: «255 a binario», «ff hex a decimal», «base64 de hola», «sha256 de hola».

=== tec-ia | Inteligencia artificial, machine learning y modelos de lenguaje | inteligencia artificial; ia; machine learning; aprendizaje automático; deep learning; aprendizaje profundo; redes neuronales; chatgpt; llm; modelo de lenguaje; gpt; claude; transformer; entrenamiento; ia generativa; prompt; alucinaciones; sesgo; supervisado; no supervisado; refuerzo; tensorflow; pytorch; scikit-learn; embeddings; qué es una ia | general
- **Inteligencia artificial (IA)**: sistemas que realizan tareas que requieren inteligencia humana (reconocer imágenes, traducir, jugar, conversar).
- **Machine learning (ML)**: en vez de programar reglas a mano, el sistema **aprende patrones de datos**.
  - *Supervisado*: datos con respuesta correcta (clasificar correos spam / no spam; predecir precios).
  - *No supervisado*: encontrar estructura sin etiquetas (agrupar clientes).
  - *Por refuerzo*: aprende por prueba, error y recompensa (juegos, robots).
- **Deep learning**: redes neuronales con muchas capas. Una **red neuronal** es una función con millones o miles de millones de parámetros (pesos) que se ajustan al entrenar minimizando el error mediante *descenso del gradiente* y *retropropagación*.
- **LLM (Large Language Model)** como Claude o GPT: modelos basados en la arquitectura **Transformer** (2017) entrenados con enormes cantidades de texto para **predecir el siguiente token**; de ahí emerge la capacidad de conversar, resumir, traducir y programar. Luego se ajustan con retroalimentación humana para que sean útiles y seguros.
- **Limitaciones**: pueden **alucinar** (inventar datos con aplomo), reflejar **sesgos** de los datos y no tienen conocimiento actualizado más allá de su entrenamiento (salvo que usen búsqueda). Verificá la información importante.
- **IA generativa**: genera texto, imágenes, audio, vídeo o código. Un **prompt** es la instrucción que se le da.
- Herramientas para empezar en Python: `scikit-learn` (ML clásico), `PyTorch` / `TensorFlow` (deep learning), `pandas` (datos), `transformers` de Hugging Face.

```python
from sklearn.datasets import load_iris
from sklearn.model_selection import train_test_split
from sklearn.ensemble import RandomForestClassifier
X, y = load_iris(return_X_y=True)
Xtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.2, random_state=0)
modelo = RandomForestClassifier().fit(Xtr, ytr)
print(modelo.score(Xte, yte))     # exactitud ≈ 0.9+
```
--- más
Conceptos clave de ML: **entrenamiento/validación/prueba** (separar datos para medir si generaliza), **sobreajuste** (memoriza en vez de aprender), **métricas** (exactitud, precisión, recall, F1), **características** (features). Yo (pAnkI) no soy un LLM: respondo con una base de conocimiento local; si ponés una clave de API en ⚙, las preguntas abiertas las responde un modelo de Claude.

=== tec-blockchain | Blockchain y criptomonedas | blockchain; bitcoin; ethereum; criptomonedas; cripto; contrato inteligente; smart contract; minería; billetera; wallet; nft; descentralizado; hash en blockchain; prueba de trabajo; proof of work; proof of stake; satoshi nakamoto; stablecoin; seed phrase | general
- **Blockchain**: libro contable distribuido y casi inalterable. Los datos se agrupan en **bloques** encadenados: cada bloque contiene el **hash** del anterior, así que modificar uno invalida toda la cadena posterior. Muchos nodos mantienen copias y validan por **consenso**, sin autoridad central.
- **Bitcoin** (2009, Satoshi Nakamoto, identidad desconocida): primera criptomoneda, con un suministro máximo de **21 millones**. Usa **prueba de trabajo** (*mining*: calcular hashes para proponer bloques). **Ethereum** agrega **contratos inteligentes** (código que se ejecuta en la cadena) y usa **prueba de participación** (*proof of stake*) desde 2022.
- **Billetera (wallet)**: guarda las claves; la **clave privada** (o la *frase semilla* de 12/24 palabras) da control total de los fondos: quien la tiene, controla el dinero. **Nunca la compartas**.
- **Stablecoins**: criptomonedas atadas al valor de una moneda (p. ej. al dólar).
- **NFT**: certificado digital único registrado en una blockchain.
- Riesgos: alta **volatilidad**, estafas (phishing, falsas promesas de ganancias), pérdida irreversible de claves y regulación variable. No es asesoramiento financiero.
--- más
Una transacción en blockchain es irreversible; por eso verificá siempre la dirección de destino.

=== ciberseguridad-personal | Seguridad personal: contraseñas, phishing y privacidad | contraseña segura; contraseñas; phishing; estafa; fraude; verificación en dos pasos; 2fa; gestor de contraseñas; malware; ransomware; virus; antivirus; wifi público; vpn; privacidad; robo de cuenta; correo sospechoso; ingeniería social; sim swapping; passkey; actualizaciones; backup; copia de seguridad; me hackearon | general
**Contraseñas**
- Largas (≥ 14 caracteres) y **únicas para cada servicio**. Una *frase de paso* (cuatro o cinco palabras al azar) es fácil de recordar y fuerte.
- Usá un **gestor de contraseñas** (Bitwarden, KeePassXC, 1Password) y generá claves al azar (podés pedirme: «generar contraseña de 20»).
- Activá la **verificación en dos pasos (2FA)**, mejor con app autenticadora o llave física que con SMS. Las **passkeys** reemplazan a la contraseña.
- Revisá si tu correo apareció en filtraciones: haveibeenpwned.com.

**Phishing e ingeniería social**: mensajes (mail, SMS, WhatsApp) que simulan ser de un banco, empresa o conocido para que entregues datos o hagas clic. Señales: urgencia ("tu cuenta será bloqueada"), enlaces cuyo dominio no coincide, errores de ortografía, pedidos de claves o códigos. **Ningún banco te pide la clave ni códigos por mensaje o llamada.** Ante la duda, entrá por tu cuenta al sitio oficial, no por el enlace.

**Buenas prácticas**: actualizá el sistema y las apps, hacé **copias de seguridad** (regla 3-2-1: 3 copias, 2 medios, 1 fuera de casa), no instales software pirata, cuidado con las redes Wi-Fi públicas (HTTPS, VPN), y cifrá los discos de equipos portátiles.
- **Malware**: virus, troyanos, spyware, **ransomware** (cifra tus archivos y pide rescate).
--- más
Si te robaron una cuenta: cambiá la contraseña desde un dispositivo seguro, cerrá todas las sesiones, activá 2FA, revisá correos de recuperación y avisá a tus contactos. Si hay dinero de por medio, contactá al banco ya.

=== economia-basica | Economía básica: inflación, PBI, oferta y demanda | economía; inflación; pbi; producto bruto interno; oferta y demanda; deflación; recesión; desempleo; tipo de cambio; dólar; deuda; déficit fiscal; banco central; tasa de interés; macroeconomía; microeconomía; mercado; monopolio; competencia; ahorro e inversión; canasta básica; poder adquisitivo; devaluación; riesgo país | general
- **Oferta y demanda**: el precio de un bien tiende al punto donde lo que los consumidores quieren comprar (demanda) iguala lo que los productores quieren vender (oferta). Si la demanda sube y la oferta no, el precio sube; y a la inversa.
- **PBI/PIB**: valor de todos los bienes y servicios finales producidos en un país en un período. **Crecimiento** = variación del PBI; **recesión** = caída del PBI durante varios trimestres.
- **Inflación**: aumento sostenido y generalizado de precios; se mide con un índice (IPC) y reduce el **poder adquisitivo**. **Deflación**: baja generalizada de precios. Causas posibles: exceso de emisión monetaria respecto de la demanda de dinero, aumento de costos, expectativas, tipo de cambio.
- **Desempleo**: porcentaje de la población activa que busca trabajo y no lo encuentra.
- **Banco central**: emite la moneda, fija tasas de referencia y cuida la estabilidad. **Política monetaria** (tasas, emisión) vs **política fiscal** (impuestos y gasto del Estado). **Déficit fiscal** = gasto mayor que ingresos.
- **Tipo de cambio**: precio de una moneda en términos de otra; **devaluación** = la moneda local pierde valor.
- **Microeconomía** estudia decisiones de individuos y empresas; **macroeconomía**, el conjunto de la economía.
- **Estructuras de mercado**: competencia perfecta, oligopolio, monopolio.
- **Costo de oportunidad**: lo que resignás al elegir una opción.
--- más
Es una explicación general y neutral; los debates sobre qué política económica es mejor dependen de enfoques y evidencia que exceden este resumen.

=== finanzas-personales | Finanzas personales: presupuesto y ahorro | finanzas personales; presupuesto; ahorro; fondo de emergencia; regla 50/30/20; deudas; tarjeta de crédito; interés de tarjeta; invertir; inversión; diversificación; jubilación; gastos fijos; gastos hormiga; cómo ahorrar; educación financiera; plazo fijo; fondos comunes de inversión; riesgo y rendimiento | general
- **Presupuesto**: anotá ingresos y gastos durante un mes. Regla orientativa **50/30/20**: 50 % necesidades (vivienda, comida, transporte), 30 % deseos, 20 % ahorro/deudas.
- **Fondo de emergencia**: 3 a 6 meses de gastos en algo líquido y seguro, antes de invertir.
- **Deudas**: pagá primero las de mayor interés (la tarjeta de crédito suele ser la más cara). Pagar solo el mínimo hace crecer la deuda por interés compuesto.
- **Gastos hormiga**: pequeños gastos diarios que sumados pesan (cafés, suscripciones sin uso). Revisá suscripciones cada tanto.
- **Inversión**: a mayor rendimiento esperado, mayor riesgo. Principios: **diversificar** (no todo en un solo activo), horizonte de largo plazo, evitar decisiones emocionales y desconfiar de las promesas de ganancias garantizadas.
- **Interés compuesto**: ahorrar temprano y de forma constante pesa más que el monto (ver «interés compuesto»).
--- más
Información educativa general, no asesoramiento financiero: para decisiones concretas consultá a un profesional matriculado.

=== estudio-tecnicas | Técnicas de estudio y aprendizaje | cómo estudiar; técnicas de estudio; pomodoro; técnica pomodoro; feynman; técnica feynman; repetición espaciada; anki; mapas mentales; resumen; memorizar; aprender más rápido; concentración; procrastinación; hábitos; método de estudio; active recall; recuperación activa; cómo aprender a programar; aprender programando | general
Lo que más funciona según la evidencia:
1. **Recuperación activa**: en vez de releer, cerrá el material y tratá de recordar/escribir lo aprendido; hacete preguntas o practicá con ejercicios.
2. **Repetición espaciada**: repasá en intervalos crecientes (1 día, 3, 7, 14, 30). Apps: Anki.
3. **Práctica intercalada**: mezclá tipos de problemas en vez de repetir uno solo.
4. **Técnica Feynman**: explicá el tema con palabras simples como si le enseñaras a un niño; donde te trabás, está lo que no entendés.
5. **Pomodoro**: 25 min de foco total + 5 de descanso; cada cuatro ciclos, un descanso de 15–30 min. Notificaciones apagadas.
6. **Sueño y ejercicio**: dormir bien consolida la memoria.
7. **Metas pequeñas y concretas** ("hoy resuelvo 3 ejercicios") mejor que "estudiar mucho".

**Para aprender a programar**: hacé proyectos pequeños desde el principio; escribí el código vos mismo (no solo copiar); leé los errores; dividí los problemas; usá Git; y enseñá lo que aprendés. Es normal sentirse trabado: el progreso viene de la práctica constante, no de la genialidad.
--- más
Contra la procrastinación: empezá con 5 minutos ("regla de los 2 minutos" para tareas chicas), eliminá distracciones y definí el siguiente paso físico concreto.

=== salud-habitos | Hábitos saludables (información general) | hábitos saludables; sueño; dormir bien; cuántas horas dormir; alimentación saludable; ejercicio; hidratación; estrés; ansiedad; salud mental; ergonomía; pausas activas; vista cansada; dolor de espalda por la computadora; sedentarismo; regla 20-20-20; postura | general
Esto es información general, **no reemplaza la consulta médica**.
- **Sueño**: la mayoría de los adultos necesita 7–9 horas; horarios regulares, pantallas fuera de la cama y cuarto oscuro y fresco ayudan.
- **Actividad física**: ≈ 150 minutos semanales de actividad moderada (caminar rápido, bicicleta) más fuerza dos veces por semana (recomendación de la OMS).
- **Alimentación**: variada, con frutas, verduras, legumbres, cereales integrales y proteínas; menos ultraprocesados y bebidas azucaradas. Agua como bebida principal.
- **Si trabajás con computadora**: ergonomía (pantalla a la altura de los ojos, espalda apoyada, antebrazos a 90°), **pausa cada 50–60 min** para levantarte y estirar, y la **regla 20-20-20** para la vista (cada 20 min, mirá algo a 20 pies ≈ 6 m durante 20 s).
- **Estrés y salud mental**: hablar con alguien de confianza, descansar, moverte y limitar la sobreexposición a noticias y redes ayudan. Si sentís angustia persistente, buscá un profesional o una línea de escucha de tu zona; en CABA y el Gran Buenos Aires funciona el **135** (Centro de Asistencia al Suicida). Verificá siempre los números vigentes en fuentes oficiales.
--- más
Ante síntomas intensos o persistentes, o una emergencia, llamá a los servicios de emergencia locales (en Argentina, 911 es el número de emergencias; 107 es la emergencia médica en CABA).

=== py-args-kwargs | Python: *args y **kwargs | args; kwargs; *args; **kwargs; argumentos variables; argumentos con nombre; desempaquetar; unpacking; parámetros arbitrarios; keyword arguments | python
`*args` recoge argumentos posicionales extra en una **tupla**; `**kwargs` recoge los argumentos con nombre en un **diccionario**.

```python
def mostrar(*args, **kwargs):
    print(args)      # (1, 2, 3)

=== py-decoradores | Python: decoradores | decorador; decoradores; decorator; @decorator; wraps; functools; @property; @staticmethod; @classmethod; @lru_cache; envolver función | python
Un **decorador** es una función que recibe otra función y devuelve una versión modificada. Se aplica con `@`.

```python
import functools, time

def medir(func):
    @functools.wraps(func)            # conserva nombre y docstring
    def envoltura(*args, **kwargs):
        t = time.perf_counter()
        resultado = func(*args, **kwargs)
        print(f"{func.__name__} tardó {time.perf_counter() - t:.4f}s")
        return resultado
    return envoltura

@medir
def calcular(n):
    return sum(range(n))

calcular(1_000_000)

@functools.lru_cache(maxsize=None)    # memoización automática
def fib(n):
    return n if n < 2 else fib(n - 1) + fib(n - 2)
```
--- más
Decoradores integrados muy usados en clases:
```python
class Circulo:
    def __init__(self, r): self._r = r

    @property                  # se usa como atributo: c.area
    def area(self): return 3.14159 * self._r ** 2

    @staticmethod              # no recibe self
    def unidad(): return "cm"

    @classmethod               # recibe la clase (cls)
    def unitario(cls): return cls(1)
```

`with` garantiza que un recurso se **libere** (archivo, conexión, lock) aunque ocurra un error.

```python
with open("datos.txt") as f:
    contenido = f.read()
# aquí f ya está cerrado

# Crear tu propio gestor con contextlib
from contextlib import contextmanager

@contextmanager
def temporizador():
    import time
    t = time.perf_counter()
    try:
        yield
    finally:
        print(f"{time.perf_counter() - t:.3f}s")

with temporizador():
    sum(range(10_000_000))
```

- También funciona con varios recursos: `with open("a") as a, open("b") as b:`.
- Una clase puede ser gestor si define `__enter__` y `__exit__`.
