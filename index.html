`@dataclass` genera automáticamente `__init__`, `__repr__` y `__eq__` para clases que solo guardan datos.

```python
from dataclasses import dataclass, field

@dataclass
class Producto:
    nombre: str
    precio: float
    etiquetas: list[str] = field(default_factory=list)   # nunca "= []" directo
    stock: int = 0

p = Producto("Mate", 3500.0)
print(p)                 # Producto(nombre='Mate', precio=3500.0, etiquetas=[], stock=0)
p == Producto("Mate", 3500.0)   # True

@dataclass(frozen=True, order=True)   # inmutable y comparable
class Version:
    mayor: int
    menor: int
```

Sintaxis `secuencia[inicio:fin:paso]` (el fin **no** se incluye). Sirve para listas, tuplas y strings.

```python
x = [0, 1, 2, 3, 4, 5]
x[1:4]      # [1, 2, 3]
x[:3]       # [0, 1, 2]      desde el inicio
x[3:]       # [3, 4, 5]      hasta el final
x[-2:]      # [4, 5]         últimos dos
x[::2]      # [0, 2, 4]      de a dos
x[::-1]     # [5, 4, 3, 2, 1, 0]  invertida
x[:]        # copia superficial

"python"[::-1]        # 'nohtyp'
"python"[1:4]         # 'yth'
x[1:3] = [9, 9, 9]    # asignar a una porción
```
--- más
- Los índices negativos cuentan desde el final: `-1` es el último.
- Los rebanados **nunca** dan error por salirse del rango (devuelven lo que haya); el acceso `x[10]` sí lanza `IndexError`.

**Lista vs tupla**
- `list` `[1, 2]`: mutable, se puede modificar.
- `tuple` `(1, 2)`: inmutable, más liviana y usable como clave de diccionario.
```python
t = (1, 2, 3)
t[0] = 9            # TypeError: 'tuple' object does not support item assignment
x, y = (10, 20)     # desempaquetado
unico = (5,)        # tupla de un elemento: la coma es la que la crea
```
**`is` vs `==`**
- `==` compara **valores**; `is` compara **identidad** (si es el mismo objeto en memoria).
```python
a = [1, 2]; b = [1, 2]
a == b     # True
a is b     # False
x = None
x is None  # forma correcta de comparar con None
```
--- más
- Con enteros chicos y cadenas internadas `is` puede dar `True` por optimización de CPython: nunca lo uses para comparar valores.

Python busca un nombre en este orden (**LEGB**): **L**ocal → **E**nclosing (función externa) → **G**lobal → **B**uilt-in.

```python
contador = 0

def mal():
    contador += 1       # UnboundLocalError: asigna => Python la trata como local

def bien():
    global contador     # indica que usás la global
    contador += 1

def externa():
    n = 0
    def interna():

Los métodos con doble guion bajo ("dunder") permiten que tus objetos usen la sintaxis nativa de Python.

```python
class Vector:
    def __init__(self, x, y):
        self.x, self.y = x, y
    def __repr__(self):                 # representación para depurar
        return f"Vector({self.x}, {self.y})"
    def __str__(self):                  # texto para print()
        return f"({self.x}, {self.y})"
    def __add__(self, otro):            # v1 + v2
        return Vector(self.x + otro.x, self.y + otro.y)
    def __eq__(self, otro):             # v1 == v2
        return (self.x, self.y) == (otro.x, otro.y)
    def __len__(self):                  # len(v)
        return 2
    def __getitem__(self, i):           # v[0]
        return (self.x, self.y)[i]

print(Vector(1, 2) + Vector(3, 4))     # (4, 6)
```
--- más
- Si definís `__eq__`, definí también `__hash__` si querés usar el objeto en sets o como clave.
- `__repr__` apunta a desarrolladores; `__str__` a usuarios.

|---|---|---|---|

f();                          // "Hola undefined"  (se perdió this)

```js
function Animal(nombre) { this.nombre = nombre; }
Animal.prototype.hablar = function () { return this.nombre + " hace ruido"; };

Object.getPrototypeOf(a) === Animal.prototype;   // true

const hijo = Object.create(base);        // hijo hereda de base

React construye interfaces con **componentes**: funciones que reciben *props* y devuelven JSX.

```jsx
import { useState, useEffect } from "react";

function Contador({ inicial = 0 }) {              // props
  const [n, setN] = useState(inicial);            // estado
  useEffect(() => {                               // efecto secundario
    document.title = `Clics: ${n}`;
  }, [n]);                                        // se ejecuta cuando cambia n
  return <button onClick={() => setN(n + 1)}>Clics: {n}</button>;
}

function Lista({ items }) {
  return <ul>{items.map(i => <li key={i.id}>{i.nombre}</li>)}</ul>;   // key única
}

export default function App() {
  return <><Contador inicial={5} /><Lista items={[{ id: 1, nombre: "Mate" }]} /></>;
}
```
```bash
npm create vite@latest mi-app -- --template react
cd mi-app && npm install && npm run dev
```
--- más
- No modifiques el estado directamente (`n++`): usá el setter (`setN`). Para objetos/arrays creá copias nuevas (`setLista([...lista, nuevo])`).
- `useEffect` con `[]` corre una vez al montar; sin array corre en cada render; devolver una función sirve para limpiar.
- Los hooks solo se llaman en el nivel superior del componente (no dentro de `if` ni bucles).
- Otros hooks: `useRef`, `useMemo`, `useCallback`, `useContext`, `useReducer`.

=== js-timers-fetch-tips | JavaScript: errores comunes de principiantes | errores comunes javascript; trampas de javascript; NaN; typeof null; parseInt; forEach async; await en forEach; map async; undefined is not a function; objetos se comparan por referencia; sort numérico; orden de ejecución; punto y coma automático | js
1. **`"5" + 3` → `"53"`**, pero `"5" - 3` → `2`. Convertí explícitamente: `Number(x)`, `parseInt(x, 10)`.
2. **`typeof null === "object"`** (bug histórico). Para comprobar null: `x === null`.
3. **`forEach` con `await` no espera**: usá `for (const x of lista) await f(x)` o `await Promise.all(lista.map(f))`.
4. **`[10, 9, 1].sort()` ordena como texto** → `[1, 10, 9]`. Usá `sort((a, b) => a - b)`.
5. **`0.1 + 0.2 !== 0.3`** (coma flotante).
6. **Comparar objetos con `===`** compara referencias.
7. **Olvidar `await`**: obtenés una `Promise` en vez del valor.
8. **`return` seguido de salto de línea** → devuelve `undefined` por la inserción automática de `;`:
   ```js
   return
     { ok: true };    // undefined
   ```
9. **`var` en bucles con callbacks** (ver hoisting).
10. **Modificar `arr` mientras lo recorrés.**
--- más
Para detectar muchos de estos problemas automáticamente usá **ESLint** y formateá con **Prettier**.

=== js-canvas | JavaScript: dibujar con canvas | canvas; dibujar en javascript; getContext; fillRect; animación canvas; juego en javascript; requestAnimationFrame canvas; game loop; bucle de juego; gráficos 2d | js
```html
<canvas id="c" width="400" height="300"></canvas>
<script>
const ctx = document.getElementById("c").getContext("2d");
let x = 0;
function frame() {
  ctx.clearRect(0, 0, 400, 300);          // borrar
  ctx.fillStyle = "tomato";
  ctx.fillRect(x, 100, 40, 40);           // rectángulo
  ctx.beginPath();
  ctx.arc(200, 150, 20, 0, Math.PI * 2);  // círculo
  ctx.stroke();
  x = (x + 2) % 400;
  requestAnimationFrame(frame);           // bucle de animación (≈60 fps)
}
frame();
<\/script>
```
--- más
- Estructura típica de un juego: **leer entrada → actualizar estado → dibujar**, una vez por frame.
- Usá el tiempo entre frames (`performance.now()`) para que la velocidad no dependa de los fps.
- Librerías: Phaser (juegos 2D), Three.js (3D), p5.js (creativo).

=== sql-select | SQL: SELECT, WHERE, ORDER BY y LIMIT | paginar resultados; paginación sql; limit offset; primeras filas; sql; select; consulta sql; select from where; where; order by; limit; distinct; like; between; in; is null; alias; as; consultar datos; filtrar filas; cómo hacer un select; operadores sql; top | sql
`SELECT` lee datos de una tabla. El orden de escritura es: `SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT`.

```sql
SELECT nombre, precio AS precio_final      -- columnas (AS = alias)
FROM productos
WHERE precio BETWEEN 100 AND 500
  AND categoria IN ('mate', 'yerba')
  AND nombre LIKE 'Ma%'                     -- % = cualquier texto, _ = un carácter
  AND descuento IS NOT NULL                 -- NULL se compara con IS, no con =
ORDER BY precio DESC, nombre ASC
LIMIT 10 OFFSET 20;                         -- paginación (SQL Server: TOP 10 / OFFSET-FETCH)

SELECT DISTINCT categoria FROM productos;   -- sin repetidos
SELECT COUNT(*) FROM productos;
SELECT * FROM productos;                    -- * = todas las columnas (evitalo en código de producción)
```
--- más
- Operadores: `= <> != < > <= >=`, `AND OR NOT`, `IN (…)`, `BETWEEN a AND b`, `LIKE`, `IS NULL`.
- Texto va entre **comillas simples** `'así'`; las dobles suelen ser para nombres de columnas.
- Sin `ORDER BY` el orden de las filas no está garantizado.
- `WHERE` filtra filas **antes** de agrupar; `HAVING` filtra grupos **después**.

=== sql-modificar | SQL: INSERT, UPDATE, DELETE y CREATE TABLE | insert into; update set; delete from; create table; alter table; drop table; truncate; agregar fila; modificar datos; borrar registros; crear tabla; tipos de datos sql; default; auto_increment; serial; upsert | sql
```sql
CREATE TABLE productos (
  id        INTEGER PRIMARY KEY,            -- AUTO_INCREMENT (MySQL) / SERIAL o GENERATED (Postgres)
  nombre    VARCHAR(100) NOT NULL,
  precio    DECIMAL(10,2) NOT NULL CHECK (precio >= 0),
  categoria VARCHAR(50) DEFAULT 'general',
  creado    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
  UNIQUE (nombre)
);

INSERT INTO productos (nombre, precio) VALUES ('Mate', 3500), ('Yerba', 2800);

UPDATE productos SET precio = precio * 1.10 WHERE categoria = 'general';

DELETE FROM productos WHERE id = 7;

ALTER TABLE productos ADD COLUMN stock INT DEFAULT 0;
DROP TABLE productos;        -- borra la tabla entera
TRUNCATE TABLE productos;    -- vacía todas las filas (rápido, sin WHERE)
```
--- más
- **Siempre** escribí el `WHERE` en `UPDATE` y `DELETE`: sin él afectás toda la tabla. Probá antes con un `SELECT` con el mismo `WHERE`.
- Hacé el cambio dentro de una **transacción** (`BEGIN; … ROLLBACK;` o `COMMIT;`) cuando puedas.
- Upsert (insertar o actualizar): `INSERT … ON CONFLICT (id) DO UPDATE …` (Postgres/SQLite), `ON DUPLICATE KEY UPDATE` (MySQL).
- Tipos habituales: `INT, BIGINT, DECIMAL, VARCHAR(n), TEXT, DATE, TIMESTAMP, BOOLEAN`. Para dinero usá `DECIMAL`, no `FLOAT`.

=== sql-join | SQL: JOIN (INNER, LEFT, RIGHT, FULL) | join; inner join; left join; right join; full join; cross join; unir tablas; combinar tablas; relacionar tablas; self join; on; using; diferencia entre inner y left join; join de tres tablas | sql
`JOIN` combina filas de dos tablas según una condición (normalmente clave foránea = clave primaria).

```sql
-- INNER JOIN: solo filas que coinciden en ambas
SELECT p.id, c.nombre
FROM pedidos p
INNER JOIN clientes c ON c.id = p.cliente_id;

-- LEFT JOIN: todas las de la izquierda, con NULL si no hay coincidencia
SELECT c.nombre, COUNT(p.id) AS pedidos
FROM clientes c
LEFT JOIN pedidos p ON p.cliente_id = c.id
GROUP BY c.id, c.nombre;

-- clientes SIN pedidos
SELECT c.* FROM clientes c
LEFT JOIN pedidos p ON p.cliente_id = c.id
WHERE p.id IS NULL;
```
| Tipo | Devuelve |
|---|---|
| `INNER JOIN` | solo las coincidencias |
| `LEFT JOIN` | todo de la izquierda + coincidencias de la derecha |
| `RIGHT JOIN` | todo de la derecha + coincidencias de la izquierda |
| `FULL JOIN` | todo de ambas |
| `CROSS JOIN` | producto cartesiano (todas contra todas) |
--- más
- Si olvidás la condición `ON` obtenés un producto cartesiano (filas × filas).
- Un `WHERE` sobre la tabla derecha de un `LEFT JOIN` puede convertirlo sin querer en `INNER`: poné esa condición en el `ON`.
- Usá alias cortos (`p`, `c`) y prefijá siempre las columnas para evitar `ambiguous column`.

```sql
SELECT categoria,
       COUNT(*)            AS cantidad,
       SUM(precio)         AS total,
       AVG(precio)         AS promedio,
       MIN(precio)         AS minimo,
       MAX(precio)         AS maximo,
       COUNT(DISTINCT marca) AS marcas
FROM productos
WHERE activo = TRUE                 -- filtra FILAS antes de agrupar
GROUP BY categoria
HAVING COUNT(*) > 5                 -- filtra GRUPOS después de agrupar
ORDER BY total DESC;
```
--- más
- Toda columna del `SELECT` que no esté dentro de una función de agregación debe estar en el `GROUP BY` (si no: error `must appear in the GROUP BY clause`).
- `COUNT(*)` cuenta filas; `COUNT(col)` ignora los `NULL`.

```sql

SELECT nombre FROM productos
WHERE precio > (SELECT AVG(precio) FROM productos);

SELECT * FROM clientes c
WHERE EXISTS (SELECT 1 FROM pedidos p WHERE p.cliente_id = c.id);

-- CTE: nombra un resultado intermedio y hace la consulta legible
WITH ventas_mes AS (
  SELECT cliente_id, SUM(total) AS total
  FROM pedidos
  WHERE fecha >= '2026-10-01'
  GROUP BY cliente_id
)
SELECT c.nombre, v.total
FROM ventas_mes v JOIN clientes c ON c.id = v.cliente_id
ORDER BY v.total DESC;

SELECT nombre FROM clientes UNION SELECT nombre FROM proveedores;

-- Funciones de ventana: calculan sin colapsar filas
SELECT nombre, categoria, precio,
       ROW_NUMBER() OVER (PARTITION BY categoria ORDER BY precio DESC) AS puesto,

FROM productos;

=== sql-indices | SQL: índices y rendimiento (EXPLAIN) | índice; indices; index; create index; explain; explain analyze; consulta lenta; optimizar consulta; rendimiento sql; full table scan; seq scan; n+1; índice compuesto; slow query | sql
Un **índice** es una estructura (normalmente un árbol B) que permite encontrar filas sin recorrer toda la tabla.

```sql
CREATE INDEX idx_pedidos_cliente ON pedidos (cliente_id);
CREATE UNIQUE INDEX idx_usuarios_email ON usuarios (email);
CREATE INDEX idx_fecha_estado ON pedidos (estado, fecha);   -- compuesto: importa el orden

EXPLAIN ANALYZE

```
--- más
- Indexá las columnas que usás en `WHERE`, `JOIN` y `ORDER BY` con frecuencia. Las claves primarias y `UNIQUE` ya tienen índice.
- Cuestan: ocupan espacio y **enlentecen** `INSERT/UPDATE/DELETE`. No indexes todo.
- Un índice no ayuda con `LIKE '%texto'` (comodín al inicio), ni con funciones sobre la columna (`WHERE LOWER(email)=…` sin índice funcional).
- Compuesto `(a, b)` sirve para filtrar por `a` o por `a` y `b`, pero no solo por `b`.
- Problema **N+1**: ejecutar 1 consulta + N consultas dentro de un bucle; resolvelo con un `JOIN` o cargando en lote (`WHERE id IN (…)`).
- Evitá `SELECT *` y traé solo las columnas y filas que necesitás (`LIMIT`).

=== sql-transacciones | SQL: transacciones y ACID | transacción; transacciones; begin; commit; rollback; acid; atomicidad; aislamiento; nivel de aislamiento; deadlock sql; lock; savepoint; consistencia; transferencia bancaria | sql
Una **transacción** agrupa varias operaciones que se aplican **todas o ninguna**.

```sql
BEGIN;
UPDATE cuentas SET saldo = saldo - 500 WHERE id = 1;
UPDATE cuentas SET saldo = saldo + 500 WHERE id = 2;
COMMIT;        -- confirma ambos cambios
-- ROLLBACK;   -- los deshace si algo falló
```
**ACID**:
- **A**tomicidad: todo o nada.
- **C**onsistencia: los datos siempre cumplen las reglas (restricciones).
- **A**islamiento: transacciones concurrentes no se pisan.
- **D**urabilidad: lo confirmado sobrevive a una caída.
--- más
- Niveles de aislamiento: `READ UNCOMMITTED`, `READ COMMITTED` (por defecto en Postgres), `REPEATABLE READ` (por defecto en MySQL), `SERIALIZABLE`. Más aislamiento = más seguridad pero más bloqueos.
- **Deadlock**: dos transacciones se esperan mutuamente; el motor cancela una. Tomá los bloqueos siempre en el mismo orden y mantené las transacciones cortas.
- Desde código, usá el soporte de transacciones de tu librería (`with con:` en sqlite3, `@Transactional` en Spring).

=== sql-modelado | Bases de datos: claves, relaciones y normalización | clave primaria; primary key; clave foránea; foreign key; relación uno a muchos; muchos a muchos; tabla intermedia; normalización; primera forma normal; 1fn 2fn 3fn; diagrama entidad relación; der; modelado de datos; diseño de base de datos; integridad referencial; on delete cascade | sql
- **Clave primaria (PK)**: identifica de forma única cada fila (`id`). No nula, no repetida.
- **Clave foránea (FK)**: columna que referencia la PK de otra tabla y garantiza **integridad referencial**.
- Relaciones: **1:N** (un cliente, muchos pedidos → FK en el lado "muchos"); **N:M** (estudiantes y cursos → tabla intermedia); **1:1** (poco común).

```sql
CREATE TABLE clientes (id INT PRIMARY KEY, nombre VARCHAR(100));
CREATE TABLE pedidos (
  id INT PRIMARY KEY,
  cliente_id INT NOT NULL REFERENCES clientes(id) ON DELETE RESTRICT,
  fecha DATE
);
-- muchos a muchos
CREATE TABLE inscripciones (
  estudiante_id INT REFERENCES estudiantes(id),
  curso_id      INT REFERENCES cursos(id),
  PRIMARY KEY (estudiante_id, curso_id)
);
```
--- más
**Normalización** (evitar redundancia):
1. **1FN**: valores atómicos (nada de listas en una celda: "tel1, tel2").
2. **2FN**: cada columna depende de **toda** la clave primaria.
3. **3FN**: las columnas no dependen de otras columnas no clave (la ciudad no se repite junto al código postal).

A veces se **desnormaliza** a propósito para ganar velocidad de lectura.
`ON DELETE CASCADE` borra las filas hijas al borrar la fila padre; `RESTRICT` lo impide; `SET NULL` pone la FK en null.

```python

cur.execute("SELECT * FROM usuarios WHERE nombre = %s", (nombre,))      # psycopg / mysql

=== orm | ORM: qué es y para qué sirve | orm; sqlalchemy; hibernate; prisma; django orm; sequelize; typeorm; mapeo objeto relacional; entity framework; active record; migraciones; migrations | general
Un **ORM** (Object-Relational Mapper) permite trabajar con tablas como si fueran clases/objetos, en vez de escribir SQL a mano.

```python
# SQLAlchemy 2.0
from sqlalchemy import select, String, create_engine
from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session

class Base(DeclarativeBase): pass
class Producto(Base):
    __tablename__ = "productos"
    id: Mapped[int] = mapped_column(primary_key=True)
    nombre: Mapped[str] = mapped_column(String(100))
    precio: Mapped[float]

engine = create_engine("sqlite:///tienda.db")
Base.metadata.create_all(engine)
with Session(engine) as s:
    s.add(Producto(nombre="Mate", precio=3500))
    s.commit()
    caros = s.scalars(select(Producto).where(Producto.precio > 1000)).all()
```
```js
// Prisma
const caros = await prisma.producto.findMany({ where: { precio: { gt: 1000 } }, orderBy: { precio: "desc" } });
```
--- más
- Ventajas: menos código repetido, parametrización automática, portabilidad entre motores, **migraciones** (cambios de esquema versionados).
- Desventajas: consultas complejas pueden salir ineficientes (problema N+1); a veces conviene SQL directo.
- Una **migración** es un script versionado que cambia el esquema (agregar una columna) y se aplica igual en todos los entornos.

Una **rama** es una línea independiente de desarrollo: permite probar cosas sin tocar `main`.

```bash

- Flujo habitual de equipo: una rama por tarea → Pull Request → revisión → merge a `main`.

Un **conflicto** ocurre cuando dos ramas cambiaron las mismas líneas y Git no sabe cuál conservar.

```text
<<<<<<< HEAD
tu versión (la rama actual)
=======
la versión de la otra rama
>>>>>>> otra-rama
```
Pasos:
```bash
git status                  # ver archivos "both modified"
# 1. abrí cada archivo, elegí/combiná el contenido y BORRÁ las marcas <<<<<<< ======= >>>>>>>
# 2. marcá como resuelto y terminá
git add archivo.py
git commit                  # (o: git merge --continue / git rebase --continue)

git merge --abort           # si preferís cancelar y volver a como estabas
```
--- más
- VS Code muestra botones "Accept Current / Incoming / Both" sobre cada conflicto.
- Para evitarlos: integrá `main` en tu rama seguido (`git merge main` o `git pull --rebase`) y evitá ramas de larga vida.
- Después de resolver, **corré los tests**: un conflicto bien "resuelto" puede romper el código.

| Quiero… | Comando |
|---|---|
| Descartar cambios de un archivo (sin commit) | `git restore archivo` |
| Sacar un archivo del staging | `git restore --staged archivo` |
| Corregir el **último** commit (mensaje o archivos) | `git commit --amend` |
| Deshacer el último commit **conservando** los cambios | `git reset --soft HEAD~1` |
| Deshacer el último commit y sacar del staging (conserva archivos) | `git reset HEAD~1` |
| Deshacer commit **y borrar** los cambios | `git reset --hard HEAD~1` ⚠️ |
| Deshacer un commit ya **publicado** sin reescribir historia | `git revert <hash>` |
| Volver a como está el remoto | `git fetch && git reset --hard origin/main` ⚠️ |

```bash

git reset --hard HEAD@{2}      # volver a un estado anterior listado en el reflog

--- más
- `reset` **reescribe** historia (úsalo en commits locales); `revert` crea un commit nuevo que invierte a otro (seguro en ramas compartidas).

Ambos integran cambios, pero distinto:
- **merge**: une dos ramas con un commit de unión; conserva el historial tal cual (con bifurcaciones).
- **rebase**: "re-juega" tus commits encima de otra base, dejando un historial **lineal**; reescribe los commits (cambian sus hash).

```bash
git switch feature
git rebase main              # actualiza feature sobre el main más reciente
# si hay conflictos: resolver -> git add -> git rebase --continue   (o --abort)

git rebase -i HEAD~4         # editar los últimos 4 commits: pick, squash (unir), reword, drop
git pull --rebase            # traer cambios sin crear commits de merge
```
--- más
- **Regla de oro**: nunca hagas rebase de commits que ya compartiste con otros (ramas públicas como `main`).
- `squash` junta varios commits ("WIP", "arreglo") en uno limpio antes de abrir el Pull Request.

`ls -l` muestra algo como `-rwxr-xr-- 1 ana dev 120 oct 26 archivo`:
- Primer carácter: tipo (`-` archivo, `d` carpeta). Luego 3 grupos `rwx`: **propietario**, **grupo**, **otros**.
- `r`=leer (4), `w`=escribir (2), `x`=ejecutar (1). Se suman: `rwx`=7, `r-x`=5, `r--`=4.

```bash

chmod 755 script.sh       # rwxr-xr-x
chmod 644 archivo         # rw-r--r--
chmod -R u+rw carpeta     # recursivo; u=usuario g=grupo o=otros
chown ana:dev archivo     # cambiar propietario y grupo
sudo comando              # ejecutar como administrador
sudo -i                   # sesión de root
./script.sh               # ejecutar un script del directorio actual
```
--- más
- `Permission denied` al ejecutar: falta `chmod +x` o no tenés permiso; al escribir: usá `sudo` o cambiá los permisos/propietario.
- Usá `sudo` solo cuando haga falta. Nunca `chmod 777` "para que ande": deja el archivo abierto a cualquiera.

services:

    environment:
      DATABASE_URL: postgres://app:secreto@db:5432/app
    depends_on: [db]

| Quiero… | Empezá con… |
|---|---|
| Aprender lo básico sin trabas | **Python** |

--- más
Plan sugerido para empezar:
1. Elegí **un** lenguaje (Python o JavaScript) y hacelo bien: variables, condicionales, bucles, funciones, listas y diccionarios.
2. Construí proyectos chicos (calculadora, lista de tareas, scraper, bot, juego del ahorcado).
3. Aprendé **Git** y **la terminal**.
4. Sumá **SQL** y un poco de **HTTP/APIs**.

**Big O** describe cómo crece el tiempo (o la memoria) de un algoritmo al aumentar el tamaño `n` de la entrada, en el peor caso y sin constantes.

| Notación | Nombre | Ejemplo |
|---|---|---|
| O(1) | constante | acceder a `lista[i]`, buscar en un diccionario |
| O(log n) | logarítmica | búsqueda binaria |
| O(n) | lineal | recorrer una lista, búsqueda lineal |
| O(n log n) | linealítmica | merge sort, quicksort (promedio), `sorted()` |
| O(n²) | cuadrática | dos bucles anidados, bubble sort |
| O(2ⁿ) | exponencial | Fibonacci recursivo ingenuo, subconjuntos |
| O(n!) | factorial | todas las permutaciones |

```python
def tiene_duplicados_lento(xs):        # O(n²)
    return any(xs[i] == xs[j] for i in range(len(xs)) for j in range(i + 1, len(xs)))

def tiene_duplicados(xs):              # O(n) usando un set
    return len(set(xs)) != len(xs)
```
--- más
- Para 1 000 000 de elementos: O(n) ≈ 10⁶ pasos; O(n log n) ≈ 2·10⁷; O(n²) ≈ 10¹² (inviable).
- Reglas: ignorá constantes (`2n` → O(n)) y términos menores (`n² + n` → O(n²)); bucles anidados multiplican, bucles consecutivos suman.
- Complejidad típica de operaciones: lista Python `append` O(1), `insert(0, x)` O(n), `x in lista` O(n), `x in set/dict` O(1) promedio.

def balanceado(texto):         # uso clásico de una pila
    pares = {")": "(", "]": "[", "}": "{"}
    pila = []
    for c in texto:
        if c in "([{":
            pila.append(c)
        elif c in pares:
            if not pila or pila.pop() != pares[c]:

    return not pila

=== lista-enlazada | Lista enlazada | lista enlazada; linked list; nodo; node; singly linked list; lista doblemente enlazada; invertir lista enlazada; puntero next; head | general
Cada nodo guarda un valor y una referencia al siguiente. No hay acceso por índice, pero insertar/borrar al principio es O(1).

```python
class Nodo:
    def __init__(self, valor, siguiente=None):
        self.valor = valor
        self.siguiente = siguiente

class ListaEnlazada:
    def __init__(self):
        self.cabeza = None

    def agregar_al_inicio(self, valor):          # O(1)
        self.cabeza = Nodo(valor, self.cabeza)

    def agregar_al_final(self, valor):           # O(n)
        nuevo = Nodo(valor)
        if not self.cabeza:
            self.cabeza = nuevo
            return
        actual = self.cabeza
        while actual.siguiente:
            actual = actual.siguiente
        actual.siguiente = nuevo

    def invertir(self):                          # O(n), clásica de entrevistas
        previo = None
        actual = self.cabeza
        while actual:
            actual.siguiente, previo, actual = previo, actual, actual.siguiente
        self.cabeza = previo

    def __iter__(self):
        actual = self.cabeza
        while actual:
            yield actual.valor
            actual = actual.siguiente
```
--- más
- Variante **doblemente enlazada**: cada nodo también apunta al anterior.
- En la práctica, los arrays dinámicos suelen ser más rápidos por la localidad de memoria; las listas enlazadas brillan al insertar/quitar en el medio con el nodo en mano.
- Técnica útil: dos punteros (lento y rápido) para detectar ciclos (algoritmo de Floyd).

=== arbol-binario | Árboles binarios y BST | árbol binario; binary tree; bst; árbol de búsqueda; recorrido inorden; preorden; postorden; in-order; altura de un árbol; árbol avl; red-black; insertar en árbol; recorrer un árbol; nodo raíz | general
Un árbol tiene una **raíz**, y cada nodo hasta dos hijos (izquierdo/derecho). En un **BST** (búsqueda), todo lo de la izquierda es menor y lo de la derecha es mayor.

```python
class Nodo:
    def __init__(self, valor):
        self.valor, self.izq, self.der = valor, None, None

def insertar(raiz, valor):
    if raiz is None:
        return Nodo(valor)
    if valor < raiz.valor:
        raiz.izq = insertar(raiz.izq, valor)
    else:
        raiz.der = insertar(raiz.der, valor)
    return raiz

def buscar(raiz, valor):
    while raiz and raiz.valor != valor:
        raiz = raiz.izq if valor < raiz.valor else raiz.der
    return raiz

def inorden(raiz):                    # izquierda, raíz, derecha -> valores ORDENADOS
    if raiz:
        yield from inorden(raiz.izq)
        yield raiz.valor
        yield from inorden(raiz.der)

def altura(raiz):
    return 0 if raiz is None else 1 + max(altura(raiz.izq), altura(raiz.der))

raiz = None
for v in [5, 3, 8, 1, 4]:
    raiz = insertar(raiz, v)
list(inorden(raiz))                   # [1, 3, 4, 5, 8]
```
--- más
- Recorridos: **inorden** (izq, raíz, der), **preorden** (raíz primero, sirve para copiar), **postorden** (raíz al final, sirve para borrar), **por niveles** (BFS con una cola).
- Un BST degenerado (datos ya ordenados) se vuelve una lista: O(n). Los árboles **balanceados** (AVL, rojo-negro) garantizan O(log n).
- Las bases de datos usan árboles B para los índices.

=== grafos-bfs-dfs | Grafos: BFS y DFS | grafo; graph; bfs; dfs; búsqueda en anchura; búsqueda en profundidad; recorrer grafo; lista de adyacencia; camino más corto; laberinto; componentes conexas; ciclo en grafo; orden topológico; breadth first; depth first | general
Un grafo son **nodos** (vértices) conectados por **aristas**. Se representa con una **lista de adyacencia** (diccionario de listas).

```python
from collections import deque

grafo = {
    "A": ["B", "C"],
    "B": ["D"],
    "C": ["D", "E"],
    "D": ["F"],
    "E": ["F"],
    "F": [],
}

def bfs(grafo, inicio):                       # por niveles: camino más corto SIN pesos
    visitados, cola, orden = {inicio}, deque([inicio]), []
    while cola:
        nodo = cola.popleft()
        orden.append(nodo)
        for vecino in grafo[nodo]:
            if vecino not in visitados:
                visitados.add(vecino)
                cola.append(vecino)
    return orden

def dfs(grafo, nodo, visitados=None):          # en profundidad (recursivo)
    visitados = visitados if visitados is not None else set()
    visitados.add(nodo)
    for vecino in grafo[nodo]:
        if vecino not in visitados:
            dfs(grafo, vecino, visitados)
    return visitados

def camino_corto(grafo, a, b):                 # BFS guardando el padre
    padres, cola = {a: None}, deque([a])
    while cola:
        n = cola.popleft()
        if n == b:
            ruta = []
            while n is not None:
                ruta.append(n); n = padres[n]
            return ruta[::-1]
        for v in grafo[n]:
            if v not in padres:
                padres[v] = n; cola.append(v)
    return None

bfs(grafo, "A")                    # ['A', 'B', 'C', 'D', 'E', 'F']
camino_corto(grafo, "A", "F")      # ['A', 'B', 'D', 'F']
```
--- más
- **BFS** usa una **cola**; **DFS** una **pila** (o recursión). Ambos son O(V + E).
- Usá BFS para caminos más cortos en grafos sin pesos y DFS para explorar todo, detectar ciclos u ordenar topológicamente.
- Con **pesos**: Dijkstra (sin pesos negativos) con un heap; Bellman-Ford admite negativos; A* usa una heurística.
- Siempre llevá un conjunto de **visitados**, o el recorrido se cicla en grafos con ciclos.

=== dijkstra | Algoritmo de Dijkstra (camino más corto con pesos) | dijkstra; camino mínimo; shortest path; ruta más corta con pesos; grafo ponderado; heapq; cola de prioridad; a estrella; a*; bellman-ford; algoritmo de dijkstra | python
```python
import heapq

def dijkstra(grafo, origen):
    """grafo = {nodo: [(vecino, peso), ...]}  (pesos >= 0)"""
    dist = {n: float("inf") for n in grafo}
    dist[origen] = 0
    heap = [(0, origen)]
    while heap:
        d, nodo = heapq.heappop(heap)
        if d > dist[nodo]:
            continue                       # entrada vieja
        for vecino, peso in grafo[nodo]:
            nueva = d + peso
            if nueva < dist[vecino]:
                dist[vecino] = nueva
                heapq.heappush(heap, (nueva, vecino))
    return dist

g = {"A": [("B", 4), ("C", 1)], "B": [("D", 1)], "C": [("B", 2), ("D", 5)], "D": []}
dijkstra(g, "A")        # {'A': 0, 'B': 3, 'C': 1, 'D': 4}
```
--- más
- Complejidad: O((V + E) log V) con heap.
- No funciona con pesos **negativos** (usá Bellman-Ford).
- Para reconstruir el camino, guardá el "padre" de cada nodo al actualizar `dist`.

=== ordenamiento | Algoritmos de ordenamiento (bubble, merge, quick) | algoritmos de ordenamiento; bubble sort; ordenamiento burbuja; selection sort; insertion sort; merge sort; quick sort; quicksort; heap sort; ordenar sin sort; implementar sort; cómo funciona sort; timsort; ordenamiento estable | python
```python
def burbuja(xs):                      # O(n²): intercambia vecinos fuera de orden
    xs = xs[:]
    for i in range(len(xs)):
        for j in range(len(xs) - 1 - i):
            if xs[j] > xs[j + 1]:
                xs[j], xs[j + 1] = xs[j + 1], xs[j]
    return xs

def insercion(xs):                    # O(n²), muy rápido con datos casi ordenados
    xs = xs[:]
    for i in range(1, len(xs)):
        clave, j = xs[i], i - 1
        while j >= 0 and xs[j] > clave:
            xs[j + 1] = xs[j]; j -= 1
        xs[j + 1] = clave
    return xs

def merge_sort(xs):                   # O(n log n), estable, divide y vencerás
    if len(xs) <= 1:
        return xs
    medio = len(xs) // 2
    izq, der = merge_sort(xs[:medio]), merge_sort(xs[medio:])
    res, i, j = [], 0, 0
    while i < len(izq) and j < len(der):
        if izq[i] <= der[j]: res.append(izq[i]); i += 1
        else:                res.append(der[j]); j += 1
    return res + izq[i:] + der[j:]

def quicksort(xs):                    # O(n log n) promedio, O(n²) peor caso
    if len(xs) <= 1:
        return xs
    pivote = xs[len(xs) // 2]
    return (quicksort([x for x in xs if x < pivote])
            + [x for x in xs if x == pivote]
            + quicksort([x for x in xs if x > pivote]))

merge_sort([5, 2, 9, 1, 5, 6])     # [1, 2, 5, 5, 6, 9]
```

=== busqueda-binaria | Búsqueda binaria | búsqueda binaria; binary search; buscar en lista ordenada; bisect; dividir a la mitad; búsqueda lineal; o(log n); lower bound | general
Sobre una lista **ordenada**, compara con el elemento del medio y descarta la mitad en cada paso: O(log n).

```python
def busqueda_binaria(xs, objetivo):
    lo, hi = 0, len(xs) - 1
    while lo <= hi:
        medio = (lo + hi) // 2
        if xs[medio] == objetivo:
            return medio
        if xs[medio] < objetivo:
            lo = medio + 1
        else:
            hi = medio - 1
    return -1                         # no está

busqueda_binaria([1, 3, 5, 7, 9, 11], 7)    # 3

import bisect
bisect.bisect_left([1, 3, 5, 7], 5)         # 2: posición donde insertar manteniendo el orden
```
```js
function busquedaBinaria(xs, x) {
  let lo = 0, hi = xs.length - 1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (xs[m] === x) return m;
    xs[m] < x ? (lo = m + 1) : (hi = m - 1);
  }
  return -1;
}
```

=== programacion-dinamica | Programación dinámica y memoización | programación dinámica; dp; dynamic programming; memoización; tabulación; fibonacci eficiente; mochila; knapsack; subsecuencia común; lcs; edit distance; distancia de edición; cambio de monedas; coin change; lru_cache | python
Resolver un problema guardando las soluciones de **subproblemas repetidos** para no recalcularlas. Dos estilos: **memoización** (recursión + caché, de arriba hacia abajo) y **tabulación** (llenar una tabla, de abajo hacia arriba).

```python
from functools import lru_cache

@lru_cache(maxsize=None)
def fib(n):                           # memoización: O(n) en vez de O(2ⁿ)
    return n if n < 2 else fib(n - 1) + fib(n - 2)

def monedas_minimas(monedas, objetivo):       # coin change (tabulación)
    INF = float("inf")
    dp = [0] + [INF] * objetivo               # dp[m] = mínimo de monedas para formar m
    for m in range(1, objetivo + 1):
        for c in monedas:
            if c <= m and dp[m - c] + 1 < dp[m]:
                dp[m] = dp[m - c] + 1
    return dp[objetivo] if dp[objetivo] != INF else -1

def lcs(a, b):                                # subsecuencia común más larga
    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]
    for i in range(1, len(a) + 1):
        for j in range(1, len(b) + 1):
            dp[i][j] = dp[i-1][j-1] + 1 if a[i-1] == b[j-1] else max(dp[i-1][j], dp[i][j-1])
    return dp[-1][-1]

monedas_minimas([1, 5, 10, 25], 63)    # 6  (25+25+10+1+1+1)
lcs("ABCBDAB", "BDCABA")               # 4
```
--- más
Cuándo aplica: (1) el problema se divide en subproblemas **superpuestos** y (2) tiene **subestructura óptima**. Pasos: definir qué representa `dp[i]`, la relación de recurrencia, los casos base y el orden de llenado.
Clásicos: Fibonacci, mochila 0/1, camino en una grilla, distancia de edición (Levenshtein), subsecuencia creciente más larga.

=== voraz-backtracking | Algoritmos voraces y backtracking | algoritmo voraz; greedy; backtracking; vuelta atrás; n reinas; permutaciones; sudoku; subconjuntos; generar combinaciones; problema del cambio; dividir y vencerás; divide and conquer; fuerza bruta | python
**Voraz (greedy)**: en cada paso elegí lo mejor localmente. Rápido, pero no siempre da el óptimo global.

```python
def dar_vuelto(monto, monedas=(500, 200, 100, 50, 20, 10)):      # óptimo con estas denominaciones
    resultado = []
    for m in sorted(monedas, reverse=True):
        while monto >= m:
            monto -= m; resultado.append(m)
    return resultado
```
**Backtracking**: probá una opción, avanzá, y si no sirve **volvé atrás** y probá otra.
```python
def permutaciones(items):
    res = []
    def ir(actual, restantes):
        if not restantes:
            res.append(actual[:]); return
        for i, x in enumerate(restantes):
            actual.append(x)
            ir(actual, restantes[:i] + restantes[i + 1:])
            actual.pop()                       # deshacer la decisión
    ir([], items)
    return res

def subconjuntos(xs):
    res = [[]]
    for x in xs:
        res += [s + [x] for s in res]
    return res

len(permutaciones([1, 2, 3]))      # 6
subconjuntos([1, 2, 3])            # [[], [1], [2], [1,2], [3], [1,3], [2,3], [1,2,3]]
```
--- más
- Backtracking resuelve Sudoku, N reinas, laberintos y combinatoria; **poda** las ramas que ya no pueden llegar a solución para que no sea exponencial puro.
- **Dividir y vencerás**: partir el problema, resolver partes y combinar (merge sort, búsqueda binaria).

=== dos-punteros | Técnicas: dos punteros y ventana deslizante | dos punteros; two pointers; ventana deslizante; sliding window; subarray suma máxima; substring más larga sin repetir; par que suma objetivo; two sum; kadane; prefix sum; suma acumulada | python
```python
def dos_suma_ordenada(xs, objetivo):         # xs ordenado: dos punteros, O(n)
    i, j = 0, len(xs) - 1
    while i < j:
        s = xs[i] + xs[j]
        if s == objetivo: return i, j
        if s < objetivo: i += 1
        else: j -= 1
    return None

def two_sum(xs, objetivo):                   # sin ordenar: diccionario, O(n)
    visto = {}
    for i, x in enumerate(xs):
        if objetivo - x in visto:
            return visto[objetivo - x], i
        visto[x] = i

def max_suma_ventana(xs, k):                 # ventana deslizante de tamaño fijo
    ventana = sum(xs[:k]); mejor = ventana
    for i in range(k, len(xs)):
        ventana += xs[i] - xs[i - k]
        mejor = max(mejor, ventana)
    return mejor

def subcadena_sin_repetir(s):                # ventana variable
    ultimo, inicio, mejor = {}, 0, 0
    for i, c in enumerate(s):
        if c in ultimo and ultimo[c] >= inicio:
            inicio = ultimo[c] + 1
        ultimo[c] = i
        mejor = max(mejor, i - inicio + 1)
    return mejor

def kadane(xs):                              # subarray contiguo de suma máxima
    mejor = actual = xs[0]
    for x in xs[1:]:
        actual = max(x, actual + x)
        mejor = max(mejor, actual)
    return mejor

kadane([-2, 1, -3, 4, -1, 2, 1, -5, 4])      # 6
```
--- más
Estas técnicas convierten soluciones O(n²) (probar todos los pares/subarreglos) en O(n). Si un enunciado habla de "subarreglo contiguo", "par", "ventana" o "substring", pensá en ellas.

**CORS** (Cross-Origin Resource Sharing) es una regla del **navegador**: una página en `https://a.com` no puede leer respuestas de `https://b.com` salvo que `b.com` lo permita con cabeceras. Origen = esquema + dominio + puerto (`http://localhost:3000` ≠ `http://localhost:8000`).

Error típico: `Access to fetch at '…' from origin '…' has been blocked by CORS policy: No 'Access-Control-Allow-Origin' header`.

**Solución: configurar el SERVIDOR** (el que recibe la petición), no el cliente:
```js
// Express
import cors from "cors";
app.use(cors({ origin: "https://mi-sitio.com", credentials: true }));
```
```python
# FastAPI
from fastapi.middleware.cors import CORSMiddleware
app.add_middleware(CORSMiddleware, allow_origins=["http://localhost:5173"],
                   allow_methods=["*"], allow_headers=["*"])
# Flask: pip install flask-cors ; CORS(app)
```
```text
# Cabeceras de respuesta necesarias
Access-Control-Allow-Origin: https://mi-sitio.com
Access-Control-Allow-Methods: GET, POST, PUT, DELETE
Access-Control-Allow-Headers: Content-Type, Authorization
```
--- más
- Peticiones "no simples" (JSON con `Authorization`, `PUT`, `DELETE`) disparan antes un **preflight** `OPTIONS`; el servidor debe responderlo bien.
- `Access-Control-Allow-Origin: *` no se puede usar junto con cookies/`credentials`.
- Atajos de desarrollo: un proxy en el servidor de desarrollo (Vite: `server.proxy`) o llamar a la API desde tu backend.
- CORS **no** es seguridad del servidor: curl o Postman ignoran CORS. Solo protege al usuario del navegador.
- Abrir un HTML con `file://` y hacer `fetch` también suele fallar por esta causa: serví los archivos (`python3 -m http.server`).

- **Hash**: función de un solo sentido que convierte datos en una huella de tamaño fijo. Mismo input → mismo hash; no se puede "deshacer". Usos: verificar integridad (checksum), contraseñas.
- **Cifrado**: transforma datos de forma **reversible** con una clave.
  - *Simétrico* (AES): la misma clave cifra y descifra. Rápido.
  - *Asimétrico* (RSA, curvas elípticas): clave **pública** cifra/verifica y **privada** descifra/firma. Base de HTTPS y SSH.
- **Firma digital**: hash firmado con la clave privada; cualquiera verifica con la pública.
- **Base64** y URL-encoding **no son cifrado**: son solo formas de representar bytes como texto.

```python
import bcrypt           # pip install bcrypt
h = bcrypt.hashpw(b"mi-clave", bcrypt.gensalt())      # guardar este hash
bcrypt.checkpw(b"mi-clave", h)                        # True

import hashlib
hashlib.sha256(b"hola").hexdigest()                   # integridad de archivos, NO para contraseñas

import secrets
secrets.token_urlsafe(32)                             # token aleatorio seguro
```
--- más
- Para **contraseñas** usá algoritmos lentos y con sal: **Argon2**, **bcrypt** o **scrypt**. MD5 y SHA-1 están rotos para seguridad; SHA-256 solo es rápido (apto para checksums, no para contraseñas).
- La **sal** es un valor aleatorio por usuario que evita tablas precalculadas (*rainbow tables*).
- Podés calcular un SHA-256 acá mismo: escribí `sha256 de hola`.

- **IP**: dirección de un equipo en la red (IPv4 `192.168.1.10`, IPv6 `2001:db8::1`). `127.0.0.1`/`localhost` = tu propio equipo. Rangos privados: `10.x.x.x`, `172.16–31.x.x`, `192.168.x.x`.
- **DNS**: la "agenda telefónica" que traduce `ejemplo.com` → IP. Registros: **A** (IPv4), **AAAA** (IPv6), **CNAME** (alias), **MX** (correo), **TXT** (verificaciones). Los cambios tardan según el **TTL**.
- **Puerto**: identifica el servicio en un equipo: 80 HTTP, **443 HTTPS**, 22 SSH, 21 FTP, 25 SMTP, 53 DNS, 3306 MySQL, 5432 PostgreSQL, 6379 Redis, 27017 MongoDB.
- **TCP**: conexión confiable y ordenada (web, correo, SSH). **UDP**: sin conexión, rápido, puede perder paquetes (video en vivo, juegos, DNS).
- **TLS** (sucesor de SSL): cifra la conexión y usa un **certificado** que prueba la identidad del servidor (emitido por una autoridad; Let's Encrypt los da gratis). Eso es el candado de HTTPS.
- **Proxy**: intermediario; **proxy inverso** (Nginx) recibe peticiones y las reparte a servidores internos; **VPN**: túnel cifrado a otra red.

- **Microservicios**: muchos servicios pequeños e independientes que se comunican por red. Escalan y se despliegan por separado, pero agregan complejidad (red, datos distribuidos, monitoreo). No arranques con esto sin necesidad.
- **MVC**: separa **Modelo** (datos y reglas), **Vista** (interfaz) y **Controlador** (recibe la petición y coordina).
- **Capas**: presentación → lógica de negocio → acceso a datos.
- **Frontend** (lo que corre en el navegador) vs **backend** (servidor, lógica, base de datos).
- **SPA** (aplicación de una página, React/Vue) vs **SSR** (HTML renderizado en el servidor, Next.js/Nuxt) vs **SSG** (HTML estático generado al compilar).

Escalabilidad y rendimiento:
- **Vertical**: máquina más grande. **Horizontal**: más máquinas detrás de un **balanceador de carga**.
- **Caché** (Redis, CDN, caché HTTP): guardar resultados costosos. **CDN**: copias de archivos estáticos cerca del usuario.
- **Colas de mensajes** (RabbitMQ, Kafka, SQS): desacoplan procesos y absorben picos de trabajo.
- **Cloud**: AWS, Azure, Google Cloud ofrecen servidores (VM), contenedores, bases gestionadas y **serverless** (funciones que se ejecutan por evento y se cobran por uso).

=== clean-code-solid | Código limpio, SOLID y principios de diseño | código limpio; clean code; solid; srp; ocp; liskov; isp; dip; dry; kiss; yagni; refactorización; refactoring; code smell; nombres claros; funciones pequeñas; acoplamiento; cohesión; deuda técnica; legibilidad; principios de programación | general
**SOLID** (diseño orientado a objetos):
- **S** — *Responsabilidad única*: una clase tiene una sola razón para cambiar.
- **O** — *Abierto/Cerrado*: abierto a extensión, cerrado a modificación (agregás código nuevo en vez de editar el viejo).
- **L** — *Sustitución de Liskov*: una subclase debe poder usarse donde se usa la clase base sin romper nada.
- **I** — *Segregación de interfaces*: varias interfaces pequeñas mejor que una gigante.
- **D** — *Inversión de dependencias*: depender de abstracciones (interfaces), no de implementaciones concretas.

Otros principios:
- **DRY** (Don't Repeat Yourself): cada conocimiento tiene una única representación. Ojo con abstraer demasiado pronto.
- **KISS**: mantenelo simple. **YAGNI**: no construyas lo que todavía no necesitás.
- **Alta cohesión, bajo acoplamiento**: cada módulo hace una cosa y depende poco de los demás.

```python
# Antes
def f(d):
    if d[1] == 1: return d[0] * 0.9
    return d[0]

# Después: nombres con significado, sin "números mágicos"
DESCUENTO_CLIENTE_VIP = 0.10
def precio_final(precio, es_vip):
    return precio * (1 - DESCUENTO_CLIENTE_VIP) if es_vip else precio
```
--- más
Reglas prácticas: nombres que revelen intención; funciones cortas con una sola tarea; evitar parámetros booleanos confusos y anidamiento profundo (usá *early return*); comentá el *porqué*; cubrí con tests antes de refactorizar; refactorizá en pasos chicos.
Señales de "code smell": funciones de 100+ líneas, clases que lo saben todo, copiar-y-pegar, condicionales gigantes, variables globales.

=== patrones-diseno | Patrones de diseño (Singleton, Factory, Observer, Strategy…) | patrones de diseño; design patterns; singleton; factory; observer; strategy; decorator; adapter; builder; facade; command; inyección de dependencias; dependency injection; repository; publish subscribe; pub sub; event emitter | general
Son soluciones probadas a problemas de diseño frecuentes.

| Patrón | Idea | Ejemplo |
|---|---|---|
| **Singleton** | una única instancia global | conexión a la base, configuración (usalo con cuidado) |
| **Factory** | una función/clase decide qué objeto crear | `crear_notificacion("email")` |
| **Builder** | construir objetos complejos paso a paso | `Consulta().desde("a").donde(...)` |
| **Strategy** | intercambiar algoritmos | distintos cálculos de envío |
| **Observer** | quien se suscribe recibe avisos de cambios | eventos del DOM, `EventEmitter` |
| **Decorator** | agregar comportamiento envolviendo un objeto | `@lru_cache`, middlewares |
| **Adapter** | traducir una interfaz a otra | envolver una librería externa |
| **Repository** | ocultar el acceso a datos tras una interfaz | `repo.buscar_por_id(7)` |
| **Dependency Injection** | pasar las dependencias desde afuera | facilita tests con mocks |

```python
# Strategy + inyección de dependencias
class EnvioEstandar:  costo = lambda self, kg: 500 + 100 * kg
class EnvioExpress:   costo = lambda self, kg: 900 + 250 * kg

class Pedido:
    def __init__(self, kg, estrategia):        # la estrategia viene de afuera
        self.kg, self.estrategia = kg, estrategia
    def costo_envio(self):
        return self.estrategia.costo(self.kg)

Pedido(2, EnvioExpress()).costo_envio()   # 1400
```

**Causa:** intentás acceder a una propiedad (`x.y`) de algo que es `undefined` o `null`.

Las causas más comunes:
1. El dato **todavía no llegó** (petición asíncrona sin terminar) o la respuesta no trae ese campo.
2. `document.querySelector("#id")` devolvió `null` porque el elemento no existe **todavía** (script antes del HTML) o el id está mal escrito.
3. Pusiste el índice o la clave equivocada (`datos.usuarios[0].nombre` con `usuarios` vacío).
4. Una función que debía devolver un valor no tiene `return`.

```js
// Diagnóstico: mirá qué vale realmente
console.log(resultado);              // ¿es undefined?

// Soluciones
const ciudad = usuario?.direccion?.ciudad ?? "sin dato";     // optional chaining + valor por defecto
if (!boton) throw new Error("No existe #boton");               // fallar con un mensaje claro
const datos = await res.json();  console.log(datos);           // revisá la forma real del JSON antes de usarlo
```
```html
<\!-- el script debe ir al final del body o con defer -->
<script src="app.js" defer><\/script>
```
--- más
El mensaje entre paréntesis (`reading 'map'`) te dice **qué propiedad** estabas leyendo; la variable que es `undefined` es la que está **antes del punto**. Mirá la línea y columna que indica la consola (F12).

- Variable declarada dentro de otra función o bloque `{}` y usada afuera (ámbito).
- Olvidaste `import`/`require` de la librería o cargar el `<script>`.
- `Cannot access 'x' before initialization`: usaste una `let/const` antes de su línea de declaración (zona muerta temporal).
- Usar `document`/`window` en Node (no existen) o `require`/`process` en el navegador.

**Causa:** llamás con `()` algo que no es una función.
- El nombre del método está mal escrito (`lenght`, `foreach` en vez de `forEach`).
- La variable no es lo que creés: `.map is not a function` suele significar que **no es un array** (es un objeto o `undefined`).

=== err-js-stack | Error: Maximum call stack size exceeded / StackOverflow / RecursionError | maximum call stack size exceeded; rangeerror maximum call stack; stack overflow; stackoverflowerror; recursionerror; maximum recursion depth exceeded; recursión infinita; infinite recursion; too much recursion | general
**Causa:** una función se llama a sí misma sin parar (recursión sin caso base, o con un caso base que nunca se alcanza). También ocurre con dos funciones que se llaman entre sí, o con un `setter` que se asigna a sí mismo (`set x(v){ this.x = v }`).

```python
def contar(n):
    return contar(n - 1)          # no tiene caso base -> RecursionError

def contar_ok(n):
    if n <= 0:                    # caso base
        return 0
    return contar_ok(n - 1)
```
Soluciones: agregá/corregí el **caso base** y verificá que cada llamada se acerque a él; o convertí la recursión en un bucle con una pila propia; en Python el límite por defecto es ~1000 (`sys.setrecursionlimit` solo con cuidado).
--- más
En Java es `StackOverflowError`; en C, *Segmentation fault* por agotar el stack. Ver "Recursión" para más detalle.

- **`Too many re-renders` / `Maximum update depth exceeded`**: llamás a `setEstado` durante el render o en un `useEffect` sin lista de dependencias que cambia el mismo estado. Ejemplos mal: `<button onClick={setN(n+1)}>` (se ejecuta al renderizar). Correcto: `onClick={() => setN(n + 1)}`.
- **`Each child in a list should have a unique "key" prop`**: en `lista.map(...)` agregá `key={item.id}` (estable y único; evitá el índice si la lista cambia de orden).
- **`Invalid hook call`**: llamaste un hook fuera de un componente, dentro de un `if`/bucle, o tenés dos copias de React en el proyecto.
- **`Objects are not valid as a React child`**: renderizaste un objeto (`{usuario}` en vez de `{usuario.nombre}`).
- **`useEffect` en bucle infinito**: las dependencias cambian en cada render (objeto/función creados inline). Usá valores primitivos, `useMemo`/`useCallback`, o corregí el array.
- **`Hydration failed`** (Next.js): el HTML del servidor difiere del cliente (fechas, `Math.random`, `window`).

```jsx

| Error | Qué significa | Solución |
|---|---|---|
| `ERESOLVE unable to resolve dependency tree` | conflicto de versiones entre dependencias (*peer deps*) | `npm install --legacy-peer-deps`, o ajustar versiones compatibles |
| `EADDRINUSE: address already in use :::3000` | ya hay un proceso usando ese puerto | cerrarlo (`ss -tulpn \| grep 3000` → `kill PID`) o cambiar el puerto |
| `ENOENT … package.json` | ejecutás npm en una carpeta sin `package.json` | `cd` a la carpeta del proyecto o `npm init -y` |
| `EACCES: permission denied` (al instalar `-g`) | sin permiso en el directorio global | configurá un prefijo de npm en tu home o usá `nvm`; no uses `sudo npm` |
| `Cannot find module 'x'` | paquete no instalado | `npm install` |
| `npm: command not found` / `'node' no se reconoce` | Node no instalado o fuera del PATH | instalá Node LTS (nodejs.org o `nvm`) y reabrí la terminal |
| `JavaScript heap out of memory` | el proceso agotó la memoria | `NODE_OPTIONS=--max-old-space-size=4096` |

Si algo quedó raro: borrá `node_modules` y `package-lock.json`, y corré `npm install` de nuevo.

- `unexpected indent`: una línea tiene más sangría que la anterior sin motivo.
- `unindent does not match any outer indentation level`: retrocediste a un nivel que no existe.
- `TabError`: mezclás **tabulaciones y espacios**.

```python
def f(x):
return x * 2        # IndentationError: expected an indented block

def g(x):
    return x * 2    # 4 espacios
```
**Solución:** configurá tu editor para insertar 4 espacios al presionar Tab y activá "mostrar espacios en blanco"; convertí todo con "Convertir indentación a espacios" (VS Code: barra inferior → *Indent Using Spaces*).

=== err-py-name | Error Python: NameError / UnboundLocalError | nameerror; name is not defined; nameerror name x is not defined; unboundlocalerror; local variable referenced before assignment; free variable referenced before assignment; nombre no definido python | python
**Causa:** usás un nombre que Python no conoce en ese punto.
- Typo o mayúsculas distintas (`Print`, `lenght`).
- Falta el `import` (`name 'math' is not defined` → `import math`).
- Usaste la variable **antes** de definirla, o la definiste dentro de una función/`if` que no se ejecutó.
- Las cadenas sin comillas: `print(hola)` busca una variable `hola`.
- `UnboundLocalError`: asignás a una variable dentro de una función y también la leés antes (Python la trata como local). Usá `global`/`nonlocal` o pasala como argumento.

```

=== err-py-type | Error Python: TypeError | typeerror; unsupported operand type(s); can only concatenate str; cannot concatenate; nonetype object is not subscriptable; nonetype object is not callable; nonetype object is not iterable; object is not callable; missing 1 required positional argument; takes 0 positional arguments but 1 was given; takes 2 positional arguments but 3 were given; not subscriptable; unhashable type; int object is not iterable; str object is not callable; can't multiply sequence by non-int | python
**Causa:** aplicás una operación a un tipo que no la admite.

| Mensaje | Causa | Arreglo |
|---|---|---|
| `unsupported operand type(s) for +: 'int' and 'str'` / `can only concatenate str (not "int")` | sumás número con texto | `str(n)` o `int(s)`, o un f-string |
| `'NoneType' object is not subscriptable/iterable/callable` | la variable vale `None` (una función sin `return`, `lista.sort()` devuelve `None`, `x = x.append(1)`) | revisá qué devuelve la función |
| `'int' object is not callable` / `'str' object is not callable` | pisaste una función con una variable (`sum = 5; sum([1,2])`) o pusiste `()` de más | renombrá la variable |
| `missing 1 required positional argument` | llamaste sin un parámetro obligatorio | pasá el argumento |
| `takes 0 positional arguments but 1 was given` | en un método de clase falta `self` | `def metodo(self):` |
| `'int' object is not iterable` | `for x in 5` | `range(5)` |
| `unhashable type: 'list'` | usaste una lista como clave de dict / elemento de set | usá una tupla |
| `can't multiply sequence by non-int of type 'str'` | `"a" * "3"` | `int("3")` |

```python
edad = input("Edad: ")        # siempre texto
print(edad + 1)               # TypeError: can only concatenate str
print(int(edad) + 1)          # correcto
```

=== err-py-key-index | Error Python: KeyError, IndexError, AttributeError, ValueError | keyerror; indexerror; list index out of range; attributeerror; object has no attribute; valueerror; invalid literal for int() with base 10; too many values to unpack; not enough values to unpack; zerodivisionerror; division by zero; tuple index out of range; string index out of range; math domain error; could not convert string to float | python
- **`KeyError: 'x'`** — la clave no existe en el diccionario. Usá `d.get("x", defecto)` o comprobá `if "x" in d`.
- **`IndexError: list index out of range`** — índice ≥ `len(lista)` o la lista está vacía. Los índices válidos van de `0` a `len-1`. Revisá bucles `range(len(l)+1)`.
- **`AttributeError: 'X' object has no attribute 'y'`** — el objeto no tiene ese atributo/método: typo (`.lenght`), tipo equivocado (`'list' has no attribute 'split'`), o es `None` (`'NoneType' object has no attribute 'x'`).
- **`ValueError: invalid literal for int() with base 10: 'abc'`** — el texto no es un número. Validá con `try/except` o `str.isdigit()`.
- **`ValueError: too many/not enough values to unpack`** — cantidad de variables ≠ cantidad de valores.
- **`ZeroDivisionError`** — dividiste por 0; comprobá el divisor.
- **`ValueError: math domain error`** — `math.sqrt(-1)`, `math.log(0)`.

```python
try:
    n = int(input("Número: "))
except ValueError:
    print("Eso no es un número")
```

=== err-py-module | Error Python: ModuleNotFoundError / ImportError | modulenotfounderror; no module named; importerror; cannot import name; partially initialized module; circular import; import circular; no module named pip; no module named requests; no module named numpy; no module named cv2; no module named 'yaml'; no module named 'dotenv' | python
**`ModuleNotFoundError: No module named 'x'`**
1. **No está instalado**: `pip install x` (ojo con el nombre del paquete: `cv2` → `opencv-python`, `yaml` → `pyyaml`, `PIL` → `pillow`, `sklearn` → `scikit-learn`, `dotenv` → `python-dotenv`, `bs4` → `beautifulsoup4`).
2. Lo instalaste en **otro Python** o fuera del entorno virtual. Usá `python -m pip install x` con el mismo intérprete que ejecuta tu script y activá el venv.
3. Tu archivo se llama igual que el módulo (`requests.py`, `random.py`): renombralo y borrá la carpeta `__pycache__`.
4. Importar un módulo propio desde otra carpeta: falta `__init__.py` o ejecutá desde la raíz con `python -m paquete.modulo`.

**`ImportError: cannot import name 'X' from 'Y'`**: el nombre no existe en ese módulo (versión distinta) o hay un **import circular** (A importa B y B importa A: `partially initialized module`). Mové el import dentro de la función o reorganizá el código.

```bash
python -c "import sys; print(sys.executable)"     # qué Python estás usando
python -m pip install requests
```

=== err-py-files | Error Python: FileNotFoundError, PermissionError y UnicodeDecodeError | filenotfounderror; no such file or directory; permissionerror; permission denied; unicodedecodeerror; utf-8 codec can't decode; charmap codec can't decode; unicodeencodeerror; isadirectoryerror; ruta relativa; directorio de trabajo | python
- **`FileNotFoundError: [Errno 2] No such file or directory: 'datos.txt'`**: el archivo no está donde Python lo busca. Las rutas relativas se resuelven desde el **directorio actual** (no desde donde está el script). Comprobalo:
  ```python
  import os, pathlib
  print(os.getcwd())                          # dónde estoy parado
  ruta = pathlib.Path(__file__).parent / "datos.txt"    # ruta relativa al script
  ```
- **`PermissionError`**: sin permisos, o el archivo está abierto en otro programa (Excel en Windows), o intentás abrir una carpeta como archivo.
- **`UnicodeDecodeError: 'utf-8' codec can't decode byte…` / `'charmap' codec can't decode`**: el archivo tiene otra codificación. Probá `open(f, encoding="latin-1")` o `encoding="utf-8-sig"`, `errors="replace"`; al escribir indicá `encoding="utf-8"`.

=== err-java-npe | Error Java: NullPointerException y compañía | nullpointerexception; npe; arrayindexoutofboundsexception; indexoutofboundsexception; classcastexception; numberformatexception; concurrentmodificationexception; arithmeticexception; illegalargumentexception; java.lang; exception in thread main; stackoverflowerror; outofmemoryerror; for input string | java
- **`NullPointerException`**: usás un objeto que vale `null`. Leé el *stack trace*: indica la clase y **línea** exacta. Causas: variable sin inicializar, método que devolvió `null`, elemento de un array de objetos sin crear (`new Persona[3]` crea 3 nulos). Soluciones: comprobar `if (x != null)`, usar `Optional`, inicializar; con Java 14+ el mensaje dice qué variable es null.
- **`ArrayIndexOutOfBoundsException: Index 5 out of bounds for length 5`**: índices válidos `0..length-1` (bucles con `<=` en vez de `<`).
- **`NumberFormatException: For input string: "abc"`**: `Integer.parseInt` con texto no numérico (o con espacios: usá `trim()`).
- **`ClassCastException`**: casteaste a una clase incompatible; comprobá con `instanceof`.
- **`ConcurrentModificationException`**: modificaste una colección mientras la recorrías con for-each; usá `Iterator.remove()` o `removeIf`.
- **`ArithmeticException: / by zero`**: división entera por 0.
- **`StackOverflowError`**: recursión infinita. **`OutOfMemoryError`**: memoria agotada (`-Xmx`) o fuga.
--- más
Cómo leer un stack trace de Java: la primera línea es la excepción y el mensaje; las líneas `at paquete.Clase.metodo(Archivo.java:12)` van de lo más reciente hacia atrás: buscá la primera que sea **tu** código.

=== err-c-segfault | Error C/C++: Segmentation fault (core dumped) | segmentation fault; segfault; core dumped; sigsegv; violación de segmento; falla de segmentación; stack smashing detected; double free; free(): invalid pointer; munmap_chunk; sigabrt; malloc(): corrupted; heap corruption; buffer overflow; use after free; bus error | c,cpp
**Causa:** el programa accedió a memoria que no le pertenece.

Causas frecuentes:
1. Desreferenciar un puntero **nulo o sin inicializar** (`int *p; *p = 5;`).
2. Salirte de un arreglo (`a[10]` en uno de tamaño 10) o desbordar un buffer (`strcpy` a un arreglo chico, `scanf("%s")`).
3. Usar memoria ya liberada (*use-after-free*) o liberarla dos veces (*double free*).
4. Recursión infinita (agota el stack).
5. `scanf("%d", n)` en vez de `scanf("%d", &n)`.
6. Modificar un literal de cadena (`char *s = "hola"; s[0] = 'H';`).

**Cómo encontrarlo:**
```bash
gcc -g -O0 -Wall -Wextra -fsanitize=address,undefined programa.c -o programa && ./programa
# AddressSanitizer imprime la línea exacta y el tipo de error
valgrind ./programa          # alternativa
gdb ./programa               # run, y luego bt (backtrace) al fallar
```
--- más
Siempre inicializá punteros (`NULL`), comprobá el resultado de `malloc`, y después de `free(p)` poné `p = NULL`.

=== err-git | Errores comunes de Git | fatal: not a git repository; failed to push some refs; rejected non-fast-forward; updates were rejected; detached head; head detached; refusing to merge unrelated histories; index.lock file exists; unable to create index.lock; your local changes would be overwritten; please commit your changes or stash them; pathspec did not match; permission denied (publickey); authentication failed; support for password authentication was removed; file exceeds github's file size limit; nothing to commit; src refspec does not match any; fatal: remote origin already exists; error: failed to push | general
| Mensaje | Qué hacer |
|---|---|
| `fatal: not a git repository` | no estás dentro de un repo: `cd` a la carpeta correcta o `git init` |
| `! [rejected] … (non-fast-forward)` / `failed to push some refs` | el remoto tiene commits nuevos: `git pull --rebase` y luego `git push` |
| `HEAD detached at …` | estás en un commit suelto, no en una rama: `git switch -c mi-rama` para conservar lo que hagas, o `git switch main` |
| `refusing to merge unrelated histories` | dos repos sin ancestro común: `git pull origin main --allow-unrelated-histories` |
| `Unable to create '.git/index.lock': File exists` | otro Git quedó colgado: cerralo y, si no hay ninguno, `rm .git/index.lock` |
| `Your local changes would be overwritten by checkout/merge` | `git stash` (o commit) antes de cambiar de rama/mergear; después `git stash pop` |
| `error: pathspec 'x' did not match any file(s)` | ese archivo/rama no existe: revisá el nombre (`git branch -a`, `git status`) |
| `src refspec main does not match any` | todavía no hay commits o la rama se llama `master`: hacé un commit primero |
| `fatal: remote origin already exists` | `git remote set-url origin URL` |
| `Permission denied (publickey)` | tu clave SSH no está registrada en GitHub: ver "SSH" |
| `Authentication failed` / `Support for password authentication was removed` | GitHub no acepta contraseñas: usá SSH o un *Personal Access Token* |
| `File … exceeds GitHub's file size limit of 100 MB` | no subas archivos pesados: sacalos del historial (`git rm --cached`, y `git filter-repo`/BFG) y usá Git LFS |
| `nothing to commit, working tree clean` | no hay cambios: no es un error |
--- más
Antes de reescribir historia o forzar un push, hacé una copia (`git branch backup`). Casi todo se recupera con `git reflog`.

=== err-permisos-linux | Errores de terminal: Permission denied, command not found, No such file | permission denied; command not found; no such file or directory; bad interpreter; bash: ./script.sh: permission denied; is a directory; operation not permitted; not in the sudoers file; sudo command not found; /bin/bash^M; cannot execute binary file; exec format error; no space left on device; read-only file system | general
- **`Permission denied`** al ejecutar `./script.sh`: dale permiso → `chmod +x script.sh`. Al leer/escribir: falta permiso sobre el archivo/carpeta (`ls -l`; `sudo` o `chown`). En un archivo del sistema usá `sudo`.
- **`command not found`**: el programa no está instalado o no está en el `PATH`. Instalalo (`sudo apt install …`), o ejecutalo con su ruta (`./programa`); revisá mayúsculas y tipeo.
- **`No such file or directory`**: ruta mal escrita, estás en otra carpeta (`pwd`, `ls`), o el script tiene saltos de línea de Windows (CRLF): `/bin/bash^M: bad interpreter` → `dos2unix script.sh` o `sed -i 's/\r$//' script.sh`.
- **`No space left on device`**: disco lleno → `df -h` para ver qué partición y `du -sh * | sort -h` para ver qué ocupa; limpiá caché de paquetes, logs (`journalctl --vacuum-size=200M`), Docker (`docker system prune`).
- **`exec format error` / `cannot execute binary file`**: el binario es de otra arquitectura (p. ej. ARM vs x86) o no es un ejecutable.
- **`is not in the sudoers file`**: tu usuario no puede usar `sudo`; otro administrador debe agregarlo al grupo `sudo`/`wheel`.
- **`Read-only file system`**: el sistema se montó solo lectura (disco con errores, o imagen live USB).

| `The container name "/x" is already in use` | `docker rm -f x` o usá otro `--name` |
| `Exited (1)` / `Exited (137)` | mirá `docker logs <contenedor>`; 137 = lo mató por falta de memoria (OOM) |
| `no space left on device` | `docker system prune -a --volumes` (¡borra lo no usado!) |

| Mensaje | Causa y solución |

| `You have an error in your SQL syntax … near 'X'` / `syntax error at or near` | error de sintaxis justo **antes** del fragmento citado: coma de más/de menos, palabra reservada como nombre de columna (usá comillas o renombrá), comillas mal cerradas |
| `Unknown column 'x'` / `column "x" does not exist` | nombre de columna mal escrito o en otra tabla; en Postgres las comillas dobles `"X"` respetan mayúsculas |

=== err-ssl-red | Errores de red y certificados (SSL, conexión rechazada, timeout) | connection refused; econnrefused; connection timed out; etimedout; enotfound; getaddrinfo; name or service not known; could not resolve host; ssl certificate problem; certificate_verify_failed; err_cert_authority_invalid; err_connection_refused; err_name_not_resolved; no route to host; connection reset; econnreset; host key verification failed; network unreachable; err_ssl_protocol_error; self signed certificate | general
| Error | Qué significa / qué probar |
|---|---|
| `Connection refused` / `ECONNREFUSED` / `ERR_CONNECTION_REFUSED` | la máquina responde pero **nada escucha en ese puerto**: el servidor no está corriendo, puerto equivocado, o escucha solo en `127.0.0.1` y vos entrás desde afuera (dentro de Docker usá `0.0.0.0`) |
| `Connection timed out` / `ETIMEDOUT` | los paquetes no llegan: firewall, IP/puerto incorrectos, servidor caído o red bloqueada |
| `ENOTFOUND` / `getaddrinfo` / `Could not resolve host` / `ERR_NAME_NOT_RESOLVED` | **DNS**: el nombre no se resuelve (typo en el dominio, sin internet, DNS caído) |
| `ECONNRESET` / `Connection reset by peer` | el otro extremo cortó la conexión (servidor reiniciado, timeout del proxy, petición inválida) |
| `CERTIFICATE_VERIFY_FAILED` / `ERR_CERT_AUTHORITY_INVALID` / `self signed certificate` | el certificado no es de confianza o venció: instalá la CA, renová el certificado, o en desarrollo (¡solo ahí!) desactivá la verificación. Si el reloj del equipo está mal, también falla |
| `Host key verification failed` (SSH) | la huella del servidor cambió: si esperabas el cambio, `ssh-keygen -R servidor` |
| `No route to host` | no hay ruta de red hacia esa IP (VPN, subred, firewall) |

```bash
ping servidor              # ¿hay conectividad?
nslookup dominio.com       # ¿resuelve el DNS?
curl -v https://dominio.com    # ver el detalle de la conexión y el certificado
nc -zv host 5432           # ¿está abierto el puerto?
```

=== err-css-no-aplica | Mi CSS o mi JavaScript no funciona (checklist) | mi css no funciona; css no se aplica; estilos no se aplican; mi javascript no funciona; el botón no hace nada; no pasa nada al hacer click; la imagen no carga; script no carga; cambios no se ven; caché del navegador; ctrl f5; no se actualiza la página; f12 consola; archivo no se encuentra 404 en css | general
**Checklist de 2 minutos** (casi siempre es una de estas):
1. **Abrí la consola (F12)**: pestaña *Console* (errores de JS) y *Network* (¿algún archivo da 404? ¿rutas mal?).
2. **Rutas**: `<link href="estilos.css">` y `<script src="app.js">` son relativas a la ubicación del HTML. Mayúsculas y minúsculas importan en servidores Linux (`Foto.JPG` ≠ `foto.jpg`).
3. **Caché**: forzá la recarga con `Ctrl + F5` (o `Ctrl + Shift + R`); en DevTools → Network → *Disable cache*.
4. **Selectores**: ¿el `id`/clase del CSS o del JS es idéntico al del HTML? `.caja` es clase, `#caja` es id.
5. **Orden de carga**: el `<script>` debe ir al final del `<body>` o con `defer`; si no, el JS corre antes de que existan los elementos.
6. **Especificidad**: otra regla más específica o posterior te está pisando; inspeccioná el elemento (clic derecho → Inspeccionar) y mirá qué estilos aparecen tachados.
7. **Sintaxis**: un `}` o `;` faltante en el CSS rompe **todas** las reglas siguientes; un error de JS detiene el resto del script.
8. **Guardaste el archivo?** ¿Estás abriendo el archivo correcto / la carpeta correcta?
9. `<meta name="viewport">` ausente: en el celular se ve distinto.

=== depurar-metodo | Cómo depurar: método para encontrar bugs | mi código no funciona; mi programa no anda; no anda; no funciona; no me sale; tengo un bug; qué hago si no funciona; ayuda con mi código; cómo depurar; depuración; debugging; cómo encontrar un bug; mi código no funciona; no sé por qué falla; pasos para depurar; rubber duck; print debugging; breakpoint; bisect; reproducir el error; leer el error; stack trace; buscar el error | general
Método que funciona casi siempre:
1. **Leé el mensaje de error completo**: tipo de error, mensaje y **archivo:línea**. La respuesta suele estar ahí. En un *stack trace*, buscá la primera línea que sea de **tu** código.
2. **Reproducilo** de forma fiable y con el ejemplo más chico posible (reducí hasta que desaparezca el ruido).
3. **Formulá una hipótesis** ("`usuario` vale `None` en la línea 12") y **comprobala**, no cambies código al azar.
4. **Observá**: `print`/`console.log` de las variables clave, o un **depurador** con breakpoints (VS Code: F5; Python: `breakpoint()`; navegador: pestaña *Sources*).
5. **Dividí el problema** (búsqueda binaria): comentá la mitad del código o fijate en qué punto los datos dejan de ser los esperados. En Git, `git bisect` encuentra el commit que introdujo el bug.
6. **Revisá lo "imposible"**: ¿guardaste el archivo? ¿ejecutás la versión correcta? ¿entorno/variables/ruta correctos? ¿cacheado?
7. **Explicalo en voz alta** (a un compañero o a un patito de goma): al describir el problema suele aparecer la causa.
8. **Buscá el mensaje exacto** (entre comillas) en un buscador o en Stack Overflow, quitando las partes específicas de tu proyecto.
9. Cuando lo arregles, **escribí un test** que lo cubra y entendé *por qué* fallaba.

```python
# pip install pygame
import pygame
pygame.init()
pantalla = pygame.display.set_mode((640, 400))
reloj = pygame.time.Clock()
jugador = pygame.Rect(300, 350, 50, 20)
cosa = pygame.Rect(100, 0, 20, 20)
puntos = 0

corriendo = True
while corriendo:
    for e in pygame.event.get():                  # 1) entrada
        if e.type == pygame.QUIT:
            corriendo = False
    teclas = pygame.key.get_pressed()
    jugador.x += (teclas[pygame.K_RIGHT] - teclas[pygame.K_LEFT]) * 6
    cosa.y += 4                                   # 2) actualizar
    if cosa.colliderect(jugador):
        puntos += 1; cosa.update(100 + puntos * 37 % 500, 0, 20, 20)
    if cosa.y > 400:
        cosa.update(100, 0, 20, 20)
    pantalla.fill((20, 20, 30))                   # 3) dibujar
    pygame.draw.rect(pantalla, (80, 200, 120), jugador)
    pygame.draw.rect(pantalla, (240, 90, 90), cosa)
    pygame.display.flip()
    reloj.tick(60)                                # 60 fps
pygame.quit()
```

```python
# pip install anthropic
import anthropic
client = anthropic.Anthropic()            # lee ANTHROPIC_API_KEY del entorno

mensaje = client.messages.create(
    model="claude-opus-5-5",
    max_tokens=1024,
    system="Sos un asistente de programación conciso.",
    messages=[{"role": "user", "content": "Explicame qué es un decorador en Python"}],
)

# respuesta en streaming

                            messages=[{"role": "user", "content": "Hola"}]) as s:
    for texto in s.text_stream:
        print(texto, end="", flush=True)
```

// npm i @anthropic-ai/sdk
import Anthropic from "@anthropic-ai/sdk";

  model: "claude-opus-5-5",

});

- Para una **conversación**, guardá y reenviá todo el historial en `messages` (alternando `user` / `assistant`): el modelo no recuerda nada entre llamadas.

4. Probá el modo "Try" y, si te gusta, ejecutá el instalador.

void setup() { pinMode(LED_BUILTIN, OUTPUT); Serial.begin(9600); }
void loop() {
  digitalWrite(LED_BUILTIN, HIGH); delay(500);
  digitalWrite(LED_BUILTIN, LOW);  delay(500);
  int lectura = analogRead(A0);          // 0..1023
  Serial.println(lectura);

```rust
use std::collections::HashMap;
use std::fs;

#[derive(Debug, Clone)]
struct Persona { nombre: String, edad: u32 }

enum Forma { Circulo(f64), Rectangulo(f64, f64) }

fn area(f: &Forma) -> f64 {
    match f {                                  // match es exhaustivo: hay que cubrir todos los casos
        Forma::Circulo(r) => std::f64::consts::PI * r * r,
        Forma::Rectangulo(a, b) => a * b,
    }
}

trait Saludar { fn saludar(&self) -> String; }
impl Saludar for Persona {
    fn saludar(&self) -> String { format!("Hola, soy {}", self.nombre) }
}

fn leer(ruta: &str) -> Result<String, std::io::Error> {
    let texto = fs::read_to_string(ruta)?;     // ? propaga el error al llamador
    Ok(texto.trim().to_string())
}

fn main() {
    let nums = vec![1, 2, 3, 4, 5];
    let pares: Vec<i32> = nums.iter().filter(|n| *n % 2 == 0).map(|n| n * 10).collect();
    println!("{:?}", pares);                   // [20, 40]

    let mut edades: HashMap<String, u32> = HashMap::new();
    edades.insert("ana".to_string(), 30);
    match edades.get("ana") {                  // get devuelve Option<&u32>
        Some(e) => println!("tiene {e}"),
        None => println!("no está"),
    }

    let p = Persona { nombre: "Ana".into(), edad: 30 };
    println!("{} · {:.2}", p.saludar(), area(&Forma::Circulo(2.0)));

    match leer("datos.txt") {
        Ok(t) => println!("{t}"),
        Err(e) => eprintln!("error: {e}"),
    }
}
```

```cpp
#include <iostream>
#include <vector>
#include <map>
#include <unordered_map>
#include <string>
#include <algorithm>
#include <memory>
#include <optional>

struct Persona { std::string nombre; int edad; };

std::optional<int> buscar(const std::vector<int>& v, int x) {      // const& evita copiar
    auto it = std::find(v.begin(), v.end(), x);
    if (it == v.end()) return std::nullopt;
    return static_cast<int>(it - v.begin());
}

int main() {
    std::vector<int> v = {5, 2, 9, 1};
    v.push_back(7);
    std::sort(v.begin(), v.end());                                  // 1 2 5 7 9
    std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; }); // lambda: descendente

    std::map<std::string, int> m;                                   // ordenado por clave
    m["ana"] = 30;
    std::unordered_map<std::string, int> h{{"luis", 25}};           // tabla hash
    for (const auto& [clave, valor] : m) std::cout << clave << "=" << valor << "\n";   // C++17

    std::vector<Persona> gente = {{"Ana", 30}, {"Luis", 25}};
    std::sort(gente.begin(), gente.end(), [](const Persona& a, const Persona& b) { return a.edad < b.edad; });

    auto p = std::make_unique<Persona>(Persona{"Eva", 40});          // se libera sola
    std::cout << p->nombre << "\n";

    if (auto i = buscar(v, 5)) std::cout << "en " << *i << "\n";
    int suma = 0; for (int x : v) suma += x;                         // range-for
}
// g++ -std=c++20 -Wall -Wextra -O2 main.cpp -o main
```
--- más
- Preferí `std::vector` / `std::string` a arreglos y `char*`; `std::array` para tamaño fijo.
- Reglas: no uses `new/delete` a mano (`make_unique`/`make_shared`), pasá objetos grandes por `const&`, usá `auto` y *range-for*, y marcá `const` lo que no cambia.
- `std::move` transfiere recursos en vez de copiarlos. `#include <bits/stdc++.h>` es solo para concursos (no estándar).
