name: Construir ISO de Infinity OS

# Cómo usarlo (desde Windows, sin instalar nada):
#   1. En GitHub: pestaña "Actions" -> "Construir ISO de Infinity OS" -> "Run workflow".
#   2. Espera ~15-25 min. Al terminar, entra a la ejecución y baja el archivo de "Artifacts".
#   3. Para una versión "oficial": crea una etiqueta (tag) v4.3.0 y la ISO se publica en "Releases".

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "build/**"
      - "overlay/**"
      - "overlay-pre/**"
      - "shell/**"
      - "branding/**"
      - "VERSION"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: write # solo se usa para publicar la ISO en "Releases" cuando hay un tag

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de la lógica del shell
        run: python3 -m unittest discover -s shell/tests -v

      - name: Instalar herramientas de construcción
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin rsync

      - name: Liberar espacio en el runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Construir la ISO
        env:
          # Opcional: secreto del repositorio con tu clave de Gemini; si existe, pAnkI viene ya configurado
          # y la ISO NO debe compartirse (la lleva dentro).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: sudo --preserve-env=GEMINI_API_KEY ./build/build.sh

      - name: Resumen
        run: |
          ls -lh out/
          cat out/*.sha256
          {
            echo "### ISO construida"
            echo '```'
            ls -lh out/
            cat out/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir ISO como artefacto
        # Solo en push a main: ahí el artefacto es la única forma de bajar la ISO. En una versión con tag
        # o en un dispatch manual la ISO va a Releases (permanente), así que aquí se OMITE para no gastar
        # la cuota de artefactos (~1,2 GB cada una la agotaba y hacía fallar el build).
        if: ${{ github.event_name != 'workflow_dispatch' && ! startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: infinity-os-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0 # la ISO ya está comprimida
          retention-days: 1   # las ISO pesan ~1,2 GB: con 7 días se agota la cuota de almacenamiento de GitHub
          if-no-files-found: error

      - name: Publicar la ISO en Releases
        # Con un tag v* (versión oficial) o con un dispatch manual (build personal "rodante"). En ambos
        # casos la ISO queda en Releases, que no gasta la cuota de artefactos y da un enlace permanente.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Dispatch manual: la versión sale de VERSION y se REEMPLAZA en cada reconstrucción (una sola
            # Release "última ISO", sin acumular). El tag se recrea apuntando al commit construido.
            TAG="v$(cat VERSION)"
            gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          fi
          gh release create "$TAG" out/*.iso out/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Infinity OS $TAG" \
            --notes "ISO en vivo de Infinity OS (commit ${GITHUB_SHA:0:7}). Verifica la descarga con el archivo .sha256. Instrucciones en el README."
